5〜5.0の範囲であっても、可能であれば2.5未満となるように努める。\n運用上の目安として、1日の振動作業時間は2時間以内が望ましい。加えて、連続作業は10〜30分以内に抑えることが望ましい。","d":"A"},{"id":593,"cat":"振動","q":"日振動曝露量の求め方は？","a":"a：周波数補正振動加速度実効値の3軸合成値。工具の説明書や製造元HPなどで確認する（単位はm/s2）。目安として6か月に1度見直す。\nT：1日の作業時間。\n限界値：5.0m/s2を超えないように、工具の選定と作業時間を設定する。\nまた、A(8)の値にかかわらず、1日の振動作業時間は原則として2時間以内とする。","d":"A"},{"id":595,"cat":"振動","q":"振動特殊健診は？","a":"実施は義務ではないが、行政的に実施が指導・勧奨されている。\n実施時期：雇入れ時、配置替え時、以後は6〜12か月ごとに1回を目安に行う。\n主な項目\n・職歴、既往歴の確認\n・視診・触診（爪や指の変形、皮膚・関節の異常など）\n・握力検査\n・末梢循環検査（手指の皮膚温、爪圧迫など）\n・末梢神経機能検査（痛覚、振動覚など）\n・手関節・肘関節のXp","d":"A"},{"id":597,"cat":"振動","q":"振動と時間の関係について","a":"日振動ばく露量A（8）が、日振動ばく露限界値である5.0m/s2を超えないように、振動ばく露時間の抑制や低振動の振動工具の選定などを行う。\nまた、5.0m/s2を超えない場合であっても、日振動ばく露対策値である2.5m/s2を超える場合は、同様に振動ばく露時間の短縮や低振動工具の採用に努める。","d":"A"},{"id":599,"cat":"振動","q":"振動 の労災認定基準は？","a":"1．振動業務に一定期間従事した後に発症した疾病であること。\n　目安は「おおむね1年、またはそれ以上の期間」。\n2．次のいずれかに当てはまる疾病であること。\n(1) 手指・前腕などに、しびれ、痛み、冷え、こわばり等の自覚症状が持続的または間欠的に出現し、かつ、次のイ～ハに示す障害がすべて認められる、または、そのうちいずれかが著明に認められるもの。\n　イ　手指・前腕等の末梢循環障害\n　ロ　手指・前腕等の末梢神経障害\n　ハ　手指・前腕等の骨・関節・筋肉・腱などの異常による運動機能障害\n(2) レイノー現象の発現が確認されるもの。","d":"B"},{"id":601,"cat":"振動","q":"振動の 労働衛生教育とは","a":"振動が人体に与える影響、\n日振動ばく露量Ａ（8）に基づく振動ばく露限界時間等の工具の適正な取扱い及び管理方法についての教育","d":"B"},{"id":603,"cat":"振動","q":"振動 障害の増悪因子3つ","a":"寒冷による身体冷却\n工具重量保持による筋緊張\n喫煙","d":"B"},{"id":606,"cat":"騒音","q":"騒音の健康障害は？","a":"騒音へのばく露により起こる、不可逆的な感音性難聴。内耳の有毛細胞が障害され、まず4000Hz付近の高音域で聴力低下が目立つ（c5 dip）。\n会話帯域（250〜2000Hz）より外側の周波数から低下するため、初期は自覚しにくいまま進行しやすい。\n・老人性難聴：2000〜8000Hzのうち、高音域から低下が進行しやすい。\n・人の可聴域：20〜20000Hz。\n・会話の周波数：250〜2000Hz。","d":"A"},{"id":608,"cat":"騒音","q":"騒音性難聴の発症原因は？","a":"80-90dBへの長時間曝露による感音性難聴\n高音圧、高周波、長時間の曝露がリスク要因。","d":"A"},{"id":610,"cat":"騒音","q":"騒音性難聴の症状","a":"初発症状は耳鳴りが多く、難聴は自覚に乏しい\n進行すると会話音域も障害される。\n補充現象（小さい音は聴こえにくく、その一方で大きい音は逆に響いて聞きにくい）が見られることもある。","d":"A"},{"id":612,"cat":"騒音","q":"騒音の健康障害防止対策を教えてください","a":"作業環境管理\n騒音発生源の除去(機械メンテナンス、防振・制振)\n騒音の伝播防止(遮音板や防音シートで遮蔽)\n騒音の指向性の改善(発生源を音が響く場所から移す)\n作業環境測定\n騒音管理区分に応じて環境を改善\n作業管理\n作業時間の制限\n適切な保護具の着用\n作業手順書の整備、周知\n健康管理\n特殊健診","d":"A"},{"id":614,"cat":"騒音","q":"R5騒音 ガイドライン上 の対策3 つ","a":"方法\n具体例\n１　\n騒音発生源対策\n発生源の低騒音化\n低騒音型機械の採用\n発生原因の除去\n給油、不釣合調整、部品交換等\n遮音\n防音カバー、ラギング等の取り付け\n消音\n消音器、吸音ダクト等の取り付け\n防振\n防振ゴムの取り付け\n制振\n制振材の装着\n運転方法の改善\n自動化、配置の変更等\n２　\n伝ぱ経路対策\n距離減衰\n配置の変更等\n遮蔽効果\n配置の変更等\n吸音\n建屋内部の消音処理\n指向性\n音源の向きの変更\n３　\n受音者対策\n遮音\n防音監視室の設置\n作業方法の改善\n作業スケジュールの調整、遠隔操作化等\n耳の保護\n耳栓、耳覆いの使用","d":"A"},{"id":616,"cat":"騒音","q":"騒音の作業環境測定は？","a":"実施頻度：6か月に1回。加えて、施設・設備・作業工程などを変更した場合は随時実施する。\n測定区分：A測定、B測定。\n測定方法：1測定点につき10分以上連続して測定し、等価騒音レベルを求める。\nA測定：作業場を縦横6m以内の等間隔で区切り、その交点をすべて測定点とする。測定高さは床上1.2〜1.5m。\nB測定：騒音発生源の近くで作業する位置（実際の作業者位置）を測定点とする。\n屋内：A測定とB測定の両方を行う。\n屋外：B測定のみ行う。","d":"A"},{"id":618,"cat":"騒音","q":"等価騒音レベルとはなんですか？","a":"変動している騒音レベルを一定時間測定し、その平均値として表した値。","d":"A"},{"id":620,"cat":"騒音","q":"騒音の管理区分は？","a":"A測定・B測定ともに85dB未満の場合は第Ⅰ管理区分。\nA測定またはB測定のいずれかで90dB以上の場合は第Ⅲ管理区分。\nこれらに当てはまらない場合は第Ⅱ管理区分。\n第Ⅱ管理区分：改善措置を講じ、区分を掲示する。必要に応じて聴覚保護具を使用させる。\n第Ⅲ管理区分：改善措置を講じ、区分に加えて「保護具が必須」である旨も掲示する。聴覚保護具の着用を義務とする。","d":"A"},{"id":622,"cat":"騒音","q":"騒音作業の許容基準は？","a":"85dBで8時間、90dBで2時間30分、100dBで15分\n3db\n増加で許容時間は半分","d":"A"},{"id":624,"cat":"騒音","q":"騒音障害防止ガイドライン改定とは？","a":"騒音健康診断の検査項目の見直し\n・4000Hzの音圧基準を40dBから25dBおよび30dBへ見直す。\n・2次検査に6000Hzを追加する。\n個人ばく露測定\n・耳の近くにばく露計を装着して測定する。\n・同種の業務につき1台以上を目安に実施する。\n・測定時間は原則として終日（難しい場合は半日）とする。\n等価騒音レベル（A測定）の推定\n・地面上に騒音源があり、周囲に遮音物がない条件では、1回の測定結果から推計できる場合がある。\n聴覚保護具の選定基準の明示\n・JIS T8161-1に基づく遮音値を目安に、選定の考え方を明確にしておく。","d":"A"},{"id":626,"cat":"騒音","q":"騒音の特殊健診の対象になるのはどういった場所ですか","a":"労働安全衛生法に基づき、一定の騒音源を扱う「特定の作業場」が定められている。例としては次のような屋内作業場が該当する。\n屋内作業場\n・鋲打ち機、はつり機など、圧縮空気で駆動される機械を取り扱う作業場\n・ロール機などを使用する作業場\n・動力で駆動するハンマーを使用する作業場\n・ドラムバーガーにより木材の削皮などを行う作業場","d":"B"},{"id":628,"cat":"騒音","q":"騒音の特殊健診の対象になるのはどういった場所ですか","a":"・屋内・屋外を問わず該当し得る作業例\n　インパクトレンチによる締め付け\n　ショットブラストによる研磨\n　チェーンソーによる伐木\n　航空機近傍での作業\nこれらの作業については、第一管理区分が継続している場合、作業環境測定や特殊健診を省略できる。","d":"B"},{"id":629,"cat":"騒音","q":"騒音作業に関する雇い入 、配置変え の健康診断の純音聴力検査の周波数は","a":"1,000 Hz、4,000 Hz 以外に次のものとなっている。\n250 ヘルツ、500 ヘルツ、2,000 ヘルツ、6,000 ヘルツ及び 8,000 ヘルツにおける聴力の検査","d":"B"},{"id":631,"cat":"騒音","q":"音圧レベルの測定の違いは？(A, C, Z)　","a":"A特性：人の聴覚特性に近づけた重み付け。可聴域を中心に補正して評価し、作業環境測定などで用いる値。\nC特性：周波数補正が比較的平坦で、大きな音（低周波成分も含む）の評価で用いられる。\nZ特性：重み付けを行わない（フラット）評価で、より物理的な音圧の把握に用いる。","d":"B"},{"id":633,"cat":"騒音","q":"聴覚保護具について","a":"・発泡タイプ（ウレタンフォーム）\n　安価で、正しく装着できれば遮音性能は高い。\n・形成タイプ\n　洗って繰り返し使える。遮音性能はおおむね良好。\n耳覆い（イヤーマフ）\n　脱着が簡単で、騒音源に短時間近づく作業などで使いやすい。耳栓との併用も可能。NC機能付きの製品もある。\n　ヘルメットと併用できない。","d":"A"},{"id":635,"cat":"騒音","q":"聴力保護具に関して選び方を教えてください　","a":"・作業環境測定の結果（騒音レベル）からSNR値を差し引いた推定ばく露が、70〜80dBとなるような遮音性能のものを選ぶ。\n・音圧レベルについてもJIS規格で一定の規定があるため、それに適合した製品を選定する。\n・着用感が良く、長時間の使用でも負担になりにくいか（痛み、圧迫感、蒸れ、会話のしやすさ等）も確認する。","d":"A"},{"id":637,"cat":"騒音","q":"聴力保護具に関して選び方を教えてください","a":"聴覚保護具の選択と着用方法で意識すべき点は、次の4つ。\n①　JISに規定する試験方法で測定された遮音値を目安にし、必要かつ十分な遮音性能のものを選ぶ。\n②　危険作業などで周囲の音を把握する必要がある場合や、会話が必要な場合は、遮音値が過大な聴覚保護具を避けるなどの配慮を行う。\n③　管理者が、労働者に対して聴覚保護具の正しい使用方法を指導できるようにする。\n④　管理者は、③の教育を受けさせたうえで、目視などにより聴覚保護具が適切に装着・使用されていることを確認する。","d":"A"},{"id":638,"cat":"騒音","q":"聴覚保護具の使用における注意","a":"・破損や劣化がないかを確認する。\n・正しい装着方法で着用できているかを確認する。\n・必要に応じてフィットテストを実施し、想定した遮音値が確保できているかを確認する。","d":"A"},{"id":640,"cat":"騒音","q":"騒音対策にコストをかけられない場合どうすれば良いですか？","a":"発生源については、定期的な点検を行い、制振化や運転方法の見直しなどで騒音の発生自体を抑える。\nあわせて、音源の向き（騒音が向かう方向）を調整し、作業者側へ直接届きにくい配置・向きにするなどの工夫を行う。","d":"B"},{"id":642,"cat":"騒音","q":"騒音の労働衛生教育は？","a":"騒音の人体に及ぼす作用\n防音保護具の使用方法","d":"B"},{"id":644,"cat":"騒音","q":"屋外でも作業環境測定をするか","a":"個人ばく露測定\n新しいガイドライン（通達）では測定を実施する扱いになっていますが、そこで求められているのは「個人ばく露測定による等価騒音レベルの測定」であり、厳密には作業環境測定そのものではありません。\nただし、見直し案では「屋外の作業場における個人ばく露測定および測定結果の評価、測定結果の記録は、屋内作業場で行う作業環境測定に準じて実施する」と整理されているため、実務上は作業環境測定に近い枠組みで扱われ、解答としても正答扱いとなる可能性があります。","d":"B"},{"id":646,"cat":"騒音","q":"騒音源の数が2倍になると、距離が2倍、3倍になると、dbは？","a":"騒音の基本的な目安としては次のとおり。\n・同じ大きさの騒音源が2つ（数が2倍）になると、騒音レベルは約3 dB上がる。\n・点音源で自由空間（反射が少ない環境）では、距離による減衰が起こる。\n　距離が2倍になると約6 dB低下し、距離が3倍になると約10 dB低下する。","d":"B"},{"id":648,"cat":"騒音","q":"物理的な音の強さと音の聞こえ方が周波数でどう変わるか","a":"物理的な音の強さ（音圧）が同じでも、感覚的な大きさ（ラウドネス）は周波数によって変わる。\n周波数を変えても「同じ大きさに聞こえる」と感じられる音圧レベルの関係を、等ラウドネスレベルと呼ぶ。\n一般に、低い周波数の音は同じ音圧でも小さく感じやすい。一方で3000〜4000Hz付近は大きく聞こえやすく、さらに高い周波数（例：20kHz以上）では再び聞こえにくくなる。","d":"B"},{"id":651,"cat":"酸素欠乏","q":"酸素欠乏作業とは？","a":"酸素欠乏：空気中の酸素濃度が18％未満の状態。この環境での作業は第1種酸素欠乏危険作業に該当する。\n酸素欠乏等：酸素欠乏に加えて、硫化水素濃度が10ppmを超える状態。この環境での作業は第2種酸素欠乏危険作業に該当する。\n令和5年度は被災者4名と発生件数自体は多くない一方、4名中4名が死亡しており、ひとたび発生すると致死率が高い。","d":"A"},{"id":653,"cat":"酸素欠乏","q":"酸素欠乏・酸素欠乏等が起こる場所は","a":"第1種酸素欠乏危険場所（酸欠のみ）\n・腐泥層近くの井戸\n・ケーブル、石炭、鋼鉄、原木などを保管している暗渠等\n・ドライアイスを使用する冷蔵・冷凍庫\n・穀物、飼料を貯蔵した倉庫\n第2種酸素欠乏危険場所（酸欠＋硫化水素中毒）\n・海水が貯留した暗渠、ピット\n・し尿、腐泥、汚水、パルプ液を入れたことのあるタンク","d":"A"},{"id":655,"cat":"酸素欠乏","q":"酸欠、硫化水素中毒の症状は？","a":"16‐12％：頭痛、悪心\n12‐8％\n：\nめまい、筋力低下\n8‐6％：意識消失\n6％\n：\n呼吸停止\n硫化水素中毒\n10ppm\n：\n眼の粘膜刺激\n200ppm\n：\n気道粘膜の痛み\n400ppm\n：\n1hで生命の危険\n700ppm\n：\n呼吸停止","d":"A"},{"id":657,"cat":"酸素欠乏","q":"酸素欠乏症等の措置","a":"作業開始前に、作業主任者が濃度を確認する。\n作業の前後では、人員数を点呼などで把握し、欠員がないか確認する。\n事故が起きた場合は、まず退避を優先し、救助時の二次災害を防ぐ措置を徹底する。\n事故後は、所轄の労基署へ届出を行う。","d":"A"},{"id":659,"cat":"酸素欠乏","q":"酸素欠乏の防止対策を教えてください","a":"作業環境測定\n作業開始前にO\n2\n, H\n2\nS濃度測定\nO\n2\n濃度を18%以上、H\n2\nS濃度を10ppm以下に\n継続的な換気(純酸素NG)\n作業管理\n作業主任者を選任し、作業方法の決定、労働者の指揮\n空気呼吸器等、ハシゴ、ロープ等の事故時に救出をするために必要な用具を備える。\n関係者以外の立ち入り禁止、明示\n作業前後に労働者の人員を点検\n健康管理\n早期発見のために監視人を置く","d":"A"},{"id":661,"cat":"酸素欠乏","q":"酸欠等の保護具は？","a":"酸素濃度が18％以下となるおそれがある場合は、ろ過式ではなく吸気式の呼吸用保護具を選ぶ。\n例として、空気呼吸器、酸素呼吸器、ホースマスク、エアラインマスクなどが該当する。","d":"A"},{"id":663,"cat":"酸素欠乏","q":"酸素欠乏危険作業主任者の業務を教えてください","a":"濃度測定\n器具及び設備の点検\n呼吸器の使用状況を監視。","d":"A"},{"id":665,"cat":"酸素欠乏","q":"酸素欠乏","a":"危険作業主任者の業務を教えてください　\n作業に従事する労働者が酸素欠乏の空気を吸入しないように、作業の方法を決定し、労働者を指揮すること。\nその日の作業を開始する前、作業に従事するすべての労働者が作業を行う場所を離れた後再び作業を開始する前及び労働者の身体、換気装置等に異常があったときに、作業を行う場所の空気中の酸素の濃度を測定すること。\n測定器具、換気装置、空気呼吸器等その他労働者が酸素欠乏症にかかることを防止するための器具又は設備を点検すること。\n空気呼吸器等の使用状況を監視すること。","d":"A"},{"id":666,"cat":"酸素欠乏","q":"酸欠・酸欠等の特別教育の内容","a":"酸欠等の発生原因\n酸欠等の症状\n空気呼吸器の使用方法\n事故発生時の退避や救急蘇生の方法等","d":"A"},{"id":668,"cat":"酸素欠乏","q":"一酸化炭素中毒とは？","a":"不完全燃焼で発生する一酸化炭素は無色無臭で、ヘモグロビンと強く結合して酸素運搬を妨げる。症状は頭痛、めまい、意識消失から死亡に至ることもある。\n発生しやすい場面\n・換気が不十分な場所での火気使用\n・トンネル内などでのガソリンエンジン使用\n・コンクリート養生のための練炭使用 など\n主な対策\n・地下やトンネル内などで燃焼機器を使用しない（可能なら電動化）\n・十分な換気を確保する\n・COガス濃度計で濃度を確認する（TLV-TWA 25ppm）\n・作業手順書を作成し、遵守する\n・必要に応じて呼吸用保護具を使用する（CO用防毒マスク、送気マスクなど）","d":"A"},{"id":670,"cat":"酸素欠乏","q":"CO中毒が起きる場所や状況は？","a":"建設現場、ビニールシートで養生されているような換気の悪い場所でエンジンカッターなど使用。","d":"A"},{"id":672,"cat":"酸素欠乏","q":"CO中毒を防ぐには","a":"作業環境管理\n自然換気、ファンなどで十分な換気\n作業開始前にCO濃度計で確認(50ppm以下が基準)\n作業管理\n作業責任者必要\n自然換気が不十分な場所での内燃機関の使用禁止","d":"A"},{"id":674,"cat":"酸素欠乏","q":"換気の不十分な場所で内燃機関のある工具を使用する場合はどうすれば良いか","a":"・発電機などの内燃機関は、できるだけ屋外に設置し、排気が室内や坑内に流れ込まない配置にする。\n・窓や出入口を開放する、排風機（送排気ファン）を稼働させるなどして、換気量を確保する。\n・危険が想定される場所は立ち入りを制限し、必要最小限の人数・時間で作業する。\n・状況に応じて呼吸用保護具を使用する。\n・CO警報器などの警報装置を設置し、濃度上昇を早期に把握できるようにする。","d":"A"},{"id":677,"cat":"高気圧","q":"高気圧作業とは？","a":"潜水業務や高圧室内業務（潜函工法でシャフト内で行う業務）など、通常より高い気圧環境の下で実施される作業を指す。","d":"A"},{"id":679,"cat":"高気圧","q":"高気圧作業の健康障害は？","a":"酸素中毒：めまい、視野狭窄、けいれん、意識障害など。\n窒素中毒：集中力や判断力の低下など。\n減圧症：高圧環境で血液や関節液などに溶け込んでいた気体が、減圧の過程で過飽和となり気泡化することで起こる。主な症状は以下。\n・皮膚症状：かゆみ、痛み、発疹\n・関節痛（ベンズ：四肢の関節痛）：溶け込んでいたガスが気化し気泡となることが関与\n・呼吸器症状（チョークス）：頻呼吸、息切れ","d":"A"},{"id":681,"cat":"高気圧","q":"減圧症の予防とは？","a":"作業計画（送気する気体の成分組成、最高圧力、加圧・減圧の速度と時間、減圧停止圧力および停止時間）をあらかじめ定め、計画に沿って作業を進める。\n減圧停止圧力：減圧の途中で一定の圧力に保ち、体内に過剰に溶け込んだ窒素の排出を促すために設定する圧力。\n減圧症の治療は、再加圧（再圧）によって行う。","d":"A"},{"id":683,"cat":"高気圧","q":"高気圧作業による健康障害の予防対策を教えてください","a":"作業環境管理\nO2(18-160kPa), CO2(-0.5kPa), N2(-400kPa)は基準分圧以下に設定\n気こう室において毎分0.8MPa以下の速度で加圧\n作業管理\n高圧潜水作業計画の策定、周知徹底\n計画、作業状況、作業者の記録を5年間保存\n高圧作業後14時間以内は重激な業務に就かせない\n健康管理\n高気圧作業健診","d":"A"},{"id":685,"cat":"高気圧","q":"高気圧作業健診の内容は？","a":"対象：高圧室内業務に常時従事する労働者、または潜水業務に常時従事する労働者。\n主な確認・検査項目\n・高気圧作業歴の確認\n・自覚症状・他覚症状の有無（関節痛、下肢の痛み、耳鳴りなど）\n・四肢の運動機能の確認\n・鼓膜・聴力の検査\n・血圧測定\n・尿検査（糖、蛋白）\n・肺活量の測定　など","d":"A"},{"id":688,"cat":"腰痛、転倒","q":"腰痛が起こりやすい職種は？","a":"保健衛生業や運送業など、重量物を取り扱う作業で腰痛が多くみられる。\n建設業や製造業では減少傾向とされる、という整理もある。\n職業性疾病のうち腰痛は大きな割合を占め、全体の約6割（令和5年度は6132件）が腰痛関連とされる。介護・福祉分野の労働人口の増加や、労働者の高齢化が増加要因として考えられる。","d":"A"},{"id":690,"cat":"腰痛、転倒","q":"腰痛が起こりやすい作業 5つ","a":"○　重量物取扱い作業\n○　立ち作業\n○　座り作業\n○　福祉・医療分野等における介護・看護作業\n○　車両運転等の作業","d":"A"},{"id":692,"cat":"腰痛、転倒","q":"介護・看護での腰部負担軽減の方法3つ","a":"移乗介助（「抱え上げ」など）で腰部への負担を減らすため、次のような措置を組み合わせて実施する。\n① 全介助が必要な対象者には、リフト等を積極的に使用し、原則として人力での抱え上げは行わせない。\n（ノーリフトケア）\n② 対象者が座位保持できる場合は、スライディングボード等を用い、対象者に合った方法で移乗介助を行う。\n③ 対象者が立位保持できる場合は、スタンディングマシーン等を使用し、対象者に適した方法で移乗介助を行う。","d":"A"},{"id":695,"cat":"腰痛、転倒","q":"腰痛防止対策を教えてください","a":"作業環境管理\n作業環境内の温度を適切に保つ\n滑りづらい床面にする、濡らした状態にしない\n動作や姿勢に支障が出ない広さを確保する\n作業場所、通路、階段で足元が明るくなるように照明を調整する。\n運転など腰部に著しい振動が伝わる場合は振動軽減措置をとる\n作業管理\n作業の自動化、省力化\nひねり、中腰などの無理な姿勢を取らない\n同一姿勢を長時間取らない\n腰部保護ベルトを個人ごとの効果を確認してから使用する\n健康管理\n腰痛健康診断の実施\n腰痛予防体操の普及\n職場復帰支援","d":"A"},{"id":697,"cat":"腰痛、転倒","q":"腰痛 の環境要因3つと具体例","a":"① 温度\n寒冷ばく露がある作業では、筋骨格系が十分に働きにくく、腰痛の発生や悪化につながることがある。特に気温が低い環境では、寒冷反射により血管が収縮し、腰部の筋肉や軟部組織がこわばりやすくなるため、腰痛の誘因となり得る。\n② 作業床面\n歩行を伴う作業でも、床面に凹凸や段差がある、あるいは滑りやすい材質である場合、つまずき・滑り・転倒のリスクが高まる。その結果、転倒や踏ん張り動作をきっかけに腰痛を発症することがある。\n③ 照明\n暗い場所での作業では、足元が見えにくくなり、滑りや転倒、階段の踏み外しなどが起こりやすい。こうした事故が原因となって腰痛を生じる場合がある。","d":"A"},{"id":699,"cat":"腰痛、転倒","q":"腰痛の 心理社会的要因","a":"腰痛の発生に関係し得る心理・社会的要因としては、仕事への満足感や働きがいを得にくいこと、上司や同僚からの支援が乏しいこと、職場内の対人関係トラブル、取引先や対人サービスの相手とのトラブルなどが挙げられる。\nまた、労働者の能力や適性に見合わない職務内容となっている場合、過度な長時間労働や強い疲労、心理的負荷、過大な責任などが生じやすく、これらも腰痛の発生・悪化に関与することがある。","d":"A"},{"id":701,"cat":"腰痛、転倒","q":"14次防でのアウトプットとアウトカム指標","a":"アウトプット\n　ノーリフトケアを導入している事業場を2023年より増加（介護・看護作業\nアウトカム\n　社会福祉施設での腰痛の死傷年千人率を2022年と比較して減少","d":"B"},{"id":703,"cat":"腰痛、転倒","q":"過度の重量物作業とは？","a":"「職場における腰痛予防対策指針」では、満18歳以上の手作業による重量物取扱いは、男性で体重のおおむね40％以下、女性は男性の60％程度までを目安としている。\n参考例\n・男性70kg：70×0.4＝28kg\n・女性50kg：50×0.4×0.6＝12kg\n（参考：女性則では、断続作業30kg、継続作業20kgに制限）\nこの目安を超える重量物を扱わせる場合は、身長差の少ない労働者2名以上で実施し、各人に負荷が偏らないよう均一にかかる方法で行わせる。","d":"A"},{"id":705,"cat":"腰痛、転倒","q":"転倒災害の状況は？","a":"中高年の女性で特に多い傾向がある。\n骨密度が低下している場合は骨折につながりやすく、結果として重い災害になりやすい。\n令和6年の転倒による負傷者は36,378人（全体の26.8％）で、平均休業日数は47.5日。","d":"A"},{"id":707,"cat":"腰痛、転倒","q":"転倒の防止対策は？","a":"作業環境管理\n4S(整理整頓清掃清潔)\n職場の危険マップを作成、情報共有\n作業管理\n転倒しにくい作業方法\n作業に適した靴の着用\n健康管理\n転倒\n等\nリスク\n評価セルフ\nチェック\n表\n体操で筋力アップ","d":"A"},{"id":709,"cat":"腰痛、転倒","q":"腰痛の健康診断の所見を教えてください","a":"坐骨神経の走行に沿って、圧痛（バレー圧痛点）、疼痛、しびれ感がみられることがある。動作で悪化しやすく、安静にすると軽くなる傾向がある。\na 脊柱の検査\n姿勢異常、脊柱の変形、脊柱の可動性と疼痛、腰背筋の緊張と圧痛、脊椎棘突起の圧痛などを確認する。\nb 神経学的検査\n神経伸展試験、深部腱反射、知覚検査、徒手筋力テスト、筋萎縮の有無などを評価する。\nc 脊柱機能検査\n脊柱の機能面（動きや動作に伴う支障など）を確認する。","d":"B"},{"id":711,"cat":"腰痛、転倒","q":"病院での腰痛を防ぐ工夫","a":"腰痛の発生状況及び原因\n腰痛発生要因の特定及びリスクの見積もり方法\n腰痛発生要因の低減措置。\n腰痛予防体操","d":"B"},{"id":713,"cat":"腰痛、転倒","q":"高齢化に伴い転倒の労災が増えているが年齢や性別での差はあるか？対応は？","a":"50〜60歳に多く、女性に多い。50代以上の女性が約50％を占め、平均休業日数は50日程度。\n加齢に伴う運動能力の低下や視認性の低下が主な要因と考えられる。\n対策として、身体能力のセルフチェックを実施する。","d":"B"},{"id":716,"cat":"健康診断","q":"健康診断の種類は？","a":"【一般健康診断】\n雇入時健診、定期健診(年1回)、特定業務健診(6か月に1回、暑熱、寒冷、放射線、深夜業、有害物、病原体など)、海外派遣労働者健診(6か月以上滞在)、給食業従事者の検便、歯科健診\n(検便以外)同一の法定項目\n【特殊健康診断】\nじん肺健診、石綿健診、特定化学物質健診、有機溶剤等健診、鉛健診、 電離放射線→実施義務\n行政指導として通達で示されているものとして(任意)\n情報機器作業、騒音、振動、腰痛、（有害光線）に関する特殊健康診断","d":"A"},{"id":718,"cat":"健康診断","q":"一般健康診断と特殊健康診断の違いは？","a":"一般健康診断は健康状態に関する全般の状態を確認します\n特殊健康診断は特定の有害な業務に従事する人の健康障害を予防することが目的で\nす","d":"B"},{"id":720,"cat":"健康診断","q":"特定業務 従事者 健康診断の対象業務","a":"暑熱・寒冷、放射線、振動、騒音\n坑内、粉塵、高圧、有害物、重量物、深夜、病原体","d":"B"},{"id":722,"cat":"健康診断","q":"一般健康診断の対象、項目は？","a":"対象は、当該業務に常時従事する労働者。\n検査項目の省略は、医師が既往歴や自覚・他覚症状などを踏まえて総合的に判断した場合に認められる\n省略できない検査\n　全年齢：体重、視力、聴力、血圧、尿検査\n　40歳以上：胸部Xp、貧血、肝機能、血中脂質、血糖、心電図","d":"B"},{"id":724,"cat":"健康診断","q":"健康診断の有所見数の動向は？","a":"健康診断の有所見者率は、全体として緩やかな上昇が続いている。令和6年度は\n59.4％\n。\n有所見の内訳では、\n脂質代謝異常\nが最多で、全体の約30％を占める。\nあわせて血圧、血糖、肝機能異常についても増加傾向がみられる。\n背景要因としては、労働者の高齢化や生活習慣病の増加が挙げられ、さらに基準値の変更も一因になり得る。","d":"A"},{"id":726,"cat":"健康診断","q":"健康診断の事後措置は？","a":"健康診断の結果、異常の所見があると診断された場合は、3か月以内に医師の意見聴取を行い、その内容を健康診断個人票に記載する。\nそのうえで、医師の意見を踏まえ、当該労働者に必要な就業上の措置を講じる（例：就業場所の変更、作業の転換、労働時間の短縮、深夜業の回数の減少、昼間勤務への転換など）。\nまた、医師又は保健師による保健指導を行う（努力義務）。\n職場環境に起因する可能性が疑われる場合は、作業環境測定の実施や設備の点検・整備を検討し、必要に応じて衛生委員会への報告等を行う。\nなお、健康診断個人票は作成し5年間保存する。さらに、50人以上の事業所では、労基署長に健診結果報告書を提出する。","d":"A"},{"id":728,"cat":"健康診断","q":"健康診断後の就業上の措置の具体例について教えてください。","a":"就業場所の変更　HT\n配置転換　DMで交代勤務辞める\n労働時間の短縮　HT\n深夜勤務の回数の減少\n常昼勤務への変更等","d":"A"},{"id":730,"cat":"健康診断","q":"特殊健康診断を実施しなければならない業務は何ですか","a":"特化物、四アルキル鉛、有機溶剤、鉛、、石綿、じん肺、\n放射線、高圧","d":"B"},{"id":734,"cat":"健康診断","q":"特殊健康診断の有所見者はなぜ増加？","a":"有所見率は全体としては緩やかな低下傾向にあり、令和5年度は約5.4％。\n一方で、特殊健診の実施率の向上や受診対象の拡大（有機溶剤や溶接ヒュームが特化物に追加、電離の白内障など）、さらに騒音や情報機器作業などの任意健診の普及により、受診する労働者数は増えている（令和5年度 325万人）。\nその結果、有所見者数も増加しており（17万5千人）、率は下がっていても「人数」は増える、という状況が起こり得る。","d":"B"},{"id":736,"cat":"健康診断","q":"特定業務健診と特殊健診の違い","a":"特定業務は一般健診だから\n作業関連疾患\n特殊健診は\n業務上疾病\nの予防が目的","d":"B"},{"id":738,"cat":"健康診断","q":"特定業務健診と特殊健診 で被っているものは","a":"粉じん\n高気圧\n放射線\n（鉛、ベンゼン）","d":"B"},{"id":740,"cat":"健康診断","q":"健康診断と作業環境測定の保存期間をまとめてください","a":"健康診断（個人票）\n一般定期健診：5年（安衛則51条）\n特殊健診：有機溶剤・鉛・四アルキル鉛・高気圧＝5年／じん肺＝7年／電離放射線＝30年／特化則の特別管理物質＝30年／石綿＝40年。\n作業環境測定の記録\n一般（騒音など安衛則由来）：3年。電離放射線（電離則）：5年。 粉じん：7年。特化則の特別管理物質・厚労省が定めるがん原性物質：30年。 \n衛生委員会議事録：3年","d":"C"},{"id":742,"cat":"健康診断","q":"定期健診、ストレスチェック、特殊健診労働基準監督署への報告が必要なのは","a":"50人以上の事業場で、全て労基署へ結果報告が義務\n特殊健診は、1人でも該当者がいれば報告が義務","d":"C"},{"id":744,"cat":"健康診断","q":"事業者が健康診断を行う理由は？","a":"事業者は、労働者に対して\n安全配慮義務\nがあり、生活習慣病などの\n作業関連疾患\nの増悪を防ぐ必要があるから。","d":"A"},{"id":746,"cat":"健康診断","q":"安全配慮義務とはなんですか","a":"企業が労働者の安全や健康に配慮する義務のこと。\n労働契約に明記がなくても雇用した時点で雇用者が負う義務。\n労働契約法5条\nが根拠法","d":"A"},{"id":748,"cat":"健康診断","q":"なぜ法律で労働者の安全と健康を守るように規制しているのか","a":"企業と労働者の間には経済的実力差があり、労使関係上立場の弱い労働者が劣悪な環境で労働契約を結ぶことを防ぐため","d":"B"},{"id":750,"cat":"健康診断","q":"労働安全衛生法施行 令 が義務を課しているのは使用者ではなく事業者だがそれはなぜか","a":"労働者の安全と健康を守るのは、雇用契約の当事者たる事業主であり、（労基法のように）使用者とすると、責任が下の方に押し付けられ、トップの責任が曖昧になる恐れがあるから。","d":"C"},{"id":752,"cat":"健康診断","q":"定期健診で腹囲や脂質などのメタボ項目があるのは？","a":"メタボは高血圧や糖尿病、脂質異常症などの生活習慣病の発症リスクを高める\n生活習慣病は作業関連疾患であるため、安全配慮義務の観点から、就業措置を行う必要があるため\n（元々定期健診は結核の早期発見が主な目的であったが、労働者の高齢化や作業環境の変化により生活習慣病、作業関連疾患対策に変わってきた。）","d":"A"},{"id":754,"cat":"健康診断","q":"作業関連疾患とは","a":"一般住民にもひろく存在する疾患だが、作業条件や作業環境の状態によって、発症率が高まったり、悪化したりする疾患\n」\n作業関連疾患（Work-related disorder）は1976年にWHOの総会で提唱された用語\n作業要因と個人的要因が関与して発現する健康障害のことといってよい","d":"A"},{"id":756,"cat":"健康診断","q":"作業関連疾患を対策する理由","a":"作業関連疾患は過重労働で増悪することがあるので、事業者が把握する必要があるから","d":"A"},{"id":758,"cat":"健康診断","q":"作業関連疾患を職業病と比較して教えてください","a":"職業病とは、業務外の原因が業務上の原因より相対的に有力である疾病\n（相対的有力原因説）\n作業関連疾患とは、業務上の要因が疾病の発症に影響したり、増悪の要因となったりするもの","d":"B"},{"id":760,"cat":"健康診断","q":"特定健診とは？","a":"特定健診：\n対象は40歳以上75歳未満。メタボリックシンドロームに着目し、生活習慣病を早期に把握するための健康診査。\n判定の考え方は、まず腹囲でスクリーニングし、該当者について追加項目の該当数で区分する。\n　腹囲：男性 85㎝以上／女性 90㎝以上\n下記に1つ該当：予備群、2つ以上該当：メタボリックシンドローム\n　収縮期血圧130以上 または 拡張期血圧85以上\n　空腹時血糖110以上\n　中性脂肪150㎎以上 または HDL40㎎未満","d":"B"},{"id":762,"cat":"健康診断","q":"特定保健指導とは？","a":"生活習慣病予防を目的に、40–74歳の保険者を対象として健診（腹囲測定を含む）を実施し、結果に基づいてリスクを階層化したうえで、リスクに応じた保健指導を行う仕組み。\nこれはハイリスクアプローチの代表例で、狙いはあくまで生活習慣病の予防にある。\n制度としては2008年から、高齢者の医療の確保に関する法律に基づいて実施されており、40–74歳の保険者に対して（健診＋腹囲測定を含め）実施が求められている。","d":"B"},{"id":764,"cat":"健康診断","q":"特定保健指導とは？","a":"腹囲と血糖、脂質、血圧、喫煙歴で階層化し、\n・積極的支援：Aかつリスク2つ以上、Bかつリスク3つ以上\n面談+3ヶ月以上の電話またはメールで継続的支援+3-6ヶ月後に再評価\n・動機づけ支援： Aかつリスク1つ以上、Bかつリスク1-2個\n1回の面談、3-6ヶ月後に再評価\n血糖\nBS 100 or HbA1c 5.6以上\n脂質\nTG 150以上 or HDL 40未満\n血圧\nsBP 130 or dBP 85以上\n喫煙\n上記が一つでもあればリスクに加点\n腹囲\n男85、女90以上\n未満","d":"B"},{"id":765,"cat":"健康診断","q":"特定健診・特定保健指導の評価は？","a":"アウトカム評価とプロセス評価で行う。\n主要達成目標を腹囲－2㎝ 、体重－2㎏ 。\n主要達成目標を達成した場合は180p、未達の場合でも、行動変容のアウトカム(ex.禁煙で30p)、プロセス(ex.個別面談実施で70p)にポイントをつけ、180pに到達したらフォロ－終了","d":"B"},{"id":767,"cat":"健康診断","q":"健康管理手帳とは","a":"「労働安全衛生法に基づき特定の有害業務に一定期間以上従事した労働者のうち、離職時・離職後に申請したものに、都道府県労働局長から交付される手帳」\n　離職時は事業所のある、離職後は住所のある都道府県。\n　手帳を交付されると1年に2回無料で健診が受けられる。\n条件\nベンジジン、β-ナフチルアミン、ジアニシジン\n3ヶ月以上従事\n1, 2-ジクロロプロパン\n、MOCA\n2年以上従事\nビスエーテル、ベンゾトリクロリド\n3年以上従事\n(重)クロム酸、塩化ビニル\n4年以上従事\nヒ素、コークス、オルトトルイジン\n5年以上従事\n特定粉じん作業\nじん肺管理区分2または3\nベリリウム\n両肺野に慢性結節影\n石綿\n次ページ参照","d":"A"},{"id":769,"cat":"健康診断","q":"健康管理手帳はどうして存在しますか？","a":"業務に起因し、数年から数十年という長い潜伏期間を経て発症する疾病を早期に見つける目的で実施される。\n費用は国費で賄われ、受診者の自己負担はない。健診は労働局長が委託した指定医療機関で行われる。\n受診頻度は年2回が基本で、じん肺は年1回。\n交付者数は、粉塵作業が2.5万人で最も多く、次いで石綿が2.3万人。","d":"A"},{"id":771,"cat":"健康診断","q":"石綿健康管理手帳交付の対象となる人","a":"石綿等の製造または取り扱いに伴い石綿による粉塵を発散する場所における業務に従事し、かつ\n①石綿等を取り扱う作業に10年以上従事\n②張り付け、解体等作業に1年以上従事かつ初めて従事から　　\n　10年以上が経過\n③レントゲン有所見者(胸膜肥厚両または肺に不整形陰影)。","d":"A"},{"id":773,"cat":"健康診断","q":"健康情報の種類はどのようなものがありますか","a":"①法令上事業者が把握しなければならないもの\n健康診断の受診/未受診、事後措置に関する医師の意見\n②本人の同意を得ずに収集できるが、取扱規約等で適切な取り扱いが適当である情報\n法定項目、保健指導の結果\n③法令上規約のないもので、取扱規約等で適切な取り扱いが適当である情報\nがん検診結果、法定外項目。","d":"A"},{"id":775,"cat":"健康診断","q":"健康情報取り扱い上の注意点を教えてください。","a":"健康情報は、事前に取扱規約を整備し、情報の取扱目的・取扱方法、および閲覧できる権限（アクセス範囲）を明確にしておく必要がある。\n取扱目的は、安全配慮義務の履行や適正配置であることを踏まえ、情報を扱う担当者（情報取扱者）と取扱う情報の範囲を必要最小限に絞ることが重要。\n紙媒体で保管する場合は、鍵をかけたキャビネットに保管するなど、物理的な管理も徹底する。","d":"A"},{"id":777,"cat":"健康診断","q":"産業保健スタッフがいない場合健康診断の個人情報の取り扱いは？","a":"目的と閲覧・取扱い権限は、あらかじめ明確に定めておく。\n生データは、原則として産業保健スタッフが取り扱う形が望ましい。\n産業保健以外の担当者が扱う場合は、人事権のない担当者が、取扱い規約に従って必要最小限で取り扱う。\nその際は、個人が特定されにくいように健康情報を加工（集計・匿名化等）して扱うのが望ましい。\n目的外使用を行う場合は、本人の同意が必須となる。","d":"A"},{"id":779,"cat":"健康診断","q":"産業保健スタッフがいない場合健康診断の個人情報の取り扱いは？","a":"目的と閲覧・取扱い権限は、あらかじめ明確に定めておく。\n生データは、原則として産業保健スタッフが取り扱う形が望ましい。\n産業保健以外の担当者が扱う場合は、人事権のない担当者が、取扱い規約に従って必要最小限で取り扱う。\nその際は、個人が特定されにくいように健康情報を加工（集計・匿名化等）して扱うのが望ましい。\n目的外使用を行う場合は、本人の同意が必須となる。","d":"B"},{"id":782,"cat":"メンタルヘルス","q":"メンタルヘルス対策の導入方法は？","a":"事業者は、メンタルヘルスケアを職場の重要課題として位置づけ、積極的に推進する方針を明確に示す。\nそのうえで、衛生委員会などの場で労働者と十分に審議を行いながら、「心の健康づくり計画」やストレスチェック実施規程等を整備し、メンタルヘルスケアの実施体制を組み立てていく。\n運用面では「4つのケア」を継続的・計画的に進め、ストレスチェック等の一次予防に加えて、不調者への対応といった二次予防、職場復帰支援などの三次予防までを一体で実施する。","d":"A"},{"id":784,"cat":"メンタルヘルス","q":"産業保健スタッフにはどんな人がいますか","a":"産業医、産業保健師、衛生管理者、安全衛生推進者、労働衛生コンサルタント","d":"A"},{"id":786,"cat":"メンタルヘルス","q":"メンタルヘルス対策を進めるうえで「心の健康づくり計画」とはなんですか","a":"事業者は、長期的な視点でメンタルヘルスケアを継続し、計画的に進めるための指針として「心の健康づくり計画」を作成する。\n「心の健康づくり計画」には、\n①事業者の表明 ②体制 ③問題点の把握とケアの実施 ④必要な人材、外部資源 ⑤健康情報の保護 ⑥計画の評価見直し ⑦必要な措置\nを盛り込み、PDCAサイクルで運用・改善していく。","d":"A"},{"id":788,"cat":"メンタルヘルス","q":"心の健康づくり計画の策定に当たり留意すべき事項","a":"① 心の健康づくり計画は、衛生委員会等で十分に調査審議を行い、各事業場の労働安全衛生に関する計画の一部として整理し、位置づける。\n② 計画の中で、事業者はメンタルヘルスケアを主体的に推進する方針を明らかにし、そのための実施体制を整備する。\n③ ストレスチェック制度についても、心の健康づくり計画の中で、どのように扱うか（位置づけ）を明確化する。","d":"A"},{"id":790,"cat":"メンタルヘルス","q":"4つのメンタルヘルスケアとは","a":"セルフケア：労働者本人が行うケア。自分のストレスの変化に気づき、必要に応じて自発的に対処したり、相談につなげたりすること。\nラインによるケア：管理監督者が担うケア。部下の不調のサインを捉え、相談対応を行うほか、職場環境の見直しを進めたり、産業保健スタッフと連携したりすること。\n事業所内産業保健スタッフ等によるケア：産業医、保健師、心理士などの事業所内専門職と人事労務スタッフが中心となるケア。個別相談への対応に加え、メンタルヘルス研修の実施なども含む。\n事業所外資源によるケア：社外の専門機関を活用する支援。医療機関での治療やリワーク、地域の相談機関の利用などを指す。","d":"A"},{"id":792,"cat":"メンタルヘルス","q":"メンタルヘルスの1,2,3次予防を教えてください。","a":"1次予防：不調が生じる前に手を打ち、発生を防ぐ\n2次予防：兆候を早めに捉え、速やかに支援につなげる\n3次予防：メンタル不調者の職場復帰を支え、再発を防止する\n具体的な取組例\n1次予防\nセルフケアとラインケアを中心に進める\nストレスチェックにより、従業員のストレス不安を把握し、職場環境の評価・改善につなげる\n2次予防\n高ストレス者面談\n管理職研修\n3次予防\n休復職者対応\n再発防止策\n職場改善","d":"A"},{"id":794,"cat":"メンタルヘルス","q":"メンタル不調者の職場復帰の流れは？","a":"次の5つのステップに沿って進めます。\n・病気休業の開始と、休業中のケア\n・主治医による復職可否の判断\n・職場復帰の可否検討と、復職プランの作成\n・職場復帰の最終決定\n・復帰後のフォローアップ","d":"A"},{"id":796,"cat":"メンタルヘルス","q":"メンタル不調者の職場復帰の流れは？","a":"第1ステップ：病気休業の開始と休業中のケア。労働者が安心して療養に専念できるよう、傷病手当金や休職可能期間などの制度情報を案内する。\n第2ステップ：主治医による職場復帰可否の判断。主治医の判断は症状の改善を中心に行われることが多いため、産業医などが業務遂行能力の観点も含めて確認し、必要に応じて主治医と連携する。\n第3ステップ：職場復帰の可否判断と職場復帰支援プランの作成。労働者の状態を評価したうえで、事業場内産業保健スタッフを中心に、管理監督者・労働者と連携し、具体的な職場復帰支援プランをまとめる。\n第4ステップ：事業者による最終的な職場復帰の決定。\n第5ステップ：職場復帰後のフォローアップ。管理監督者による観察・支援と、事業場内産業保健スタッフによるフォローを継続し、状況に応じて職場復帰支援プランを評価・見直す。","d":"A"},{"id":797,"cat":"メンタルヘルス","q":"職場復帰支援プランはどんな内容を含みますか","a":"職場復帰日\n管理監督者による業務上の配慮\n人事労務管理上の対応\n産業医等による医学的見地からみた意見\nフォローアップ\nその他","d":"A"},{"id":799,"cat":"メンタルヘルス","q":"メンタルヘルスケアの外部資源の具体例を教えてください","a":"相談先・支援資源としては、ちさんぽ、精神保健福祉センター、保健所、医療機関、従業員支援プログラム（EAP）などがある。\nちさんぽ：50人以下の事業場が対象\n・長時間労働面談\n・健康相談窓口の開設\n・産業保健情報の提供\n精神保健福祉センター\n・メンタル患者の社会適応に向けた指導・援助\n・地域の保健所に対する研修・支援\n保健所\n・こころの相談窓口、受診に関する相談など\n従業員支援プログラム（EAP）\n・社外機関が提供する相談サービス\n・専門家等へ相談できる仕組み","d":"A"},{"id":801,"cat":"メンタルヘルス","q":"小規模事業所のメンタルヘルス対策は？","a":"事業者は、メンタルヘルスケアに取り組む方針を明確に示し、労働者と話し合いながら進め方を決めていく（基本は大規模事業所と同様）。\n・心の健康づくり計画を作成する\n・人的・金銭的な負担も踏まえ、セルフケアやラインによるケアなど、実行しやすい取組に重点を置く。まずは研修など、着手しやすい施策から進める\n・事業所内の産業保健スタッフを確保できない場合は、事業所内メンタルヘルス推進担当者を選任する。その上で、産業保健総合支援センター（50人未満であれば地域産業保健センター）など、事業場外資源の支援を積極的に活用する\n・条件を満たす場合は、団体経由産業保健活動推進助成金の活用も検討する","d":"A"},{"id":803,"cat":"メンタルヘルス","q":"メンタルヘルス推進担当者はどんな業務を行いますか","a":"産業医等の助言、指導等を得ながら、事業場のメンタルヘルスケアの実務を担当する。\n(主に衛生管理者や保健師等から選任するが、50人未満や保健師不在である場合は人事労務でも良い)\nメンタルヘルス対策がスムーズに行くようにする役目。\n・こころの健康計画の策定、労働者への周知\n・セルフケア、ラインケア講習の計画・立案・実行・評価\n・事業場内のメンタルヘルスに関する窓口\n・事業外資源との窓口。","d":"B"},{"id":805,"cat":"メンタルヘルス","q":"メンタルヘルスケアで配慮する点は？","a":"労働者の個人情報の保護に十分配慮する。事業者は、健康情報を含む個人情報やストレスチェック結果などについて、目的と権限を明確にしたうえで、適正な取扱いを徹底する。\nまた、心の健康問題は個人差が大きい点を踏まえ、画一的な対応にならないよう留意する。\n配置や人事異動など、人事労務管理と密接に関係する要因の影響を受けやすいため、必要に応じて人事労務管理部門とも連携して進める。\nさらに、職場のストレス要因だけでなく、家庭・個人生活など職場外の事情が影響する場合があることも念頭に置く。","d":"A"},{"id":807,"cat":"メンタルヘルス","q":"メンタルヘルスケアでプライバシーに配慮しないとどんなことが懸念されますか","a":"相談しづらい雰囲気が生まれると、問題が表面化しにくくなり、結果として対応が遅れて解決が難しくなる。状況によっては、事業者側が損害賠償を求められるリスクにもつながり得る。\nまた、人事権を持つ者が不適切に情報へアクセスすると、人事評価や処遇に影響するおそれがあり、公平性への不信を招く。\nさらに、心理的安全性が低い職場では、意見や提案が出にくくなり、コミュニケーションが停滞して組織の不活性化につながる。","d":"B"},{"id":809,"cat":"メンタルヘルス","q":"メンタルヘルスケアで留意する4点 ","a":"① 心の健康問題の特性\n心の健康は、血液検査のように客観的に測れる指標が十分に整っていないため、評価には本人から心身の状態を聞き取ることが欠かせない。加えて、発生の経過には個人差が大きく、プロセスを一律に捉えるのは難しい。さらに、心の健康はすべての労働者に関わるテーマで、誰もが不調を抱える可能性がある一方、当事者が健康面以外の観点で評価されやすい傾向がある。誤解や偏見といった課題も残っており、こうした点への対応が求められる。\n② 労働者の個人情報の保護への配慮\nメンタルヘルスケアを進める際は、健康情報を含む個人情報の保護と、労働者本人の意思の尊重が重要となる。心の健康に関する情報を収集・利用する場合には取扱いに十分配慮し、労働者が安心して参加できる環境を整えることが、結果として取組の実効性を高める前提になる。\n③ 人事労務管理との関係\n心の健康は、職場配置や人事異動、組織体制など、人事労務管理に関わる要因の影響を受けやすい。そのため、メンタルヘルスケアは人事労務管理と連携しないと、適切に進めにくいケースが多い。\n④ 家庭・個人生活等の職場以外の問題\n心の健康問題は、職場のストレス要因だけでなく、家庭・個人生活など職場外のストレスの影響を受けることも少なくない。個人要因も含め、複数の要因が絡み合い相互に影響し合う場合が多い点を踏まえて対応する必要がある。","d":"A"},{"id":811,"cat":"メンタルヘルス","q":"50人以上の事業所で取組率の高い者2つ ","a":"50 人以上の規模の事業場において実施されているメンタルヘルス対策の取組内容のうち、実施割合の高いものは、高い順に「ストレスチェックの実施」、「職場環境等の評価及び改善（ストレスチェック結果の集団（部、課など）ごとの分析を含む）」となっている。","d":"B"},{"id":813,"cat":"メンタルヘルス","q":"仕事に関する強い不安、悩みの割合は？","a":"令和6年度で68.3％↓。\n1位：「仕事の量」43.2％\n2位：「仕事の失敗、責任の発生等」 36.2％\n3位：「仕事の質」26.4％","d":"B"},{"id":815,"cat":"メンタルヘルス","q":"自殺者の推移","a":"令和6年度で20320人↓。過去2番目に少ない\n健康上の問題59.6％、経済・生活問題25.6％、家庭問題21.1％\n勤務問題12.6％","d":"B"},{"id":817,"cat":"メンタルヘルス","q":"パワハラとは？","a":"職場におけるパワーハラスメントとは、職場で行われる言動のうち、次の3要件をすべて満たすものを指す。\n① 優越的な関係を背景とした言動\n② 業務上必要かつ相当な範囲を超えたもの\n③ 労働者の就業環境が害されるもの\n代表的な言動の類型としては、⑴身体的な攻撃 ⑵精神的な攻撃 ⑶人間関係からの切り離し ⑷過大な要求 ⑸過小な要求 ⑹個の侵害 などがある。","d":"B"},{"id":819,"cat":"メンタルヘルス","q":"セクハラとは？","a":"職場におけるセクシュアルハラスメントとは、①職場で行われる言動であり、②労働者の意に反する性的な言動によって、③就業環境が損なわれることを指す。\n類型としては、性的な要求を拒否したことを理由に不利益な取扱いを受けるなどの対価型セクシュアルハラスメントと、意に反する性的な言動により職場が不快な状態となり、能力発揮に支障が出るなどの環境型セクシュアルハラスメントがある。","d":"B"},{"id":821,"cat":"メンタルヘルス","q":"モラハラ、マタハラ、カスハラとは？","a":"モラハラ（モラルハラスメント）\n言葉や態度による継続的な精神的嫌がらせ（暴言、無視、過度な叱責、人格否定、孤立化など）。法律上の正式な用語ではないが、実務上は職場のパワハラ等として扱われ、評価や是正の対象となる。\nマタハラ（マタニティハラスメント）\n妊娠・出産・産前産後休業・育児休業等を理由とした不利益取扱いや嫌がらせ。均等法・育介法により、不利益取扱いの禁止に加え、相談窓口の設置、周知、再発防止などの雇用管理上の措置が事業者に求められる。\nカスハラ\n顧客等からの暴言、不当な要求など、著しい迷惑行為。","d":"B"},{"id":823,"cat":"メンタルヘルス","q":"ハラスメントへの対策は？","a":"発生しないために\n・事業主の方針を明確にし、職場へ周知する\n・相談窓口を整備し、利用しやすい導線をつくる\n・職場におけるハラスメントに対し、迅速かつ適切に対応できる体制を整える\n・プライバシーの保護や、不利益な取扱いをしないことをあらためて周知する\n発生したら\n・事実関係を確認する（関係者からの聴取、記録の整理など）\n・事故調査報告書を作成する\n・加害者への処分を行い、被害者のフォローアップを実施する\n・再発防止策を検討し、具体的に実行する","d":"B"},{"id":826,"cat":"ストレスチェック","q":"ストレスチェックとは？","a":"ストレスチェック制度は、\n労働者のメンタルヘルス不調を未然に防ぐ（一次予防）ことを目的とする制度\n。\n本人のストレスへの気づきを促すと同時に、結果を職場環境の改善につなげる\n。50人以上の事業所では、年1回の実施が義務。\n義務：高ストレス者から申出があった場合、医師による面接指導を実施する。医師の意見を聴取し、必要に応じて就業上の措置を講じる。（面接結果は5年保存）\n努力義務：集団分析を行い、職場環境改善に取り組む\n実施者の要件：\n医師、保健師、研修受講した歯科医師、看護師、精神保健福祉士、公認心理士\n留意点：人事権のある者は、実施の事務に従事できない","d":"A"},{"id":828,"cat":"ストレスチェック","q":"ストレスチェックの項目は？","a":"全57項目「職業性ストレス簡易調査票」(詳細版は80項目)\n最低限必要な要件として\n①仕事のストレス要因②周囲のサポ－ト③心身のストレス反応","d":"A"},{"id":830,"cat":"ストレスチェック","q":"ストレスチェックの導入は？","a":"体制づくり：事業者がストレスチェックの実施方針を明確にし、衛生委員会で実施方法・実施規程を調査審議する。あわせて、実施者（産業医等）と、実施事務従事者（人事権のない者）を選任する。\n職場環境の評価：ストレスチェックを行い、結果を本人に通知する。高ストレス者には面接指導の申出を促し、必要に応じて集団分析を実施する。\n改善計画の立案・実施：集団分析の結果を衛生委員会へ報告し、職場環境改善に向けた計画を審議したうえで実行に移す。\n評価・計画の変更：改善策の進捗や効果を点検し、必要があれば計画内容を見直して更新する。","d":"B"},{"id":832,"cat":"ストレスチェック","q":"ストレスチェックの留意事項","a":"・受験しないことなどによる不利益取扱の禁止\n・個人情報の保護（他目的で使用しないように）\n・5年の保存（ストレスチェック結果、面談記録）\n・労基に実施報告","d":"B"},{"id":834,"cat":"ストレスチェック","q":"ストレスチェックを実施することにより、労働者と事業者にもたらされる効果","a":"労働者にもたらされる効果\n・自らのストレスの状態やその原因を知り、\nストレスコーピング（対処）のきっかけ\nとなる\n・高ストレスの場合、面接指導を受けることで、就業上の措置につながる。\n　事業者にもたらされる効果\n・労働者がメンタルヘルス不調になることを未然に防止できる。\n・職場の問題点の把握が可能となり、\n職場改善\nの\n具体的な検討\nがしやすくなる。","d":"A"},{"id":836,"cat":"ストレスチェック","q":"高ストレス者への対応は？","a":"面接指導は、労働者のストレス対処を支えることが目的である点を事前に説明する。そのうえで、受ける／受けないにかかわらず不利益な取扱いはしないことを明確に伝え、安心して判断できる形で面接を勧奨する。\n面談を希望する場合：産業医が面談を行い、セルフケアに関する助言を実施する。あわせて、職場環境の改善が必要か、専門医受診が必要か等を評価し、本人の同意が得られた範囲で会社へ所見を共有する。会社は、その内容を踏まえて必要な対応（配置転換や受診への配慮など）を行う。\n面談を希望しない場合：セルフケアに役立つ資料を提供し、外部EAPなど利用可能な相談窓口を案内する。","d":"A"},{"id":838,"cat":"ストレスチェック","q":"ストレスチェックの結果の取り扱いは？","a":"実施者および実施事務従事者には守秘義務が課されており、ストレスチェックの結果は、労働者の同意がない限り事業者へ提供できない。\nまた、次の事由を理由とした不利益取扱いは禁じられている。\n　ストレスチェックを受検しないこと\n　高ストレス者になったこと\n　高ストレス者面談を希望したこと／希望しなかったこと","d":"A"},{"id":840,"cat":"ストレスチェック","q":"小規模事業所でストレスチェックを行う際の注意点は　","a":"衛生推進者をメンタルヘルス推進担当者（産業医等の助言・指導を受けつつ、事業場におけるメンタルヘルスケア推進の実務を担う者）として位置づけ、選任して運用する。\nあわせて、地域産業保健センターなどの事業場外資源が提供する支援を積極的に取り入れ、無理なく継続できる形で進めることが望ましい。\n取組は、まずセルフケアとラインケアを軸に、実施できるところから段階的に着実に進める。","d":"A"},{"id":842,"cat":"ストレスチェック","q":"不利益な取扱とは","a":"不当な動機・目的をもってなされたと判断されるような、解雇・配置転換などを命じること","d":"B"},{"id":845,"cat":"ストレスチェック","q":"「第 14 次労働災害防止計画」のメンタルヘルス対策に関するアウトプット指標及びアウトカム指標","a":"１　アウトプット指標\nメンタルヘルス対策に取り組む事業場の割合を 2027 年までに 80 ％以上とする。\n使用する労働者数 50 人未満の小規模事業場におけるストレスチェック実施の割合を 2027 年までに 50 ％以上とする。\n２　アウトカム指標\n自分の仕事や職業生活に関することで強い不安、悩み又はストレスがあるとする労働者の割合を 2027 年までに 50 ％未満とする。","d":"B"},{"id":846,"cat":"ストレスチェック","q":"仕事のストレス判定図とは","a":"「職場内の集団を対象に、職場のストレスの健康リスクの評価」\n「仕事の量的負担」、「仕事のコントロール」、「上司の支援」、「同僚の支援」の4つから、ストレスの大きさとその健康への影響を測定することができます。","d":"A"},{"id":848,"cat":"ストレスチェック","q":"高ストレス者の判断基準は？","a":"心身のストレス反応が高い、\nまたは\nストレス反応が中等度でも周囲のサポートが少ない、\nなどの要素を踏まえて判定する","d":"C"},{"id":850,"cat":"ストレスチェック","q":"メンタル不調の復帰について主治医が OK、産業医がNG の ときにはどのように対応するか","a":"主治医のOKは医学的判断、産業医は職場で安全に働けるかの判断です。\nまず本人面談で就業可能性を確認し、本人同意の上で職務内容・勤務条件を主治医に共有して復帰条件をすり合わせます。","d":"C"},{"id":853,"cat":"過重労働","q":"過重労働の健康障害は？","a":"脳血管疾患：脳内出血、くも膜下出血、脳梗塞、高血圧性脳症。\n心臓疾患：心筋梗塞、狭心症、心停止、重篤な心不全、大動脈解離。\n精神疾患：うつ病、急性ストレス障害など。\nその他の過労性健康障害：胃十二指腸潰瘍、月経障害、過労による注意力低下などに起因する事故による負傷。","d":"A"},{"id":855,"cat":"過重労働","q":"過重労働対策の進め方","a":"1. 事業者が対応方針を決定し、取組を進める意思を明確に示す。\n2. 衛生委員会等を活用して、課題認識を共有し、実施体制を整える。\n3. 過重労働対策推進計画を作成し、PDCAサイクルに沿って運用する。\n4. 定期健診やストレスチェック等を活かし、健康確保の取組を徹底する。\n5. 長時間労働面談を確実に実施し、必要な対応につなげる。\n加えて、把握すべきなのは労働時間だけではない。勤務の不規則性、出張、交代勤務、深夜勤務など、働き方の状況もあわせて確認することが重要。","d":"A"},{"id":857,"cat":"過重労働","q":"過重労働の健康障害防止対策は？","a":"過重労働そのものを減らすための取組として、\n・時間外労働を削減する\n・年次有給休暇の取得を促進する\n・勤務間インターバル制度を設ける\nまた、健康障害を防ぐ観点では、\n・産業医と衛生管理者の選任、健康相談の体制整備\n・健康診断と事後措置の実施\n・長時間労働者への面談指導と事後措置の実施\nを進める。","d":"A"},{"id":859,"cat":"過重労働","q":"勤務間インタ－バル制度とは？","a":"終業時刻から次の始業時刻までの間に一定の休息時間を確保する制度で、働き方改革関連法では、導入は事業者の努力義務とされている。\n運用の目安としては、通勤2時間＋睡眠6時間＋生活時間3時間＝11時間を参考にしつつ、各職場で衛生委員会などで検討し、就業規則に明記することが勧められる。","d":"A"},{"id":861,"cat":"過重労働","q":"勤務間インタ－バル制度を導入する意義","a":"労働者の暮らしと健康を守るには、月単位の労働時間管理だけでなく、日々の生活の中でワーク・ライフ・バランスを確保する視点が欠かせない。そのためには、毎日の勤務と勤務の間に一定の休息時間を確保することが有効となる。\n勤務間インターバル制度を導入する意義は、企業と従業員の双方が、従来の「労働時間中心」の発想を見直し、休息の大切さを意識できる点にある。結果として、企業が従業員に対して休息の重要性を伝え、職場に浸透させることにもつながる。","d":"A"},{"id":863,"cat":"過重労働","q":"勤務間インタ－バル制度の効果2つ","a":"１　従業員の健康の維持向上につながる。\n２　生産性の向上につながる。","d":"B"},{"id":865,"cat":"過重労働","q":"インターバル制度で、状況により適用除外とすることができるケースの例 3つ","a":"状況により適用除外とすることができるケースの例としては以下のものが挙げられる。\n①　重大なクレーム（品質問題・納入不良等）に対する業務\n②　突発的な設備のトラブルに対応する業務\n③　予算、決算、資金調達等の業務","d":"C"},{"id":867,"cat":"過重労働","q":"小規模事業所での対策は？","a":"休日労働の削減や有休取得の促進に加え、勤務間インターバルの確保、産業医・衛生管理者の選任、長時間労働面接指導の実施などを組み合わせて進める。小規模事業場であっても、時間外・休日労働が月80時間を超え、面接指導の申出があった労働者については、面接指導を受けさせる義務がある。\nまた、50人未満で産業医や衛生管理者の専任義務がない事業場では、地域産業保健センターを活用する方法がある。依頼すれば、無料で登録産業医による長時間労働の面接指導や健康相談を受けられる。","d":"B"},{"id":869,"cat":"過重労働","q":"過重労働が関連する災害が発生したら？","a":"被災時は、被災者の治療を確保したうえで、事実確認、労働基準監督署への届出、再発防止策までを一連で進める。\n被災者の治療を最優先\n・労災指定病院：治療費は病院から労基署へ請求される\n・上記以外：いったん患者が治療費を立て替え、申請により労基署から支給される\n事実関係の把握\n・現場の状況確認と関係者への聞き取りを行い、記録を残す（証拠となる）\n・労基署による調査が入ることもある\n再発防止の徹底\n・衛生委員会で原因と対策を検討する\n・労災防止対策書を作成して、具体的な改善策を明確にするのも有効","d":"A"},{"id":871,"cat":"過重労働","q":"過重労働の脳・心臓疾患の労災認定基準は？","a":"対象疾患は、脳内出血、くも膜下出血、脳梗塞、高血圧性脳症、心筋梗塞、狭心症、心停止、重篤な心不全、大動脈解離。\n認定要件は、次のいずれかに当てはまる「業務による明らかな過重負荷」があること。\n① 長期間の過重業務\n② 短期間の過重業務\n③ 異常な出来事\n① 長期間の過重業務\n発症前1か月間に100時間、2－6か月間にわたり80時間超などを目安としつつ、その他の「負荷要因」もあわせて判断する。\n② 短期間の過重業務\n発症前1週間に過度の長時間労働があったか、深夜業務の状況などを含め、全体として総合的に評価する。\n③ 異常な出来事\n重大な人身事故への対応など、強い出来事性がある場合。\n例として、精神的負荷のかかる救助活動、著しい身体的負荷を伴う消火作業、著しい暑熱下での救助などが挙げられる。","d":"A"},{"id":875,"cat":"過重労働","q":"脳・心臓疾患の労災認定状況","a":"請求・認定の状況（脳・心臓疾患）\n* 請求：1,030件（前年差＋7）\n* 支給決定：241件（＋25）\n  * うち死亡：67件（＋9）\n    いずれも、3年連続で増加傾向。\n業種別の傾向\n* 請求件数は運輸・郵便が213件で最多。次いで卸売・小売150件、建設128件。\n* 支給決定も運輸・郵便が88件で最多。中分類では道路貨物運送業が特に多い。\n年齢層\n* 40代が多い。","d":"A"},{"id":877,"cat":"過重労働","q":"過重労働による脳・心臓疾患の メカニズムは","a":"過重労働が誘引となって、高血圧や動脈硬化などの進行が、自然経過を超えて著しく増悪して起こる","d":"A"},{"id":879,"cat":"過重労働","q":"過重労働のメンタル疾患の労災認定基準は？","a":"対象疾患\n認定要件：① うつ病や急性ストレス障害など（器質や物質ではない） ② 発症前6か月の間に業務による強い心理的負荷（特別な出来事 or 総合スコア強） ③ 業務以外の負荷や個体側要因でない\n心理的負荷の例\n特別：極度の長時間労働（160H/月）、生死に関わる労災の被害加害、強姦\n強：重症労災の被害加害、退職強要、ひどいパワハラ\n中：悲惨な事故の目撃、多額の損失のミス、カスハラ\n弱：上司の交代、昇格昇進","d":"A"},{"id":881,"cat":"過重労働","q":"過重労働のメンタル疾患の労災認定基準は？","a":"精神障害の労災認定は、次の条件を満たす場合に認められる考え方となる。\n・業務による心理的負荷が強い\n・業務外の心理的負荷の強度がⅢ以下\n・個体要因がない\nなお、個体要因がある場合でも、業務起因性が特に強いと判断されれば、認められることがある。","d":"A"},{"id":882,"cat":"過重労働","q":"過重労働の労災認定の傾向は？","a":"脳心臓疾患\n令和6年度は241件。内訳の死亡件数は、いったん減少傾向だったが、近年は微増している。\n業種別では運輸業が多く、拘束時間が長い働き方が背景となり、認定されやすい側面がある。\n精神障害\n令和6年度は1055件で、うち自殺件数も増加傾向が続いている。\n業種別では医療・福祉業が多い。要因別では、パワハラ224件、カスハラ108件、セクハラ105件など、ハラスメント関連が全体の約4割を占める。次いで、仕事内容・仕事量の変化が119件。","d":"A"},{"id":884,"cat":"過重労働","q":"時間外労働の上限規制は？","a":"法定労働時間は、1日8時間以内、週40時間以内。\n休憩は、6時間以上の勤務で45分以上、8時間以上の勤務で60分以上を付与する。\nこれらを超えて働く時間は残業時間となり、原則として月45時間以内、年360時間以内。\nただし、臨時の特別な事情があり、労使合意がある場合は、年720時間以内、月100時間未満、複数月平均80時間以内、月45時間超は年6回以内の範囲で認められる。\n上限規制に違反した場合は、罰則（6か月以下の懲役または30万円以下の罰金）が科されるおそれがある。\nまた、全労働者について、パソコンでの打刻などにより労働時間を客観的に記録することが義務付けられた。","d":"A"},{"id":886,"cat":"過重労働","q":"上限規制の特殊な例は？","a":"建設業：以前は猶予措置がありましたが、現在は（災害時の復旧・復興事業を除き）一般と同じ上限規制が適用される。\nドライバー業：年960時間以内。月100時間未満、複数月平均80時間以内、月45時間超は年6回以内のルールは適用されない。\n医師：兼業先の労働時間も合算して扱う。A水準および連携B水準は年960時間以内、B水準とC水準は年1860時間以内。月100時間未満、複数月平均80時間以内、月45時間超は年6回以内のルールは適用されない。\nB水準：三次救急、がん拠点病院など\n連携B水準：地域医療を確保するために必要な特定の医療機関\nC水準：初期研修医・専攻医を雇用する医療機関、特定高度技能獲得を目指す医師を雇用する医療機関","d":"A"},{"id":888,"cat":"過重労働","q":"長時間労働の医師による面談指導は？","a":"高度プロフェッショナル制度適用者、研究開発業務従事者、医師については、月100時間をこえる時間外・休日労働を行った者全員に、面接指導を受けさせる義務がある。\nまた、それ以外の労働者（管理監督者を含む）および研究開発業務従事者では、月80時間を超える時間外・休日労働を行い、面接指導を申し出た者に対して、面接指導を受けさせる義務が生じる。\n面接指導は、事業所で選任されている産業医、または地域産業保健センターの登録医などが実施する。\n面談後は医師が事後措置に関する意見を述べ、事業者はその意見を踏まえて必要な事後措置を講じる。\n面談記録は5年間保存する。","d":"A"},{"id":891,"cat":"過重労働","q":"過労死の定義は","a":"業務における過重な負荷による脳血管疾患・心臓疾患を原因とする死亡\n業務における強い心理的負荷による精神疾患を原因とする自殺による死亡","d":"A"},{"id":893,"cat":"過重労働","q":"残業時間の過労死ラインとは","a":"過労死ラインは、病気・死亡・自殺などの健康障害が長時間労働に起因するかを判断する際の、客観的な目安として用いられる指標。\n一般的には、発症前1か月の時間外労働が100時間／月以上、または発症前2〜6か月の時間外労働の平均が80時間／月を超える場合に、認定の目安となる。\nなお、過労死ラインに達していない場合でも、労働と死亡（発症）との因果関係が認められることはある。判断では労働時間だけでなく、心理的・身体的疲労の程度なども考慮される。","d":"A"},{"id":895,"cat":"過重労働","q":"R6の過労死等の防止のための対策に関する大綱の改正のポイント","a":"3年おきに改正\n・フリーランス対策の強化\n・重点業種に「芸術、芸能」分野を追加\n（自動車運転従事者、教職員、IT産業、外食産業、医療、建設業、メディア業界）\n・カスタマーハラスメント対策","d":"B"},{"id":897,"cat":"過重労働","q":"36協定とは","a":"36（サブロク）協定は、労働者に時間外労働（残業）を行わせるために必要となる、労働基準法第36条に基づく労使協定。締結したうえで、所轄労働基準監督署長へ届出を行う必要がある。\n36協定では、時間外労働を行う業務の範囲（業務の種類）や、1日・1か月・1年当たりの時間外労働の上限など、運用に必要な事項を定めなければならない。","d":"B"},{"id":899,"cat":"過重労働","q":"長時間残業を防ぐ具体的な方法","a":"経営トップによるメッセージの発信\n勤務時間やタスクを見える化して適正管理\n朝方勤務やフレックスタイム制\n年次有給休暇の計画的付与制度の導入\n有給休暇の時間単位の取得制度の検討\nノー残業デーの設定\n年次有給休暇により連休の設定「プラスワン休暇」","d":"B"},{"id":901,"cat":"過重労働","q":"疲労度蓄積度自己診断チェックリスト はどんな時に使いますか ？家族用とは？","a":"どんな時に使うのか？\n・労働者本人が、疲労感や体調の変化を自覚したとき\n・事業者が、長時間労働者に健康相談が必要かどうかを判断したいとき\n・事業者が、長時間労働が常態化している職場を対象に実施し、疲労蓄積度の状況を管理職と共有したうえで対策を検討するとき\n・産業医が、面接指導の場で状況把握の参考資料として用いるとき\n・産業医が、健診事後措置における保健指導の参考として活用するとき\n家族用は？\n・家族が、労働者本人に「心配している」ことを伝え、生活や働き方を見直すきっかけにしてほしいとき","d":"B"},{"id":903,"cat":"過重労働","q":"労働時間を誤魔化しているかもしれない労働者がいました、どうする？","a":"・事実確認を行う\n　本当にごまかしがあるのかを確認する。タイムカード、入退室記録、防犯カメラ映像などの客観資料を中心に整理する。\n・従業員からの意見聴取を行う\n　証拠を踏まえつつ、冷静かつ公正な立場で話を聞く。従業員側の言い分や事情もあわせて把握する。\n・適切な処分を行う\n　就業規則に基づき、行為の内容や影響の程度に応じた対応を行う。\n・予防策の導入を行う\n　再発防止のため、勤怠管理システムの導入や運用ルールの見直し、定期的な監査などを実施する。\n全体の流れとしては、ハラスメント対応と同様に「事実確認→聴取→判断・措置→再発防止」の型で進めるイメージ。","d":"C"},{"id":905,"cat":"過重労働","q":"労働時間をごまかすことで何が良くないのか","a":"・自身の健康を守りにくくなる。\n・労働時間に見合った正当な賃金を受け取れなくなるおそれがある。\n・正確な労働時間が把握できないと、過重労働対策を適切に立てられない。\n・労働時間の実態が見えなければ、人手不足の解消策や業務配分の見直しなどを検討しにくく、職場改善につながりにくい。\n・なお、事業者には労働者の労働時間を把握する責務がある。","d":"C"},{"id":907,"cat":"過重労働","q":"労働時間以外に労災の原因となるイベントはありますか","a":"勤務負荷を評価する観点\n・勤務時間の不規則性\n・事業場外における移動時間\n・心理的・身体的負荷を伴う業務\n・作業環境（温度、騒音など）\n心理的負荷の具体例\n・危険物を扱う\n・納期対応\n・悲惨な事故の経験\n・ハラスメント、転勤、昇進など","d":"A"},{"id":910,"cat":"両立支援","q":"病気を抱える労働者の支援は？","a":"「治療と仕事の両立支援」を進めるため、まずは職場として受け入れやすい環境整備を行う。\n事業者は、両立支援の基本方針と事業所内ルールを作成し、労働者へ周知したうえで、支援に取り組みやすい職場風土を育てる。あわせて、研修などを通じて意識啓発を図る。\n支援の開始は原則として労働者からの申出を起点とするため、安心して相談できる相談窓口を設け、健康情報等の取扱ルールを明確化しておく。\nまた、時間単位の年次有給や傷病休暇などの休暇制度に加え、フレックス、短時間勤務、在宅勤務といった勤務制度を整備し、関係者間で情報共有が滞らないよう、事前に運用体制も整えておく。","d":"A"},{"id":912,"cat":"両立支援","q":"個別事例の両立支援の進め方は？","a":"労働者は、両立支援に必要な情報を自ら収集し、事業者へ提出する。必要に応じて、本人の同意を得たうえで、産業医や人事労務担当者が主治医と連携する。\n事業者は、産業医等から就業に関する意見を聴取し、主治医・産業医の見解を踏まえて、就業の可否を判断する。\n就業可の場合は、必要な就業上の措置・配慮を検討し、両立支援プランを作成して実行する。\n就業不可の場合は、治療に専念できるよう、休暇制度等について情報提供を行う。","d":"A"},{"id":914,"cat":"両立支援","q":"両立支援の留意事項は？","a":"就労により疾病が悪化したり労働災害につながったりしないよう、必要に応じて就業場所の変更、作業の転換、労働時間の短縮、深夜業の減少などの措置・配慮を行い、安全と健康を確保する。\nまた、労働者本人には治療努力（通院、服薬、適切な生活習慣の維持など）を継続し、必要な支援を自ら申し出ることが求められる。\n措置の検討にあたっては、疾病の症状や治療の副作用、障害の程度によって、健康状態や業務遂行能力が変動し得る点を前提にする。\nあわせて、対応方法と情報管理体制を明確にし、個人情報の保護を徹底する。さらに、事業所内の関係者に加え、医療機関や地域の関係機関とも連携して進める。","d":"A"},{"id":916,"cat":"両立支援","q":"両立支援 で重要なことは？","a":"治療と両立しながら、必要な配慮を受けつつ就労を継続できる状態を目指す。\n* 通院への柔軟な対応\n* 就業場所の変換\n* 労働時間の短縮\n* 深夜業の回数の減少","d":"A"},{"id":918,"cat":"両立支援","q":"両立支援が大切な理由を教えてください","a":"がんをはじめ、多くの疾患は「治して終わり」ではなく、治療や管理を続けながら生活するものへと位置づけが変わってきている。\n今後、労働生産人口の減少が見込まれるなかで、労働力の確保と多様な人材の活用という観点からも、両立支援の重要性は一層高まる。","d":"B"},{"id":920,"cat":"両立支援","q":"両立支援 の勤務制度 3つ","a":"1　**時差出勤制度**\n始業・終業時刻をずらして勤務できる制度。混雑などで身体的負担が大きい通勤時間帯を避けるといった運用が可能になる。\n2　**短時間勤務制度**\n所定労働時間を短縮する仕組み。療養中や療養後の体力的負担を抑えながら働けるようにする目的で活用できる。\n3　**在宅勤務（テレワーク）**\nパソコン等の情報通信機器を用い、勤務地に縛られない柔軟な働き方を可能にする制度。自宅で勤務できるため、通勤に伴う身体的負担の軽減につながる。","d":"B"},{"id":922,"cat":"両立支援","q":"次世代法に基づく行動計画とは？内容は？","a":"両立支援を進める際に、101人以上の企業で策定が求められている行動計画。\n仕事と育児・介護の両立を妨げている要因や、現場のニーズを把握し、それを踏まえて支援策を整理・推進していくための土台となる。","d":"B"},{"id":925,"cat":"女性則","q":"女性の従事が制限されている業務は？","a":"女性労働基準規則（女性則）では、すべての女性について、一定の有害・高負荷作業に関して就業制限（就労禁止）が設けられている。対象となるのは、たとえば次のような作業である。\n* 規定を超える重量物作業\n* 第3管理区分の屋内作業場\n* タンク等で、呼吸用保護具の着用が義務となる作業場\n* 一部の坑内作業","d":"A"},{"id":927,"cat":"女性則","q":"女性則の重量物作業の制限は？","a":"断続作業(kg)\n継続作業(kg)\n16歳未満\n12\n8\n16歳以上18歳未満\n25\n15\n18歳以上\n30\n20\n母性健康管理（妊婦）\n10\n6-8\n「職場における腰痛予防対策指針」では、持ち上げ・取り扱い重量の目安として、満18歳以上の場合、\n男性：体重のおおむね40％以下\n女性：男性の60％程度まで\nとされている。\n計算例：男性70㎏：70 × 0.4 ＝ 28㎏、女性50㎏：50 × 0.4 × 0.6 ＝ 12㎏","d":"A"},{"id":929,"cat":"女性則","q":"重量物の上限を超えてしまう場合の対処は？","a":"やむを得ず、上記1の目安を超える重量物を扱わせる必要がある場合は、適切な姿勢を確保したうえで、身長差の小さい労働者2人以上で作業するよう努める。\nその際、負担が偏らないように、各労働者にかかる重量が均一になるよう配慮する。","d":"A"},{"id":931,"cat":"女性則","q":"化学物質の女性の就労制限は？","a":"女性労働基準規則で規制対象となる26の物質については、一定の条件に該当すると女性労働者の就労が禁止となる。具体的には、規制対象物質に関する作業環境測定の結果が「第3管理区分」となった場合、または、タンク・船倉内など呼吸用保護具の着用が義務づけられている場所が該当し、いずれもすべての女性労働者が就労禁止となる。\n規制対象の例として、特定化学物質予防障害予防規則からカドミウム、クロム酸塩、水銀、スチレン、トリクロロエチレン、マンガン、鉛中毒予防規則から鉛、有機溶剤中毒予防規則からキシレン、トルエンなどが挙げられる。","d":"A"},{"id":933,"cat":"女性則","q":"妊産婦 の従事が制限されている業務を教えてください","a":"一般女性に対する制限業務に加えて、次の点にも留意する。\nさく岩機・鋲打機等、身体に著しい振動を与える機械器具を用いる業務は制限対象。\nまた、暑熱・寒冷・異常気圧下の作業については、\n妊婦は就労不可（×）\n産婦は、女性が申し出た場合は就労不可（×）\n  という扱いになる。","d":"A"},{"id":935,"cat":"女性則","q":"女性職員が生理休暇を申請した場合はどうしますか","a":"生理日の就業が著しく困難な女性が休暇を請求した場合、事業者は当該労働者をその日に就業させてはならず、生理休暇を付与しなければならない。\nまた、申請にあたって診断書などの特別な書類を求める必要はない。","d":"B"},{"id":938,"cat":"喫煙","q":"紙巻たばこ、加熱式タバコ、電子タバコとはどんなものですか §27. 酸欠、CO中毒","a":"紙巻たばこ：タバコの歯を燃やして煙を吸入\n加熱式タバコ：電気で加熱したタバコの蒸気を吸入\n電子タバコ：電気で液体を加熱して発生した蒸気を吸入。","d":"B"},{"id":940,"cat":"喫煙","q":"タバコの有害性・疫学は？","a":"ニコチン\n・強い依存性がある\n・血管収縮や心拍数増加を通じて心臓への負担を増やし、動脈硬化にも関与する\nタール\n・たばこの煙に含まれる粒子状成分の総称\n・発がん性物質を含む成分が多い\n一酸化炭素\n・酸素運搬を妨げるほか、動脈硬化の進行に関与するとされる\nその他に含まれ得る物質\n・カドミウム、ヒ素、ベンゼン、トルエン など\n喫煙状況（国内の目安）\n・喫煙率は減少傾向\n・2023年の推計として、男性25.6％、女性6.9％、全体15.7％\n・紙巻き以外（加熱式たばこ）の利用が一定割合を占め、3割程度という報告もある\n・いわゆる「電子たばこ」は、たばこ葉を用いない蒸気タイプを指すことが多く、加熱式たばこと区別して扱う\n国際比較（イメージ）\n・男性36.7％、女性7.8％というデータもあり、低・中所得国で高い傾向がある","d":"B"},{"id":942,"cat":"喫煙","q":"喫煙の健康障害について教えてください","a":"肺がん、尿路上皮がん、咽頭癌、喘息、肺気腫、脳血管障害、心血管障害、歯周病","d":"B"},{"id":944,"cat":"喫煙","q":"受動喫煙防止の施設規制は？","a":"第一種施設：学校、医療機関、児童福祉施設、行政機関の庁舎など。受動喫煙の影響を受けやすい人が主に利用する施設であり、原則として敷地内禁煙。ただし、要件を満たす特定屋外喫煙場所は設置できる。\n第二種施設：事務所、飲食店、宿泊施設など。原則として屋内禁煙。例外として、屋内に「喫煙専用室」「加熱式たばこ専用喫煙室」を設けることや、屋外に屋外喫煙場所を設けることができる。\n・喫煙専用室：室内での飲食サービスは不可\n・加熱式たばこ専用喫煙室：室内での飲食サービスは可\n加えて「喫煙目的施設」（例：スナック、バーなど）という区分もある。\n屋外喫煙場所の要件\n・通路から25m以上離す\n・換気扇の近くなど、煙が屋内へ流れ込みやすい場所は避ける\n屋内喫煙室の要件\n・出入口で、室内側へ向かう気流が0.2m/s以上となるようにする\n・壁・天井で区画し、煙が屋外へ排出される構造とする","d":"A"},{"id":946,"cat":"喫煙","q":"健康増進法の改正内容","a":"2020年4月1日から全面施行。\n・基本ルールとして、屋内は原則禁煙。\n・喫煙室の種類ごとに定義が示され、設置する場合の技術基準が定められている。\n・施設内のルール（禁煙・喫煙可能場所など）について、所定の表示を行う義務がある。\n・20歳未満は喫煙室等への立ち入りが禁止。\n・従業員の受動喫煙を防ぐための措置について、事業者に一定の対応が求められる（努力義務を含む整理）。\n・事業者向けに、財政支援（受動喫煙防止対策助成金）や税制上の支援が用意されている。\n・ルール違反に対する罰則規定がある。","d":"A"},{"id":948,"cat":"喫煙","q":"喫煙可能室の種類は？","a":"喫煙専用室：喫煙のみを行う部屋で、飲食の提供はできない。\n加熱式たばこ専用喫煙室：加熱式たばこの喫煙を想定した部屋で、飲食の提供は可能。\n喫煙可能室：経過措置として認められる区分で、「2020年4月時点で既に営業していた」かつ「資本金5000万円以下」かつ「客席面積100㎡以下」の要件を満たす飲食店が対象。\n表示：施設入口および喫煙室入口に、所定の掲示（表示）を行う義務がある。","d":"A"},{"id":950,"cat":"喫煙","q":"喫煙専用室の技術基準は？","a":"・出入口で、室内へ向かう気流が0.2m/s以上確保されていること\n・壁と天井で区画され、外部と明確に分離されていること\n・たばこの煙が屋外へ排気される構造になっていること","d":"A"},{"id":952,"cat":"喫煙","q":"特定屋外喫煙場所の要件は？","a":"特定屋外喫煙場所の要件（第1種施設の場合）\n・第1種施設の屋外に設けること\n・禁煙場所と明確に区画されていること\n・喫煙場所である旨の標識を掲示すること\n・施設利用者が通常立ち入らない場所に設けること","d":"B"},{"id":954,"cat":"喫煙","q":"喫煙対策の財政・税制支援とは？","a":"財政的な支援として、中小企業向けに「受動喫煙防止対策助成金」がある。あわせて税制面では、設備投資に対して特別償却または税額控除を受けられる制度が用意されている。\n助成金は各都道府県労働局へ申請し、喫煙専用室などの設置・改修費用が対象となる。一定の要件を満たす事業者（飲食業であれば、労働者数50人以下、または資本金5000万円以下など）に対して、補助上限100万円の範囲で、費用の1/2（飲食業は2/3）が助成される。","d":"B"},{"id":956,"cat":"喫煙","q":"受動喫煙防止対策の導入方法について教えてください","a":"①事業者が意義と義務を理解した上で決意表明\n②助成金などの補助金を活用して設備を整える\n③副流煙のリスクを労働者に教育する\n④事業場内の禁煙、喫煙場所を労働者に周知する。","d":"B"},{"id":959,"cat":"事務所作業","q":"事務所作業に関する規則は？","a":"事務所衛生基準規則（事務所則）は、事務所における衛生水準を確保するためのルールで、作業環境の管理、清潔保持、休養のための設備、救護用具の備付けなどについて定めている。","d":"A"},{"id":961,"cat":"事務所作業","q":"空気調和設備を設けている部屋の基準","a":"測定は室内の中央付近で行い、床上75〜150cmを目安とする。\nホルムアルデヒドは床上50〜150cmで測定し、粉塵と同様の高さ設定とする。\nCO\n10ppm\nCO2\n1000ppm\n気温\n18-28\n0.5度\n湿度\n40-70\n0.5度\n気流\n0.5m/s\n0.2m/s以上測定可能な風速計\n粉塵\n0.15\nデジタル粉塵計\nホルムアルデヒド\n0.1\n6-9月","d":"A"},{"id":963,"cat":"事務所作業","q":"事務所における照度の基準は？","a":"一般的な事務作業：\n300\nルクス以上\n付随的な事務作業：\n150\nルクス以上。\n付随的な事務作業とは資料の袋詰めなど。","d":"B"},{"id":965,"cat":"事務所作業","q":"事務所におけるトイレの設置基準は？","a":"便所の設置数（目安）は、次の考え方で整理できる。\n・男性労働者：60人ごとに男性便房（大便用）1個\n・男性労働者：30人ごとに男性便房（小便用）1個\n・女性労働者：20人ごとに女性便房 1個\n独立個室型便所を設けた場合は、算定上の人数を男女それぞれ10人分差し引いて計算する。\nまた、常時10人以内の事業所では、独立個室型便所を設ければ、男女の区別を設けなくてもよい。","d":"B"},{"id":967,"cat":"事務所作業","q":"休養室・休養所は？","a":"常時50人以上、または常時女性30人以上の労働者を使用する事業者は、休養室または休養所を設け、男性用と女性用を区別して設置する。\n休養室は、体調不良の労働者が横になって休むことを想定する。運用にあたっては、プライバシーを確保すること、関係者以外の出入りを制限すること、緊急時に安全に対応できる体制を整えることなどに配慮する。","d":"B"},{"id":969,"cat":"事務所作業","q":"救急用具は？","a":"負傷者の応急手当に必要な救急用具や材料を備え付ける義務がある。\n具体的な品目は法令で一律に指定されていないため、安全管理者、衛生管理者、産業医などの意見も踏まえつつ、衛生委員会等で検討し、事業場の実態に合った内容を整備する。","d":"B"},{"id":971,"cat":"事務所作業","q":"情報機器作業における健康障害を防ぐにはどうしたら良いか","a":"作業環境管理\nディスプレイの明るさ\n机や椅子の選び方\n照度、ちらつきがないか\n作業管理\n作業姿勢\n1時間に10-15分の休憩を挟む\n健康管理\n健康診断\n職場体操","d":"A"},{"id":973,"cat":"事務所作業","q":"情報機器作業における健康障害を防ぐにはどうしたら良いか ","a":"1 照明・採光\n(1) 室内は、明暗差が過度に大きくならないようにし、まぶしさが生じない環境とする。\n(2) ディスプレイ作業を行う場合、書類面およびキーボード面の照度は300ルクス以上を確保し、作業しやすい明るさに整える。あわせて、画面の明るさ、書類面・キーボード面の明るさ、周辺の明るさの差はできるだけ小さくする。\n2 情報機器\n(1) 情報機器を導入する際は、作業者への健康影響に配慮し、担当する作業に適した機器を選定して導入する。\n(2) ディスプレイは、目的とする作業を無理なく行える画面サイズとし、輝度やコントラストを作業者が容易に調整できるものとする。必要に応じて、作業環境や作業内容に合った反射処理が施されたものが望ましい。さらに、画面の位置、前後の角度、左右の向きなどを調整できるものが望ましい。\n3 作業時間\n(1) 1日の情報機器作業が過度に長時間にならないようにする。1回の連続作業は1時間を超えないようにし、次の連続作業までの間に10〜15分程度の作業休止時間を設ける。また、1回の連続作業の中でも1〜2回程度の小休止を挟む。","d":"A"},{"id":974,"cat":"事務所作業","q":"VDTガイドラインの変更点","a":"テレワーク作業者への配慮については、用語を「VDT」ではなく「情報機器」に統一する。\nタブレット、スマホ、ウェアラブル端末まで含めるイメージで扱う。\nまた、旧「VDTガイドライン」（平成14年 基発0405001号）は、明確に廃止されたものとして整理する。","d":"A"},{"id":976,"cat":"事務所作業","q":"テレワークを行う上で事業主はどのようなことが求められるか","a":"雇入時の安全衛生教育では、テレワーク中の安全衛生や健康確保に関する内容も扱う。\nまた、サテライトオフィスを選定する際は、事務所衛生基準規則（事務所則）と同等の環境が確保されているかを確認する。","d":"A"},{"id":978,"cat":"事務所作業","q":"テレワークで気をつけること","a":"就業規則などでルールを明確にし、運用を徹底する。\n就業時間の把握\n・パソコンのログイン／ログオフ、入退室記録など客観的な記録を活用する\n・自己申告を併用する場合は、実態と乖離しない仕組みにする\n長時間労働への対策\n・時間外のメール送付やシステムアクセスを制限する\n・管理者と労働者の双方に注意喚起を行い、是正につなげる\n支援策の活用\n・人材確保等支援補助金の活用を検討する\nメンタルケア\n・孤立感が強まりやすいため、定期的な面談や相談窓口の周知など、支援につながる仕組みを整える","d":"A"},{"id":980,"cat":"事務所作業","q":"テレワークで気をつけること","a":"テレワークでは、次のような課題が生じやすい。\n・本人の意図に反して長時間労働になりやすい\n・作業環境が必ずしも適切とは限らない場合がある\n・相談のハードルが上がり、孤立感が強まってメンタル不調の要因となることがある（ラインケアが届きにくい）\n・生活リズムが崩れやすく、食生活にも影響しやすい","d":"A"},{"id":981,"cat":"事務所作業","q":"テレワークの作業環境整備","a":"https://www.mhlw.go.jp/stf/newpage_01603.html","d":"A"},{"id":983,"cat":"事務所作業","q":"職場の感染対策は？","a":"作業環境管理：換気を確保し、対人距離を取りやすい配置にする。共用部や接触頻度の高い箇所は消毒を行う。\n作業管理：手洗い・消毒を徹底し、必要に応じてマスクを着用する。\n健康管理：検温や体調確認を行い、体調不良者が無理に出勤しない運用にする。\nさらに、パンデミックに備えて、上記に加え「予防対策」「感染者発生時の対応」「事業の復旧」に関する方針や手順を含めたBCPを策定しておく。","d":"B"},{"id":985,"cat":"事務所作業","q":"BCPとは？","a":"BCPはBusiness Continuity Planの略で、業務継続計画を指す。パンデミックや地震などで通常の事業運営が難しくなった場合でも、重要業務を止めない（または早期に再開する）ための方針と手順をあらかじめ整理しておくもの。\n計画に盛り込みやすい内容の例\n・予防対策：情報収集・連絡体制の整備、施設への立入制限、出社・出張の制限など\n・発症者等への対応：発症者を休ませる、在宅勤務への切替など\n・復旧対策：人員・物資など資源の確保、事業の絞り込み、再開の基準や段取りの明確化など\nまた、「介護・福祉型」の施設では、BCPを策定することがガイドライン上求められている、という整理になる。","d":"B"},{"id":988,"cat":"小問","q":"労働災害防止計画とは","a":"国、事業者、労働者などの関係者が一体となり、「一人の被災者も出さない」という基本理念の実現を目指す。\nそのために、労働安全衛生法第6条に基づき、労働災害防止の基本目標や重点課題などを厚生労働大臣が定める5か年計画が策定されている。\n令和5年度から令和9年度までの計画が、第14次労働災害防止計画\n。","d":"B"},{"id":990,"cat":"小問","q":"第14次労働災害防止計画の背景","a":"第13次計画では労災死亡者数は減少した一方で、高齢労働者の増加などを背景に死傷者数は増加している。特に転倒などが全体の約4割を占め、中高年女性で目立つ。\nまた、就労者の約3人に1人が何らかの疾病を抱えて働いているとされ、定期健康診断の有所見率も50％を超える状況にある。それにもかかわらず、治療と仕事の両立支援に取り組む事業所は約4割にとどまる。\nメンタル面では、強い不安やストレスを自覚する労働者が2022年時点で約5割とされる。\n化学物質による労災は年400件程度で、その約8割は個別規制の対象外物質によるものと整理されている。\n石綿については、解体作業が2030年頃にピークを迎える見込みとされる。","d":"B"},{"id":992,"cat":"小問","q":"第14次労働災害防止計画のアウトプットとアウトカム指標は","a":"・死亡災害については、2022年と比較して、2027年においては、5％以上減少する \n・死傷災害については、2021年までの増加傾向に歯止めをかけ、死傷者数については、2022年と比較して2027年までに減少に転ずる","d":"B"},{"id":994,"cat":"小問","q":"第14次労働災害防止計画 の 重点対策8つ","a":"自発的に安全衛生対策にとりくむための意識啓発\n中高年齢女性の作業行動に起因する労災防止\n高年齢労働者の労災防止\n多様な働き方への対応、外国人労働者の労災防止\n個人事業主の安全衛生対策\n業種別の労災防止\n労働者の健康確保対策\n化学物質の健康障害防止対策","d":"B"},{"id":996,"cat":"小問","q":"第14次労働災害防止計画","a":"の重点対策8つ\n中高年齢女性の作業行動に起因する労災防止\n正社員以外への安全衛生教育80％以上→転倒増加歯止め、40日以下\nノーリフトケア増加→社会福祉施設での腰痛減少\n高年齢労働者の労災防止\nエイジフレンドリーガイドライン50％以上→60才以上の増加歯止め\n多様な働き方への対応、外国人労働者の労災防止\n母国語、視聴覚教材50％以上→外国人労働者の労災を平均以下","d":"B"},{"id":997,"cat":"小問","q":"第14次労働災害防止計画","a":"の重点対策8つ\n業種別の労災防止\n　運送業：荷役作業安全ガイドライン45％以上→労災5％↓\n　建設業：墜落転落RA85％以上→死亡15％↓\n　製造業：はさまれ、まきこまれ防止対策60％以上→その労災5％↓\n　林業：伐木ガイドライン50％以上→死亡15％↓\n労働者の健康確保対策\n　メンタル80％、ストレスチェック50％以上→仕事ストレス者50％未満\n　有給取得率70％以上、インターバル導入15％以上→週60時間以上を5％以下\n化学物質の健康障害防止対策\n義務以外のラベルSDS交付、RA実施を80％以上→化学物質労災を5％↓","d":"B"},{"id":1001,"cat":"小問","q":"外国人労働者の労災は","a":"https://www.mhlw.go.jp/content/11200000/001287207.pdf","d":"B"},{"id":1004,"cat":"小問","q":"最近の改正の復習","a":"令和7年度\n安衛法　\n個人事業者\n熱中症\n令和6年度\n皮膚障害\nなど防止用保護具の選定マニュアル\n個人事業者の健康管理に関するガイドライン\n令和5年度\n第14次労働災害防止計画\n第10次\n粉じん\n障害防止総合対策\n自律的な化学物質管理\n騒音\n障害防止のためのガイドライン\n令和3年度\n特化則改正：\n溶接ヒュ－ム\n石綿則\n改正：レベル3の事前調査\n電離則\n改正：水晶体の被ばく限度\n作業環境測定規則改正：C測定、D測定\n事務所則改正：照度、便所など\nTHP指針\n：データヘルス、コラボヘルス\n令和2年度\n働き方改革\nと労働時間上限\nエイジフレンドリ－ガイドライン\nハラスメント関連改正","d":"B"},{"id":1005,"cat":"小問","q":"R7安衛法改正のポイント","a":"個人事業者\nストレスチェック 50人未満\n化学物質の通知義務違反に罰則\n個人ばく露測定を作業環境測定の一つに位置づけ、作業環境測定士による実施が必要\n高年齢労働者の対策を努力義務","d":"B"},{"id":1007,"cat":"小問","q":"健康経営とは","a":"従業員などの健康管理を、経営課題として捉え、経営的な視点で戦略的に実践する取組。\n経済産業省は「健康経営優良法人」などの認定制度を設けており、認定は対外的な評価や採用・取引面でのメリットにつながるなど、企業にとってインセンティブになり得る。","d":"B"},{"id":1009,"cat":"小問","q":"安全衛生管理活動に消極的な事業者に対してどうする","a":"法改正により、リスクアセスメント等の取組が求められる範囲が広がっている。\n労働災害を防ぐことは、単に安全確保にとどまらず、生産性の向上や保険料負担の抑制にもつながる。\nまた、労災が起きた場合のコストは「直接コスト」だけではない。一般に、間接コストは直接コストの4倍程度になる、という説明がよく用いられる。\n・間接コスト：慰謝料、操業停止期間の損失、取引上の違約金など\n・直接コスト：労働者への休業補償や賠償金など","d":"B"},{"id":1011,"cat":"小問","q":"病院での労働衛生上の危険性は","a":"病原体　→標準予防策\n化学物質(\nホルムアルデヒド、エチレンオキシド\n)\n放射線\n有害光線　\n抗がん剤　\n→上記4つは、防護具、手順書などの作成、RA\n患者の移乗で腰痛　→腰痛対策(リフト、スライダーの活用)\n交代勤務　\n→交替勤務のガイドライン、面談\n長時間労働\nハラスメント","d":"A"},{"id":1013,"cat":"小問","q":"合理的配慮とは","a":"障害者差別解消法の改正により、令和6年4月1日から、事業者による障害のある人への合理的配慮の提供が法的義務となった（それ以前は努力義務）。 \n合理的配慮の例\n・電車に乗る際に、車いす利用者のためにスロープを用意する\n・書類の記入が難しい人に対して、代筆などで手続きを支援する","d":"B"},{"id":1015,"cat":"小問","q":"労働政策総合推進法の改正点について","a":"カスハラ\n就活セクハラ\nプラチナえるぼし\n両立支援","d":"B"},{"id":1017,"cat":"小問","q":"労コン対策","a":"コンサルタントとしての姿勢を示す\n知識だけならAIでよい\n相手のニーズを把握して、行動を変えられるような発言や行動ができる人間であることを示す\n聞かれたことに答える、知ったかぶりをしない、自分の言葉で説明する\nあえて簡潔に答えて、試験官から追加の質問を引き出す\n回答が終わったら、「以上です」という\nわからない問題は、「わかりません。」でサラッと流した方が、ごちゃごちゃ答えるよりもマシ。\n3回まではOKらしい","d":"B"}];
const CATS = ["導入質問", "基本知識", "リスクアセスメント", "労働災害", "作業環境測定", "換気装置・保護具", "特定化学物質", "有機溶剤", "重金属", "粉じん", "アスベスト", "電離放射線", "熱中症", "振動", "騒音", "酸素欠乏", "高気圧", "腰痛、転倒", "健康診断", "メンタルヘルス", "ストレスチェック", "過重労働", "両立支援", "女性則", "喫煙", "事務所作業", "小問"];

  "他にはいかがでしょうか。",
  "もう少し具体的にお聞かせいただけますか。",
  "他に重要な点はありますか。",

];

let S = {
  isRunning: false,

  log: [],          // [{q, blob, duration, hadFollowup}]

  const b = document.createElement('button');

document.getElementById('startBtn').onclick = async () => {
  showErr('');
  // Test mic

    const st = await navigator.mediaDevices.getUserMedia({ audio: true });

// ================================================================
// SESSION SETUP
// ================================================================
function initSession() {
  S.duration    = parseInt(document.getElementById('examTime').value);
  S.followupSec = parseInt(document.getElementById('followupSec').value);
  const catCount  = parseInt(document.getElementById('catCount').value);
  const qPerCat   = parseInt(document.getElementById('qPerCat').value);

  const bycat = {};
  DATA.forEach(it => { (bycat[it.cat] = bycat[it.cat] || []).push(it); });

  const sel = [...document.querySelectorAll('.cat-btn.on')].map(b => b.dataset.cat);
  const pool = (sel.length >= 2 ? sel : Object.keys(bycat))
    .filter(c => (bycat[c]||[]).length >= qPerCat);

  const shuffle = a => [...a].sort(() => Math.random()-.5);
  const chosen  = shuffle(pool).slice(0, catCount);

  S.session = chosen.map(cat => ({
    category: cat,
    questions: shuffle(bycat[cat]).slice(0, qPerCat)
  }));
  S.setIdx   = 0;
  S.qIdx     = 0;
  S.log      = [];
  S.isRunning= true;
  S.startTime= Date.now();

  const m = Math.floor(S.duration/60).toString().padStart(2,'0');
  const s = (S.duration%60).toString().padStart(2,'0');
  document.getElementById('exTimer').textContent = `${m}:${s}`;
  document.getElementById('exTimer').classList.remove('warn');

  S.timerIv = setInterval(tickTimer, 1000);
}

function tickTimer() {
  if (!S.startTime) return;
  const elapsed  = Math.floor((Date.now()-S.startTime)/1000);
  const remaining= Math.max(0, S.duration - elapsed);
  const m = Math.floor(remaining/60).toString().padStart(2,'0');
  const s = (remaining%60).toString().padStart(2,'0');
  document.getElementById('exTimer').textContent = `${m}:${s}`;
  if (remaining <= 60) document.getElementById('exTimer').classList.add('warn');
  if (remaining <= 0)  endExam(false);
}

// ================================================================
// MAIN EXAM LOOP (async)
// ================================================================
async function runExam() {
  const totalQ = S.session.reduce((a,s)=>a+s.questions.length,0);

  for (S.setIdx = 0; S.setIdx < S.session.length && S.isRunning; S.setIdx++) {
    const set = S.session[S.setIdx];

    // Announce category
    setRip('ex'); setStat('試験官が話しています...'); setHint('');
    setprog(`カテゴリ ${S.setIdx+1}/${S.session.length}`);
    await speakA(`「${set.category}」についてお聞きします。`);
    if (!S.isRunning) break;
    await pause(500);

    for (S.qIdx = 0; S.qIdx < set.questions.length && S.isRunning; S.qIdx++) {
      const q    = set.questions[S.qIdx];
      const done = S.session.slice(0,S.setIdx).reduce((a,s)=>a+s.questions.length,0)+S.qIdx;

      setQLbl(`質問 ${done+1} / ${totalQ}`);
      setprog(`${set.category} ｜ 問${S.qIdx+1}`);

      // Ask question (TTS only, no text)
      setRip('ex'); setStat('試験官が質問しています');
      setHint('問題文は表示されません。耳で聞いて答えてください。');
      await speakA(q.q);
      if (!S.isRunning) break;

      // Record answer
      setRip('us'); setStat('🔴 回答してください'); setHint('話し終えて3秒で自動的に次へ進みます');
      let result = await recordAnswer();
      if (!S.isRunning) { S.log.push({q,...result,hadFollowup:false}); break; }

      // Followup?
      const needFollowup = result.duration < S.followupSec && S.followupSec > 0;
      if (needFollowup) {
        const phrase = FOLLOWUP_PHRASES[Math.floor(Math.random()*FOLLOWUP_PHRASES.length)];
        setRip('ex'); setStat('他には？'); setHint('追撃です。落ち着いて続けてください。');
        await speakA(phrase);
        if (!S.isRunning) break;
        setRip('us'); setStat('🔴 続きをお聞かせください'); setHint('');
        const r2 = await recordAnswer();
        S.log.push({q, blob:r2.blob, duration: result.duration + r2.duration, hadFollowup: true});
      } else {
        S.log.push({q, ...result, hadFollowup: false});
      }

      if (!S.isRunning) break;
      setRip('idle'); setStat('次の質問へ移ります...'); setHint('');
      await pause(900);
    }
  }

  if (S.isRunning) endExam(false);
}

// ================================================================
// RECORD ANSWER (returns {blob, duration})
// ================================================================
function recordAnswer() {
  return new Promise(async (resolve) => {
    let stopped = false;
    let rafId   = null;

    function finish(recorder, chunks, stream, audioCtx, startTime) {
      if (stopped) return;
      stopped = true;
      cancelAnimationFrame(rafId);
      recorder.onstop = () => {
        const blob = chunks.length > 0 ? new Blob(chunks,{type:'audio/webm'}) : null;
        stream.getTracks().forEach(t=>t.stop());
        try{audioCtx.close()}catch(e){}
        resolve({ blob, duration: (Date.now()-startTime)/1000 });
      };
      try{ recorder.stop() }catch(e){ resolve({blob:null,duration:0}); }
    }

    // Abort hook (called by endExam)
    S.activeRecorder = { abort: () => {
      // will resolve via the stopped path in rAF
      stopped = true; cancelAnimationFrame(rafId);
      resolve({blob:null,duration:0});
    }};

    let stream, recorder, audioCtx, analyser, dataArray, startTime, silStart;
    try {
      stream    = await navigator.mediaDevices.getUserMedia({audio:true});
      recorder  = new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };

      audioCtx  = new AudioContext();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser  = audioCtx.createAnalyser();
      analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.8;
      src.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      startTime = Date.now();
      silStart  = null;

      recorder.start(100);

      function check() {
        if (stopped) return;

        // External stop (endExam)
        if (!S.isRunning) { finish(recorder, chunks, stream, audioCtx, startTime); return; }

        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a,b)=>a+b,0) / dataArray.length;
        const elapsed = Date.now() - startTime;
        const isSilent = avg < 9;

        if (elapsed > MIN_REC_MS) {
          if (isSilent) {
            if (!silStart) silStart = Date.now();
            const sil = Date.now() - silStart;
            if (sil >= SILENCE_START_MS) {
              const prog = Math.min(1,(sil-SILENCE_START_MS)/(SILENCE_END_MS-SILENCE_START_MS));
              showSil(prog);
              setStat(`🔴 沈黙 ${(sil/1000).toFixed(1)}秒 / 3秒で次へ`);
            }
            if (sil >= SILENCE_END_MS) { hideSil(); finish(recorder,chunks,stream,audioCtx,startTime); return; }
          } else {
            silStart = null; hideSil();
            setStat('🔴 回答中...');
          }
        }
        rafId = requestAnimationFrame(check);
      }
      rafId = requestAnimationFrame(check);

    } catch(e) {
      console.error('mic error',e);
      resolve({blob:null,duration:0});
    }
  });
}

// ================================================================
// END EXAM
// ================================================================
function endExam(manual=false) {
  if (!S.isRunning) return;
  S.isRunning = false;
  clearInterval(S.timerIv);
  window.speechSynthesis?.cancel();
  S.activeRecorder?.abort();
  setTimeout(buildReview, 600);
}

// ================================================================
// REVIEW
// ================================================================
function buildReview() {
  const elapsed = S.startTime ? Math.floor((Date.now()-S.startTime)/1000) : S.duration;
  const m = Math.floor(elapsed/60), s = elapsed%60;
  document.getElementById('rvSummary').textContent =
    `経過時間 ${m}分${s}秒 ｜ ${S.log.length}問回答`;

  const list = document.getElementById('rvList');
  list.innerHTML = '';

  S.log.forEach((log, idx) => {
    const dur  = Math.floor(log.duration);
    const ds   = `${Math.floor(dur/60) > 0 ? Math.floor(dur/60)+'分' : ''}${dur%60}秒`;
    const item = document.createElement('div');
    item.className = 'rv-item';

    const recHtml = log.blob
      ? `<div class="rv-rec">
           <button class="play-btn" data-url="${URL.createObjectURL(log.blob)}" onclick="togglePlay(this)">▶</button>
           <span class="rec-info">あなたの回答${log.hadFollowup ? '（追撃あり）':''}</span>
           <span class="rec-dur">${ds}</span>
         </div>`
      : `<div class="rv-rec" style="opacity:.45"><span class="rec-info">録音なし</span></div>`;

    item.innerHTML = `
      <div class="rv-item-hd">
        <div class="rv-num">${idx+1}</div>
        <div class="rv-cat">${esc(log.q.cat)}</div>
        <div class="rv-diff">難易度${log.q.d||'B'}</div>
      </div>
      <div class="rv-q">
        <span class="rv-q-label">質問（試験中は非表示でした）</span>
        ${esc(log.q.q)}
      </div>
      ${recHtml}
      <div class="rv-ans">
        <h4>模範解答</h4>
        <div class="rv-ans-text">${esc(log.q.a)}</div>
      </div>`;

    list.appendChild(item);
  });

  if (S.log.length === 0)
    list.innerHTML = '<div style="padding:36px;text-align:center;color:var(--soft)">回答データがありません</div>';

  showScreen('reviewSc');
}

// ================================================================
// AUDIO PLAYBACK
// ================================================================
let curAudio = null;
function togglePlay(btn) {
  if (curAudio && !curAudio.paused) {
    curAudio.pause();
    document.querySelectorAll('.play-btn').forEach(b=>{b.classList.remove('playing');b.textContent='▶';});
    curAudio = null; return;
  }
  document.querySelectorAll('.play-btn').forEach(b=>{b.classList.remove('playing');b.textContent='▶';});
  const a = new Audio(btn.dataset.url);
  a.onended = () => { btn.classList.remove('playing'); btn.textContent='▶'; curAudio=null; };
  a.play(); btn.classList.add('playing'); btn.textContent='⏹';
  curAudio = a;
}

// ================================================================
// UI HELPERS
// ================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}
function setRip(s) {
  const w = document.getElementById('ripWrap');
  const c = document.getElementById('ripCore');
  w.className = 'rip-wrap ' + (s==='ex'?'st-ex':s==='us'?'st-us':'st-idle');
  c.textContent = s==='ex'?'🎤':s==='us'?'🎙️':'💭';
}
function setStat(t) { document.getElementById('exStat').textContent = t; }
function setHint(t) { document.getElementById('exHint').textContent = t; }
function setprog(t) { document.getElementById('exProg').textContent = t; }
function setQLbl(t) { document.getElementById('qLabel').textContent = t; }
function showSil(p) {
  document.getElementById('silWrap').classList.add('show');
  document.getElementById('silFill').style.width = (p*100)+'%';
}
function hideSil() {
  document.getElementById('silWrap').classList.remove('show');
  document.getElementById('silFill').style.width = '0%';
}
function showErr(msg) {
  const el = document.getElementById('errBox');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}
function esc(s) {
  return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
// 読み上げ前テキスト整形
const ABBREV = [
  [/\bRA\b/g,    'リスクアセスメント'],
  [/\bSDS\b/g,   'エスディーエス'],
  [/\bGHS\b/g,   'ジーエイチエス'],
  [/\bWBGT\b/g,  'ダブリュービージーティー'],
  [/\bIARC\b/g,  'アイエーアールシー'],
  [/\bTHP\b/g,   'ティーエイチピー'],
  [/\bPDCA\b/g,  'ピーディーシーエー'],
  [/\bOSHMS\b/g, 'オーエスエイチエムエス'],
  [/\bMOCA\b/g,  'モカ'],
  [/\b4S\b/g,    'よんエス'],
  [/\b5S\b/g,    'ごエス'],
  [/\bA測定\b/g,  'エー測定'],
  [/\bB測定\b/g,  'ビー測定'],
  [/\bC測定\b/g,  'シー測定'],
  [/\bD測定\b/g,  'ディー測定'],
];
function cleanForSpeech(text) {
  let s = text;
  // 略語を先に展開
  for (const [re, rep] of ABBREV) s = s.replace(re, rep);
  // 全角スペース削除
  s = s.replace(/\u3000/g, '');
  // 日本語文字の間にあるスペースを削除（PPTXの抽出アーティファクト対策）
  for (let i = 0; i < 6; i++) {
    s = s.replace(/([\u3040-\u9FFF\uF900-\uFAFF])\s+([\u3040-\u9FFF\uF900-\uFAFF])/g, '$1$2');
  }
  // 残るスペースを読点に
  s = s.replace(/\s+/g, '、');
  // 記号整理
  s = s.replace(/[「」『』]/g, '');
  s = s.replace(/[（(]/g, '、');
  s = s.replace(/[）)]/g, '。');
  s = s.replace(/[\/／]/g, 'または');
  s = s.replace(/[、。]{2,}/g, '。');
  return s.trim();
}

function speakA(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) { resolve(); return; }
    speechSynthesis.cancel();

    // テキスト整形してから句点で分割
    const cleaned = cleanForSpeech(text);
    const parts = cleaned
      .replace(/([。！？])/g, '$1|||')
      .split('|||')
      .map(s => s.trim())
      .filter(s => s.length > 0);
    if (!parts.length) { resolve(); return; }

    // Chrome Android: 停止バグ対策
    const keepAlive = setInterval(() => {
      if (window.speechSynthesis && speechSynthesis.paused) speechSynthesis.resume();
    }, 5000);

    let i = 0;
    function next() {
      if (i >= parts.length) { clearInterval(keepAlive); resolve(); return; }
      const u = new SpeechSynthesisUtterance(parts[i++]);
      u.lang = 'ja-JP';
      u.rate = 0.95;  // 自然なペース
      u.pitch = 1.0;  // デフォルト音程（0.88は不自然）
      u.volume = 1.0;
      u.onend = () => setTimeout(next, 100);
      u.onerror = () => setTimeout(next, 100);
      speechSynthesis.speak(u);
    }
    next();
  });
}
function pause(ms) { return new Promise(r=>setTimeout(r,ms)); }
