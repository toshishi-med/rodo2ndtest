<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>労コン口述道場 Pro ─ 本番模擬面接</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C06080;--pink-deep:#9E4663;--pink-light:#FDE8E8;
  --paper:#FFF9FA;--ink:#3A2E33;--soft:#7A6A71;--line:#EFD8DE;
  --ok:#5E9678;--ng:#C05858;--blue:#4A80C4;--rad:14px;
  --ex:#4A80C4;--us:#C06080;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.show{display:flex}

/* ── INTRO ── */
.logo{font-family:"Zen Old Mincho",serif;font-size:1.6rem;font-weight:700;color:var(--pink);text-align:center;line-height:1.3}
.logo small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:.72rem;color:var(--soft);font-weight:400;margin-top:6px;letter-spacing:.08em}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:18px;width:100%;max-width:460px;margin:18px 0 0}
.card h3{font-size:.78rem;color:var(--soft);font-weight:700;letter-spacing:.1em;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.87rem}
.row select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:.84rem;color:var(--ink);background:#fff;min-width:130px}
.cat-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cat-btn{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:.68rem;font-weight:700;color:var(--soft);cursor:pointer;transition:.12s}
.cat-btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.start{margin-top:16px;width:100%;max-width:460px;padding:15px;border-radius:var(--rad);border:none;background:var(--pink);color:#fff;font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;letter-spacing:.1em}
.start:disabled{opacity:.35;cursor:not-allowed}
.err-box{background:#FFF3F3;border:1px solid #FFB3B3;border-radius:10px;padding:12px;font-size:.8rem;color:#C62828;text-align:center;display:none;max-width:460px;width:100%;margin-top:10px}
.err-box.show{display:block}

/* ── EXAM ── */
#examSc{background:#12121E;color:#fff;justify-content:space-between;padding:0}
.ex-head{width:100%;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06)}
.ex-prog{font-size:.75rem;color:rgba(255,255,255,.5)}
.ex-timer{font-family:monospace;font-size:1.25rem;color:#fff;font-weight:700}
.ex-timer.warn{color:#FF9970;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.ex-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:28px}
.q-label{font-size:.7rem;color:rgba(255,255,255,.35);letter-spacing:.14em;text-transform:uppercase;min-height:18px}

/* ── RIPPLE ── */
.rip-wrap{position:relative;width:170px;height:170px;flex-shrink:0}
.rip-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;z-index:2;transition:background .35s,box-shadow .35s}
.rip-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;opacity:0;z-index:1}
.rip-ring.a{width:88px;height:88px}
.rip-ring.b{width:120px;height:120px}
.rip-ring.c{width:155px;height:155px}

.st-idle .rip-core{background:#2A2A40;box-shadow:none}
.st-ex .rip-core{background:var(--ex);box-shadow:0 0 32px rgba(74,128,196,.55)}
.st-ex .rip-ring{border:2px solid rgba(74,128,196,.5);animation:rout 2s ease-out infinite}
.st-ex .rip-ring.b{animation-delay:.55s}
.st-ex .rip-ring.c{animation-delay:1.1s}
.st-us .rip-core{background:var(--us);box-shadow:0 0 32px rgba(192,96,128,.6)}
.st-us .rip-ring{border:2px solid rgba(192,96,128,.5);animation:rout 2s ease-out infinite}
.st-us .rip-ring.b{animation-delay:.45s}
.st-us .rip-ring.c{animation-delay:.9s}
@keyframes rout{0%{transform:translate(-50%,-50%) scale(.85);opacity:.65}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.rip-ring{animation:none!important}}

.ex-stat{font-size:1rem;color:rgba(255,255,255,.9);text-align:center;min-height:28px;font-weight:500}
.ex-hint{font-size:.75rem;color:rgba(255,255,255,.35);text-align:center;max-width:300px;line-height:1.65;min-height:40px}
.sil-wrap{width:220px;height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;display:none}
.sil-wrap.show{display:block}
.sil-fill{height:100%;background:linear-gradient(90deg,#FF9970,#FF5050);border-radius:999px;transition:width .12s}
.ex-foot{padding:14px;text-align:center}
.end-btn{border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.45);border-radius:8px;padding:8px 20px;font-family:inherit;font-size:.75rem;cursor:pointer}

/* ── REVIEW ── */
#reviewSc{background:var(--paper);align-items:stretch;justify-content:flex-start;padding:0}
.rv-head{background:#12121E;color:#fff;padding:20px 20px 16px;text-align:center;flex-shrink:0}
.rv-head h1{font-size:1.15rem;font-weight:700;margin-bottom:5px}
.rv-head p{font-size:.73rem;color:rgba(255,255,255,.45)}
.rv-list{flex:1;overflow-y:auto;padding:14px;max-width:660px;margin:0 auto;width:100%}
.rv-item{background:#fff;border:1px solid var(--line);border-radius:var(--rad);margin-bottom:14px;overflow:hidden}
.rv-item-hd{padding:10px 14px;background:var(--pink-light);display:flex;align-items:center;gap:8px}
.rv-num{width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rv-cat{font-size:.7rem;color:var(--pink-deep);font-weight:700}
.rv-diff{font-size:.64rem;color:var(--soft);margin-left:auto;background:var(--line);border-radius:4px;padding:1px 5px}
.rv-q{padding:12px 14px;background:#1C1C30;color:rgba(255,255,255,.88);font-size:.87rem;line-height:1.75;white-space:pre-wrap}
.rv-q-label{font-size:.62rem;color:rgba(255,255,255,.35);font-weight:700;letter-spacing:.1em;display:block;margin-bottom:5px}
.rv-rec{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.play-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--pink);background:#fff;color:var(--pink);font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.play-btn.playing{background:var(--pink);color:#fff}
.rec-info{font-size:.78rem;color:var(--soft);flex:1}
.rec-dur{font-size:.7rem;color:var(--soft);white-space:nowrap}
.rv-ans{padding:12px 14px}
.rv-ans h4{font-size:.68rem;color:var(--pink-deep);font-weight:700;letter-spacing:.1em;margin-bottom:7px}
.rv-ans-text{font-size:.87rem;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.rv-foot{padding:16px;text-align:center;flex-shrink:0}
.retry-btn{padding:13px 44px;border-radius:var(--rad);border:none;background:var(--pink);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.08em}
</style>
</head>
<body>

<!-- ===== INTRO ===== -->
<div id="introSc" class="screen show">
  <div class="logo">
    労コン口述道場 Pro
    <small>本番模擬面接シミュレーター ─ 音声入出力・完全ローカル動作</small>
  </div>

  <div class="card">
    <h3>出題設定</h3>
    <div class="row"><label>カテゴリ数</label>
      <select id="catCount">
        <option value="3">3カテゴリ（6問）</option>
        <option value="4">4カテゴリ（8問）</option>
        <option value="5" selected>5カテゴリ（10問）</option>
        <option value="7">7カテゴリ（14問）</option>
      </select>
    </div>
    <div class="row"><label>1カテゴリあたり</label>
      <select id="qPerCat">
        <option value="1">1問</option>
        <option value="2" selected>2問</option>
        <option value="3">3問</option>
      </select>
    </div>
    <div class="row"><label>試験時間</label>
      <select id="examTime">
        <option value="600" selected>10分</option>
        <option value="900">15分</option>
        <option value="1200">20分</option>
      </select>
    </div>
    <div class="row"><label>追撃（他には？）</label>
      <select id="followupSec">
        <option value="0">しない</option>
        <option value="30">30秒未満の回答</option>
        <option value="50" selected>50秒未満の回答</option>
        <option value="999">常にする</option>
      </select>
    </div>

    <div style="margin-top:14px">
      <div style="font-size:.75rem;color:var(--soft);font-weight:700;margin-bottom:7px">カテゴリ固定（任意）</div>
      <div class="cat-grid" id="catGrid"></div>
      <div style="font-size:.65rem;color:var(--soft);margin-top:5px">未選択＝ランダム</div>
    </div>
  </div>

  <div class="err-box" id="errBox"></div>
  <button class="start" id="startBtn">🎤 面接を開始する</button>
  <div style="font-size:.65rem;color:var(--soft);margin-top:10px;text-align:center">
    Chrome推奨 ｜ 音声データは外部送信なし（ブラウザ内完結）
  </div>
</div>

<!-- ===== EXAM ===== -->
<div id="examSc" class="screen">
  <div class="ex-head">
    <div class="ex-prog" id="exProg">準備中</div>
    <div class="ex-timer" id="exTimer">10:00</div>
  </div>

  <div class="ex-body">
    <div class="q-label" id="qLabel"></div>

    <div class="rip-wrap st-idle" id="ripWrap">
      <div class="rip-ring a"></div>
      <div class="rip-ring b"></div>
      <div class="rip-ring c"></div>
      <div class="rip-core" id="ripCore">💭</div>
    </div>

    <div class="ex-stat" id="exStat">面接室へ入室します</div>

    <div class="sil-wrap" id="silWrap">
      <div class="sil-fill" id="silFill" style="width:0%"></div>
    </div>

    <div class="ex-hint" id="exHint">話し終えて3秒で自動的に次へ進みます</div>
  </div>

  <div class="ex-foot">
    <button class="end-btn" onclick="endExam(true)">試験を終了する</button>
  </div>
</div>

<!-- ===== REVIEW ===== -->
<div id="reviewSc" class="screen">
  <div class="rv-head">
    <h1>📋 試験終了 — 振り返り</h1>
    <p id="rvSummary"></p>
  </div>
  <div class="rv-list" id="rvList"></div>
  <div class="rv-foot">
    <button class="retry-btn" onclick="location.reload()">もう一度挑戦する</button>
  </div>
</div>

<script>
// ================================================================
// DATA

const DATA = [{"id":4,"cat":"導入質問","q":"導入質問","a":"産業保健の経験\n産業医先で改善に取り組んだこと\n産業医先・勤務先の有害業務\nこれまでに施行した職場改善\nこれまでに職場巡視で指摘したポイント\n衛生委員会で討議した内容\n復職支援で苦労した経験\n労働衛生コンサルタントの受験動機\n労コンの資格をとったらどうしたいか","d":"B"},{"id":5,"cat":"導入質問","q":"導入質問","a":"導入質問は15分間の試験時間の最初に聞かれます\n産業保健の経験を聞かれることが多いです\n合否には関係しないと言われていますが、必ず聞かれるので、試験開始時の口慣らしのためにも、事前に回答を作成してすらすら答えられるといいと思います\n産業医の経験が無くても合格している方はおられます","d":"B"},{"id":7,"cat":"基本知識","q":"労働衛生コンサルタントとは？","a":"労働衛生コンサルタントの名称を用いて、他人の求めに応じ報酬を得て、労働者の衛生の水準の向上を図るため、事業場の衛生についての診断及びこれに基づく指導を行なうことを業とする者\n」\n安衛法81条2項","d":"A"},{"id":9,"cat":"基本知識","q":"労コンと産業医の違いは？","a":"産業医は\n組織の一員\nとして、\n健康管理\nを中心に５管理を行い、\n定期的\nな訪問を\n行う。\n労働衛生コンサルタントは\n外部\nの専門家として\n独立\nした立場で\n5管理全般\nを幅広く、\n案件\nごとに\n指導改善\nを行う。","d":"A"},{"id":11,"cat":"基本知識","q":"労働安全衛生行政の実施体制は","a":"厚生労働省\n労働安全衛生法令の企画立案\n産業保健活動の推進\n都道府県労働局 \n(\n47か所\n)\n労働安全衛生法令に基づく指導計画\n産業保健制度の運用\n労働基準監督署\n (\n325か所\n)\n事業場への指導、周知\n（独）労働者健康安全機構\n産業保健活動の支援\n労働安全衛生分野の調査研究\n産業保健総合支援センタ－\n (\n47か所\n)\n産業保健研修や専門的な相談への対応\n地域産業保健センタ－\n (\n約350か所\n)\n50人未満の事業所の支援\n健診結果の医師意見聴取\n長時間労働者、高ストレス者への面談","d":"B"},{"id":13,"cat":"基本知識","q":"事業所の労働衛生管理体制は？","a":"事業所の労働安全衛生管理体制は？\n事業場において労働衛生管理を円滑かつ効果的に推進するための組織\n役割\n主な役割（超要約）\n総括安全衛生管理者\n安全衛生管理の“統括責任者”\n安全管理者\n安全管理（災害防止、作業方法、設備等）\n衛生管理者\n衛生管理（健康障害防止、作業環境/作業管理の実務）\n産業医\n医学的観点から助言、面談、職場巡視等\n衛生推進者\n小規模の衛生管理の推進役\n安全衛生推進者\n小規模の安全＋衛生の推進役\n安全衛生委員会\n安全衛生の重要事項を調査審議\n作業主任者（各種）\n現場で作業方法・指揮・安全確保","d":"B"},{"id":15,"cat":"基本知識","q":"産業保健総合支援センタ－とは？","a":"産業保健の支援のために全国の都道府県毎に設置\n専門スタッフによる相談対応、研修の実施、情報提供、啓発、調査研究などのサ－ビスを提供","d":"B"},{"id":17,"cat":"基本知識","q":"中小企業に対する国の支援策は？","a":"地域産業保健センター（全国に約350か所）\n地域産業保健センターは、労働基準監督署の管轄エリア単位で設置されている支援機関。主に従業員50人未満の事業場を対象に、産業医や保健師などが個別の産業保健支援を行う。支援内容には、保健指導、長時間労働者への面接指導、高ストレス者面接、メンタルヘルス相談などが含まれる。\n助成金\n団体経由産業保健活動推進助成金\n受動喫煙防止対策助成金\nエイジフレンドリー補助金\n団体経由産業保健活動推進助成金\n事業主団体が、加盟・傘下の中小企業に対して産業保健サービスを提供する際、その費用の一部を支援する仕組み。対象となり得る取り組みは、たとえば健診後の医師意見聴取や保健指導、ストレスチェック後の職場環境改善、健康教育に関する研修、産業保健の周知・啓発活動など。","d":"A"},{"id":19,"cat":"基本知識","q":"3管理、5管理とは？","a":"3管理：\n作業環境管理、作業管理、健康管理\n5管理：\n上記＋労働衛生教育、統括管理\n作業環境管理\n職場の作業環境にある有害要因を把握し、必要な対策で除去・低減して、働きやすい環境水準を保つ\n作業管理\n作業手順や作業方法、作業条件を見直して管理し、労働者が危険因子・有害因子にさらされる程度をできるだけ小さくする。\n健康管理\n健康診断などで従業員の健康状態を継続的に確認し、結果に応じて就業上の措置や保健指導につなげる。\n労働衛生教育\n雇入れ時教育、職長教育、特別教育などの機会を通じて、必要な知識・注意点を周知し、行動変容を促す\n統括\n管理\n労働衛生の管理体制を整え、目標や手順を含む管理計画を立てて、全体を継続的に運用する","d":"A"},{"id":21,"cat":"基本知識","q":"４S、５Sとは？","a":"4S：\n整理・整頓・清掃・清潔\n5S：4S＋しつけ → ルール化・習慣化して 安全×生産性 を高める\n5S\n整理：要・不要を分け、不要物は処分\n整頓：必要物を安全に、すぐ使える位置へ\n清掃：ごみ・汚れを除去する\n清潔：良い状態を維持する\nしつけ：4Sを決まりとして継続する","d":"A"},{"id":23,"cat":"基本知識","q":"安全衛生管理活動の4K","a":"・決意表明\n 「死亡災害ゼロ」を最優先目標として掲げ、必ず達成する姿勢を明確化する\n・高所作業対策\n 足場の点検徹底、墜落制止用器具（安全帯）の正しい選定・使用・管理を徹底する\n・管理の活性化\n 社長・管理者による職場巡視を強化し、緊張感と一体感を職場に浸透させる\n・教育の強化\n 災害事例を共有し、体験型の安全衛生教育（危険体感など）を計画的に実施する","d":"B"},{"id":25,"cat":"基本知識","q":"KY活動とは？","a":"危険予知活動\n（KYT）\n日常作業に潜む危険を事前に洗い出し、ヒューマンエラーを減らすための取り組み。\n※KYT＝危険予知トレーニング（ほぼ同義で使われる）\n・4ラウンド法\n　①\n現状把握\n：現場に潜む危険をブレストで洗い出す\n　②\n本質追及\n：挙がった危険を掘り下げ、起こり方・影響度などからリスク感をそろえる\n　③\n対策立案\n：未然防止の手段（設備・手順・教育・確認方法など）を検討する\n　④\n目標設定\n：職場としての実行方針・重点項目を決め、共有する\n・実践ポイント\n指差し呼称を取り入れると、確認の抜け・思い込みを減らしやすい\n（注意喚起と行動の同期）","d":"A"},{"id":28,"cat":"基本知識","q":"PDCAサイクルとは？","a":"PDCA（安全衛生活動の基本サイクル）\nPLAN（計画）\n：安全衛生の目標を決め、実行計画に落とし込む\nDO（実行）\n：計画に沿って対策・活動を進める\nCHECK（確認）\n：進捗や効果を点検し、評価する\nACT（改善）\n：結果を踏まえて改善し、必要に応じて計画（PLAN）を見直す\nポイント\n：PDCAを繰り返すことで、職場の安全衛生レベルを段階的に引き上げ（スパイラルアップ）していく。","d":"A"},{"id":30,"cat":"基本知識","q":"OSHMSとは？","a":"Occupational Safety and Health Management System＝労働安全衛生マネジメントシステム。\n「\n事業者が労働者の協力の下に「計画（Plan）実施（Do）評価（Check）改善（Act）」（「PDCAサイクル」）という一連の過程を定めて、継続的な安全衛生管理を自主的に進めることにより、労働災害の防止と労働者の健康増進、さらに進んで快適な職場環境を形成し、事業場の安全衛生水準の向上を図ることを目的とした安全衛生管理の仕組み\n」","d":"A"},{"id":32,"cat":"基本知識","q":"OSHMSの特徴は？","a":"・経営トップが安全衛生方針を明確に示すことで、事業運営と整合した形でOSHMSを動かしやすくなる\n・労働者の意見・提案をOSHMSに取り入れることで、個人任せではなく組織として活動を推進できる\n・PDCAサイクルに沿って運用し、計画→実行→点検→改善を繰り返す\n・ルールや手順を明文化し、記録として残すことで、安全衛生活動の実施漏れを防ぎ、蓄積したノウハウを引き継げる\n・リスクアセスメントを行い、その結果に基づく措置を講じることで、災害が起きてから対応するのではなく、事前に防ぐ管理が可能になる","d":"A"},{"id":34,"cat":"基本知識","q":"OSHMSの規格は？","a":"ISO45001：国際標準化機構（ISO）が2018年に発行した、OSHMSに関する国際規格。\nJISQ45100：ISO45001の要求事項を土台にしつつ、日本で重視されてきた要素（4S、KYT、ヒヤリハットなど）を追加した、OSHMSの日本版規格。\nJISQ45100の認証を取得すると、ISO45001の認証も取得できる位置づけ。","d":"A"},{"id":36,"cat":"基本知識","q":"法令遵守のみと比較してOSHMSのメリットは何ですか？","a":"各事業場が抱えるリスクや課題に応じて、適切な労働安全衛生対策を組み立てられる\n事業者主導で取り組みを進められるため、対策を体系立てて継続しやすい\nPDCAサイクルを回し続けることで、実施結果を振り返り、次の改善に反映できる","d":"A"},{"id":38,"cat":"基本知識","q":"OSHMSにはどのような効果がありますか","a":"OSHMSを導入している事業場では、未導入の事業場に比べて、労働災害の発生率が3割以上低いという結果が報告されています。","d":"A"},{"id":40,"cat":"基本知識","q":"OSHMSの実施方法について教えてください","a":"厚生労働省が示しているOSHMS指針に従います。\n1. 事業者が安全衛生方針を表明\n2. リスクアセスメントの実施、必要なリスク低減措置の決定\n3. 安全衛生方針に基づき、安全衛生目標を設定\n4. 安全衛生計画の策定\n5. 安全衛生計画の継続的な実施\n6. 安全衛生計画の実施状況等の日常的な点検および改善\n7. 定期的にOSHMSについて\nシステム\n監査や見直し、点検および改善\n8. 上記PDCAサイクルを継続的に実施する。","d":"A"},{"id":42,"cat":"基本知識","q":"OSHMS とリスクアセスメントの関係は","a":"リスクアセスメントは OHSMS における計画の立案に関わるところになります。\nOHSMS ではリスクアセスメントに基づいたリスクの評価や低減措置をもとに労働災害を何%減らすだとかの目標をたて、そのための年間計画を立て実施し、\n実施した内容を評価しそこから改善すべき点を計画に反映する PDCA サイクルを繰り返す必要があります。","d":"A"},{"id":44,"cat":"基本知識","q":"THPとは？","a":"Total Health Promotion（THP）\n厚労省が示す「事業所による労働者のこころと体の健康保持増進措置」の進め方をまとめた指針。考え方の軸は一次予防で、根拠として安衛法69条に位置づく。\n進め方\n事業者がTHPへの取組を明確にし、\n体制づくり → 課題把握 → 健康保持増進目標の設定 → 健康保持増進措置の決定 → 実施・評価\nという手順で進め、PDCAサイクルで改善を重ねていく。\n推進体制\n事業所内：産業医、衛生管理者、保健師、産業保健スタッフ、人事労務管理スタッフ など\n事業所外：産業保健総合支援センター など（外部資源の活用）\n令和5年度の改定ポイント\n・エイジフレンドリーガイドラインの考え方も踏まえ、フレイルやロコモティブシンドローム等を意識した健康づくりの視点\n・コラボヘルスの観点から、定期健診結果等のデータを医療保険者と連携して共有・比較し、取組の検討や改善に積極的に活用すること","d":"A"},{"id":46,"cat":"基本知識","q":"THPの具体的な取り組みは？","a":"① 労働者全体へのポピュレーションアプローチ\n職場全体を対象に、参加しやすい仕掛けで健康行動を後押しする。\nウォーキングキャンペーン、社内スポーツイベント、外部ジム利用補助\n栄養士勉強会、栄養バランス社食イベント\nリラクゼーションプログラム、メンタルヘルス講演会\n② ハイリスク群に対するハイリスクアプローチ\nリスクが高い層に焦点を当て、重点的に予防策を講じる。\n転倒リスク：身体機能セルフチェック、フレイルチェック\n脳・心臓疾患リスク：禁煙キャンペーン\n③ データヘルス／コラボヘルス\n健診結果のデータを健保などの外部機関に提供し、集団分析を行ったうえで、事業所の取組内容の検討・意思決定に活用する。","d":"A"},{"id":48,"cat":"基本知識","q":"THPの導入方法を教えてください","a":"①事業者の決意表明\n②体制の確立\n③課題の把握\n④健康保持増進目標の決定\n⑤健康保持増進措置の決定\n⑥実施/実施評価。\n健康保持増進措置\n運動指導、栄養指導、保健指導、メンタルヘルスケア、\n歯科指導\n、禁煙指導","d":"A"},{"id":50,"cat":"基本知識","q":"THPと特定健診との違いは？","a":"特定健診：対象は40‐74歳で、主に脳・心疾患のハイリスク群に焦点を当てたハイリスクアプローチ型の健康保持増進対策。\nTHP：対象はすべての労働者。無関心層をどう巻き込むかというポピュレーションアプローチの要素に加え、高年齢者のフレイル予防や禁煙の達成などのハイリスクアプローチも併せ持つ健康保持増進対策。","d":"B"},{"id":52,"cat":"基本知識","q":"エイジフレンドリ－ガイドラインの経緯","a":"令和6年度の状況として、労働者全体のうち\n19.1％\n、また休業4日以上の労災のうち\n30.0％\nが60歳以上を占める。\n高齢者では、感覚機能の低下や筋力低下などが起こりやすく、年齢特性を踏まえた安全衛生対策が欠かせない。この考え方を背景に、「\n高年齢労働者の安全と健康確保のためのガイドライン\n」（エイジフレンドリーガイドライン）が示された。\n災害の類型としては、「\n転倒・墜落\n」、および「\n転倒による骨折\n」が多い。","d":"A"},{"id":54,"cat":"基本知識","q":"エイジフレンドリ－の進め方 は","a":"事業者は、高齢者の労働災害防止に取り組む方針を明確にし、社内に示す。\n①安全衛生体制の確立 ②職場環境の改善 ③健康や体力の状況の把握 ④対応 ⑤安全衛生教育\nあわせて、労働者側も自己保健義務を意識し、自身の健康管理と安全行動に責任を持つ。\nエイジフレンドリー補助金：環境整備や健康保持増進の取組に必要な資金を支援する制度。\n申請先：日本労働安全衛生コンサルタント会","d":"A"},{"id":56,"cat":"基本知識","q":"エイジフレンドリ－の3管理の対策","a":"高年齢労働者の災害防止は、3管理で進めます。\n作業環境管理\nとして、通路を含む照度確保、段差解消と手すり設置、防滑床材の採用や防滑靴、油水分のこまめな清掃、危険箇所の標識で転倒リスクを下げます。 \n作業管理\nは、災害・ヒヤリハットを基にリスクアセスメントで優先順位を付け、重量物は小口化・回数減、負担の大きい作業は休憩・作業休止、暑熱は水分補給と始業時体調確認、情報機器作業は休止時間と無理のない業務量にします。\n健康管理\nとして、健診の確実実施と産業医等へ相談できる体制を整え、フレイルチェックや転倒リスクセルフチェック等で体力を把握し、体力に合った配置と維持向上支援を行います。\nl","d":"B"},{"id":58,"cat":"基本知識","q":"エイジフレンドリ－の具体策","a":"照度、中低音域の警報音、手すり、段差の解消、滑り止め、休憩場所、リフト・スライディングシ－トの導入\n転倒リスク評価セルフチェック、フレイルチェック、運動プログラム","d":"B"},{"id":60,"cat":"基本知識","q":"エイジフレンドリ－補助金","a":"対象：中小企業で、60歳以上を雇用している事業者\n労災防止対策：上限100万円\nコラボヘルス：上限30万円\n併用：合算しても上限は100万円","d":"C"},{"id":64,"cat":"基本知識","q":"高齢者の運動機能を評価する方法は","a":"転倒等リスク評価セルフチェック票","d":"C"},{"id":66,"cat":"基本知識","q":"エイジアクション100とは","a":"中災防が作成\n高年齢労働者の安全と健康確保のための100の取り組み（エイジアクション）を盛り込んだチェックリストを活用して職場の課題を洗い出し、改善に向けての取り組みを進めるための「職場改善ツール」","d":"C"},{"id":69,"cat":"リスクアセスメント","q":"ハザ－ド、リスクとは？","a":"ハザ－ド：危険性・有害性のこと\n「\n建設物、設備、原材料、ガス、蒸気、粉じん等による、または作業行動その他業務に起因する危険性又は有害性\n」\n例：\n爆発物、引火物、有害物質\nリスク　：危険性・有害性によって生じる被害の重篤度と発生　　　　　　する可能性の度合いを掛け合わせたもの。\n「\n危険性・有害性によって生ずるおそれのあるけがや疾病の重篤度と発生する可能性の度合い\n」","d":"A"},{"id":71,"cat":"リスクアセスメント","q":"リスクアセスメントの 目的 は？","a":"リスクの見積もりや低減対策に\nよ\nって\n、\n危険\n性、\n有害性\nによって起こりうる\n労働災害の未然防止\nに繋げること","d":"A"},{"id":73,"cat":"リスクアセスメント","q":"リスクアセスメントはどのように行いますか","a":"0. RA対象の選定\n）\n（\n0. 情報の入手\n）\n1. 危険性または有害性の特定\n2. リスクの見積もり\n3. \nリスク\n優先度\n　リスク低減措置の検討\n（本質,工学,管理,保護具の順）\n4. \nリスク低減措置の\n実施\n5. RA結果を労働者に周知\n労働衛生のしおりR7  p332-","d":"A"},{"id":75,"cat":"リスクアセスメント","q":"危険性または有害性の特定の方法は","a":"RAの対象となる業務を洗い出した上で\n①SDSに記載されているGHS分類に基づいて特定\n②管理濃度、濃度基準値。なければ許容濃度またはTLV-TWA\n③皮膚等障害化学物質","d":"A"},{"id":77,"cat":"リスクアセスメント","q":"リスクの見積もりの方法は？","a":"①　危険性、有害性の「発生可能性」×「重篤度」\n②　有害性の「ばく露濃度」×「有害性」\n③　上記に準ずる方法\n（特別則など）","d":"A"},{"id":79,"cat":"リスクアセスメント","q":"リスクの見積もりの方法は？","a":"①　危険性、有害性の「発生可能性」×「重篤度」\n具体的には\nマトリクス法、数値化法、枝分かれ図法、コントロールバンディング","d":"A"},{"id":80,"cat":"リスクアセスメント","q":"リスクの見積もりの方法は？","a":"実測値：実際の作業環境測定の値とばく露限界\n（許容濃度など）\nを比較\n推定法：数理モデルで気中濃度を推定しばく露限界と比較\n（クリエイトシンプル）","d":"A"},{"id":81,"cat":"リスクアセスメント","q":"リスク低減措置の手順は？","a":"対策は、次の優先順位で順に検討する。\n本質的対策（危険物質使用の中止）\n工学的対策（密閉、自動化、換気）\n管理的対策（マニュアル整備）\n個人用保護具の使用","d":"A"},{"id":83,"cat":"リスクアセスメント","q":"リスクアセスメント結果の周知はどのような方法で実施するのか","a":"次のいずれかの方法で労働者が常時確認できるように周知する必要があります。\n1. RA対象物質を取り扱う作業場の見やすい場所に掲示する\n2. 労働者に書面を交付する\n3. 電子媒体に記録、かつ作業場に常時可能なパソコンなどを設置する。","d":"A"},{"id":85,"cat":"リスクアセスメント","q":"RAを実施する際に、SDSに記載されたどの情報を活用すればよいか 厚労省","a":"主に以下の5項目\n・2 危険有害性の要約\n・8. 曝露防止および保護措置\n・9. 物理的および化学的性質\n・10. 安定性および反応性\n・11. 有害性情報","d":"A"},{"id":87,"cat":"リスクアセスメント","q":"リスクアセスメントを行わなければいけないときはどんな時ですか","a":"建設物を設置、移転、変更、または解体するとき\n設備、原料、作業方法、作業手順を新規に採用、または変更するとき\nリスクに変化が生じ、または生ずる恐れがあるとき\n以下は努力義務。\n・労災が発生した場合で、過去のRAに問題がある場合\n・機械設備の経年劣化\n・労働者の入れ替わりによる労働者の知識経験の変化\n・新たな安全衛生に関する知見の集積があったとき。","d":"A"},{"id":89,"cat":"リスクアセスメント","q":"SDS情報の改訂とは","a":"SDS対象物質を譲渡・提供するものはSDS項目のうち、「人体に及ぼす作用」について5年以内ごとの定期的な確認や、確認の結果変更がある場合には1年以内の更新が義務付けられています。\n譲渡・提供先は危険有害性の変化を把握した際に新たなSDSに基づき、リスクアセスメントを実施する必要があります。","d":"B"},{"id":91,"cat":"リスクアセスメント","q":"RA を行う事を渋る業者にコンサルタントとしてどのような声掛けを する か","a":"リスクアセスメントは、労働安全衛生法上「努力義務」と位置づけられている。\nさらに、使用者の安全配慮義務という観点からも、職場のリスクを把握し対策につなげる手段として重要である。","d":"C"},{"id":93,"cat":"リスクアセスメント","q":"リスクアセスメント対象物とは","a":"一言でいうと、\n通知対象物\n（\nSDS交付義務対象物質\n）\n別の言い方では、「\n国のGHS分類により危険性・有害性が確認された全ての物質\n」\nリスクアセスメント対象物とは、ラベル表示、SDS交付が義務である物質のことです。\n厚生労働省から、\n表示対象物\n（ラベル表示義務対象物質）と通知対象物（SDS交付義務対象物質）のリストが公表されています。\n表示対象物と通知対象物は共通で、これらに該当する物質がリスクアセスメント対象物にも該当します。\nただし、表示対象物と通知対象物は裾切値が異なります。\nhttps://cheminfo.johas.go.jp/step/1-3.html","d":"A"},{"id":95,"cat":"リスクアセスメント","q":"RA対象物 かの確認方法","a":"SDSの「\n15.適用法令\n」に「労働安全衛生法 第57条の適用あり」、「労働安全衛生法 表示（または通知）対象物」などの記載があるもの\nケミサポやナイトクリップ\nに掲載されている表示・通知対象物のリスト等で確認することもできます。","d":"A"},{"id":97,"cat":"リスクアセスメント","q":"RA対象物 は何個ある","a":"R7.4で\n1600個\nR8.4で約2300予定\n濃度基準値設定は\n179物質\nhttps://cheminfo.johas.go.jp/step/1-3.html","d":"A"},{"id":99,"cat":"リスクアセスメント","q":"リスクアセスメント健診とは","a":"①リスクアセスメント対象物を\n製造/取扱\n業務に\n常時\n従事する労働者に対して\nRAの結果、\n健康障害発生リスクが許容される範囲を超える\nと判断された場合に、関係労働者の意見を聞き、必要があると認めるとき\n②濃度基準値の設定のあるRA対象物を製造/取扱業務に従事する労働者が、\n濃度基準値以上\nの曝露のおそれがあったとき、\n速やかに\n内容に関しては産業医や健診機関の医師と相談の上、決定。","d":"A"},{"id":101,"cat":"リスクアセスメント","q":"リスクアセスメント健診 の実施頻度","a":"○ 第３項健診の実施頻度は、産業医又は医師等の意見を踏まえ、最終的に事業者が決定する。\n＜実施頻度の設定例＞\n※下記は、有害性の区分ごとに健康障害リスクが許容される範囲を超えると判断された場合の目安\n① 皮膚腐食性／刺激性、眼に対する重篤な損傷性／眼刺激性、呼吸器感作性、皮膚感作性、特定標的臓器毒性（単回ばく露）による急性の健康障害：６月以内ごとに１回\n② がん原性物質又はＧＨＳ分類の発がん性の区分が区分１：１年以内ごとに１回\n③ 上記①、②以外の健康障害（歯科領域の健康障害を含む。）：３年以内ごとに１回","d":"B"},{"id":105,"cat":"リスクアセスメント","q":"RA 健診 と特殊健診の違い","a":"https://www.zeneiren.or.jp/cgi-bin/pdfdata/20240306_3.pdf\n各特別規則 or 安衛則\n対象化学物質　個別 or RA対象物\n対象者　作業列挙方式 or 3項,4項\n実施頻度　6ヶ月 or 6ヶ月〜3年\n項目　規則 or 医師の判断\n事後措置　作業環境管理 or リスク低減対策","d":"B"},{"id":108,"cat":"労働災害","q":"労働災害とは何ですか","a":"労働者の就業に係る建設物、設備、原料、ガス、蒸気、粉塵等により、または作業行動、その他業務に起因して\n、\n労働者が負傷し、疾病にかかり、または死亡すること\n」\n労働安全衛生法第2条","d":"A"},{"id":110,"cat":"労働災害","q":"労働災害の 種類 は？","a":"区分は \n①業務災害 ②複数業務要因災害 ③通勤災害\n の3つ。\n①業務災害／②複数業務要因災害の要件\n業務遂行性\n：「労働契約に基づき、労働者が使用者の支配下にある」こと\n業務起因性\n：「業務と災害とに因果関係がある」こと\n③通勤災害の範囲・要件\n住居と就業場所の移動中、単身赴任先と帰省先の移動中、就業場所間の移動中に該当し、かつ合理的な経路と方法であること","d":"A"},{"id":112,"cat":"労働災害","q":"労働災害の推移は？","a":"死亡者数は長期的に減少している一方で、業務上疾病や精神疾患関連の認定件数は増加傾向にある。\n労災による死亡者数は、昭和36年（6,712名）をピークとして、その後は長期的に減少してきた。\n直近では、令和6年（1～12月）の労働災害（新型コロナ罹患を除く）による死亡者数は746人で、過去最少となっている。\n一方、死傷者数（休業4日以上）は、いったん2009年を底に増加傾向となり、令和6年は135,718人（前年差347人増）と増加が続いている。\n背景要因としては、労働者の高齢化や、介護・福祉などサービス業の就業者増といった産業構造の変化が関与すると考えられる。","d":"A"},{"id":114,"cat":"労働災害","q":"労災事故で企業が負う責任とは？","a":"刑事上の責任：労働安全衛生法違反や業務上過失致死傷罪\n民事上の責任：安全配慮義務違反による損害賠償責任\n行政上の責任：作業停止\n、許可取消\nなどの行政処分\n社会的な責任：企業の信用失墜など","d":"A"},{"id":116,"cat":"労働災害","q":"業務上疾病とは？","a":"業務上疾病とは、\n業務と発症の間に相当因果関係が認められる疾病\nを指し、労災保険給付の対象となる。\n相当因果関係の判断は、原則として次の3要件を満たすかどうかで整理される。\n① 労働の場に有害因子が存在していること\n② 健康障害を生じ得る程度に有害因子へ曝露していたこと\n③ 発症までの経過や病態が医学的に妥当であること","d":"A"},{"id":118,"cat":"労働災害","q":"業務上疾病の発生状況は？","a":"総計：10,963名（コロナは含まず）\nカテゴリ別の内訳（主なもの）\nカテゴリ別最多：負傷に起因する疾病（7,596名、うち\n災害性腰痛\nが6,291名）\n物理的因子による疾病：異常温度の内の\n熱中症\n（1,257名）、潜水病、熱傷\n作業態様に起因する疾病：振動作業のレイノー\n化学物質等による疾病：酸欠\nがん原性物質による疾病：ベンゼン白血病、ベンジジン膀胱癌\n長時間労働に起因する疾病：脳・心臓疾患、精神障害\nその他：じん肺、病原体による疾病、など","d":"A"},{"id":120,"cat":"労働災害","q":"業務上疾病の","a":"発生状況\nは？\n業務上疾病の認定件数（休業4日以上）は、新型コロナウイルス感染症を除いても増加傾向にある。令和6年度は10,963人で、その内訳は\n腰痛が約6割、熱中症が約1割\nを占める。\n精神障害の認定は1,055件で過去最多となり、要因別ではパワハラが224件と最も多い。\nまた、過重労働に関連する脳・心臓疾患の認定は241件で、令和3年の172件を底に増加基調に転じている。\n業種別にみると、精神障害は医療・福祉業で、脳・心臓疾患は運輸業で、請求件数・認定件数が相対的に多い傾向がみられる。","d":"A"},{"id":121,"cat":"労働災害","q":"負傷と負傷による疾病の違いは？","a":"負傷：外力の作用によって直接生じた障害。例として、骨折、捻挫、打撲など。\n負傷による疾病：負傷との間に相当因果関係が認められる疾病。業務上の負傷をきっかけに一次的に発生した疾病や、そこから続発した疾病を含む。","d":"B"},{"id":123,"cat":"労働災害","q":"負傷による疾病の具体例は？","a":"災害性腰痛\n頭部外傷後の慢性硬膜下血腫、外傷性てんかん\n脊髄損傷による褥瘡\n皮膚負傷後の破傷風、蜂窩織炎","d":"B"},{"id":125,"cat":"労働災害","q":"労災保険とは？その対象者は？","a":"労災保険：「業務上の事由又は通勤による労働者の負傷・疾病・障害又は死亡」に対して、労働者本人または遺族に必要な保険給付を行う制度。\n対象：雇用形態にかかわらず、労働者を1人でも雇用している企業は加入し、保険料は事業主が全額負担する。国籍や年齢による区別はなく、アルバイト、日雇い労働者も含めて給付の対象となる。不法滞在者であっても、労働者として使用されていれば給付対象となり得る。","d":"B"},{"id":127,"cat":"労働災害","q":"不法滞在の外国人労働者が労災を起こした場合、労災保険は適応されますか？","a":"在留資格の有無にかかわらず、「労働者」として雇用され就労していれば、労災保険は適用対象となる。国籍による区別はなく、原則として国籍不問で適用される（厚労省資料の整理に沿う）。\nまた、事業主が加入手続きをしていないなど未加入の状態であっても、要件を満たす災害であれば、労基署を通じて保険給付を請求できる。","d":"B"},{"id":130,"cat":"作業環境測定","q":"作業環境測定とは？","a":"作業環境測定：「\n作業環境にどの程度の有害性があるかを把握し、その結果を踏まえて換気設備などの改善措置につなげるために行う測定\n」\n測定方法には大きく2つ\n・作業場所の定点で試料採取する\n A・B測定\n・作業者にサンプラーを装着して試料採取する \nC・D測定\n（＝個人サンプリング法による環境測定）\n実施は、作業環境測定士または作業環境測定機関が行う。なお、個人サンプリング法を実施できるのは、個人サンプリング法について登録されている作業環境測定士・作業環境測定機関に限られる。","d":"A"},{"id":132,"cat":"作業環境測定","q":"作業環境測定の手順は？","a":"デザイン\n：測定対象を整理し、実施日程と、測定する単位作業場所を設定する。\nサンプリング\n：作業環境中の有害物質について、必要な方法で試料を採取する。\n分析\n：採取した試料に適した分析手法で測定し、結果を評価する。\n管理区分決定\n：分析結果を踏まえて、管理区分を判定・決定する。","d":"A"},{"id":134,"cat":"作業環境測定","q":"作業環境測定の具体的な方法は？","a":"A測定→第1, 2評価値\nB測定→B測定値\n管理濃度と比較して管理区分を決定","d":"A"},{"id":136,"cat":"作業環境測定","q":"単位作業場所とは何ですか","a":"労働者の作業中の行動範囲、有害物の分布等の状況等に基づき定められる\n、\n作業環境測定のために必要な区域\n」","d":"B"},{"id":138,"cat":"作業環境測定","q":"作業環境測定が必要な場所は？","a":"特定粉じん作業\n6月以内ごと\n７年\n粉じん則\n第26条\n特定化学物質（第１類・第２類）\n６月以内ごと\n３年（発がん性物質30年）\n特化則\n第36条\n有機溶剤（第１種・第２種）\n６月以内ごと\n３年\n有機則\n第28条\n鉛\n１年以内ごと\n３年\n鉛則\n第52条\n石綿\n６月以内ごと\n40年\n石綿則\n第36条\n酸素濃度（酸素欠乏危険場所）\n作業開始前\n３年\n酸欠則\n第３条\n放射性物質　　　　\n１月以内ごと\n５年\n電離則\n第54条\n等価騒音レベル（著しい騒音を発する作業場)\n６月以内ごと\n３年\n安衛則\n第590条\n坑内の通気量、気温\n半月以内ごと\n３年\n安衛則\n第603条\n坑内の炭酸ガス濃度\n１月以内ごと\n３年\n安衛則\n第592条\n気温、湿度及びふく射熱(暑熱・寒冷)\n半月以内ごと\n３年\n安衛則\n第607条\nダイオキシン類の濃度（焼却施設関連）\n６月以内ごと\n３年\n安衛則\n第592条\nCO、CO2、室温、外気温、相対湿度を測定\n(中央管理方式の空気調和設備を設けている事務所)\n２月以内ごと\n３年\n事務所則\n第７条","d":"B"},{"id":140,"cat":"作業環境測定","q":"A・B測定とは？","a":"作業場所の定点で試料採取して、作業環境中の濃度を把握する測定。\nA測定\n：空気中濃度の平均的な分布を把握する。6m以下の等間隔の平行線を引き、その交点のうち5か所以上で測定する。得られた測定値から、上位5％に当たる濃度を第1評価値、算術平均濃度を第2評価値として扱う。\nB測定\n：最高濃度の把握を目的とする。発生源に近い位置で、作業者の曝露が最大になり得る箇所を選んで測定する。\nA・Bはいずれも、10分間以上、高さ50～150㎝の位置で測定する。\nまた、測定は作業が定常的に行われている時間帯に実施する。","d":"A"},{"id":142,"cat":"作業環境測定","q":"第1、第2評価値とは何ですか","a":"第1評価値(EA1)\n　有害物質濃度の\n上位5%\n第2評価値(EA2)\n　有害物質濃度の平均値＝\n算術的平均値","d":"A"},{"id":144,"cat":"作業環境測定","q":"A・B測定の管理区分は？","a":"管理区分は、A測定・B測定の結果を管理濃度と比較して次のように整理できる。\n第1管理区分：A測定の第1評価値とB測定の結果が、いずれも管理濃度より低い\n第3管理区分：A測定の第2評価値（平均値）が管理濃度より高い、または B測定が管理濃度×1.5より高い\n第2管理区分：上記以外","d":"A"},{"id":146,"cat":"作業環境測定","q":"C測定・D測定とは","a":"個人サンプリング法による作業環境測定は、作業者にサンプラーを装着して試料を採取し、実際の曝露状況に近い形で評価する方法。\nこの方法が特に有効なのは、\n① 特定化学物質のうち、少量でも有害性が高く管理濃度が低い物質を扱う場合\n② 発散源や作業者が移動するなど、定点測定だけでは実態を捉えにくい作業の場合\n対象：\n鉛、低管理濃度特定化学物質\n（ベリリウム、インジウムなどを含む25物質\n）、粉じん、有機溶剤","d":"A"},{"id":148,"cat":"作業環境測定","q":"C測定・D測定とは","a":"C測定\n：複数の作業者に測定機器を装着し、5人以上を対象に、作業時間全体を通して測定する。\nD測定\n：特に曝露量が多いと見込まれる作業場面を選び、連続15分間の測定を行う。\n※注意：これは\n個人ばく露測定ではない\n。あくまで作業環境の測定であり、個人の曝露状況を特定して介入すること自体を目的とするものではない。","d":"A"},{"id":149,"cat":"作業環境測定","q":"C測定・D測定の管理区分は？","a":"第1管理区分\n・C測定の第1評価値と、D測定の両方が管理濃度未満である。\n第3管理区分\n・C測定の第2評価値が管理濃度を上回る、または\n・D測定が管理濃度×1.5を上回る。\n第2管理区分\n・上記の第1管理区分、第3管理区分のいずれにも当てはまらない場合。","d":"A"},{"id":151,"cat":"作業環境測定","q":"管理区分ごとの対策は？","a":"第1管理区分：ほとんどすべての場所で、空気中の有害物質濃度が管理濃度を上回らない状態。\n　→ 現状を崩さないよう維持管理を行う。\n第2管理区分：空気中の有害物質濃度の平均が管理濃度を超えない状態。\n　→ 設備や作業方法を点検し、その結果に応じて必要な措置を講じるよう努める。あわせて、結果を労働者へ周知する。\n第3管理区分：空気中の有害物質濃度が管理濃度を超える状態。\n　→ 直ちに点検し、結果に基づく措置を実施する。さらに、有効な保護具の着用を徹底し、必要に応じて健診なども行う。\n　→ 速やかに第1管理区分へ移行できるように取り組む。","d":"A"},{"id":153,"cat":"作業環境測定","q":"第3管理区分時の対処は？","a":"外部の作業環境管理の専門家に意見を求め、作業環境の改善策を講じたうえで、あらためて評価する\n再評価でも第3区分となる場合は、個人サンプリング法を実施し、適切な呼吸用保護具を選定する\n講じた措置は労働基準監督署へ届け出る\n作業環境測定は、6か月以内ごとに実施する\nフィットテストは、1年以内ごとに実施する\n測定結果・評価結果・装着確認結果は、3年間（粉じんは7年間）保存する","d":"A"},{"id":155,"cat":"作業環境測定","q":"作業環境管理の専門家が改善困難と評価した場合と改善可能と評価され、その改善措置を実施した後でもまだ第3管理区分となった場合に生じる義務は？","a":"個人サンプリング測定等により化学物質濃度を把握し、その結果に応じて、有効な呼吸用保護具を使用させる必要がある\n保護具が適切に着用されているかを確認する\n保護具着用責任者を選任し、保護具装着に関する管理を行う\n作業環境管理専門家の意見の概要、実施した措置、評価結果を労働者へ通知する\nこれらの措置内容は、遅滞なく労基署へ届出する","d":"A"},{"id":156,"cat":"作業環境測定","q":"評価結果が改善するまで行わなければならないことは？","a":"6ヶ月以内ごとに1回、個人サンプリング測定等によって化学物質の濃度を定期的に測定し、結果に応じて有効な呼吸用保護具を使用させる。\n1年以内ごとに1回、呼吸用保護具が適切に装着されているかを定期的に確認する。","d":"A"},{"id":158,"cat":"作業環境測定","q":"第3管理区分を改善しない場合の処罰はどのようなものがありますか ","a":"意見聴取や改善措置などを講じたとしても、労基署への届出を行わなかったときに罰則が適用される","d":"B"},{"id":160,"cat":"作業環境測定","q":"許容濃度の定義は","a":"許容濃度とは、\n労働者が1 日8 時間、1 週間40 時間程度、肉体的に激しくない労働強度で有害物質に暴露される場合に、当該有害物質の平均暴露濃度がこの数値以下であれば、ほとんどすべての労働者に健康上の悪い影響が見られないと判断される濃度","d":"A"},{"id":162,"cat":"作業環境測定","q":"許容濃度、TLV、管理濃度、抑制濃度の違いは？","a":"許容濃度\n：日本産業衛生学会が示す勧告値。多くの労働者がその濃度に毎日反復して曝露されても、一般に健康影響が生じないと考えられる水準。\nTLV\n：Threshold Limit Value（＝曝露限界値）の略。米国産業衛生専門家会議（ACGIH）による勧告値で、考え方は許容濃度と同様に「多くの労働者が日常的に曝露しても健康影響が起こりにくい」とされる水準。区分は、時間加重平均値（TWA）（≒許容濃度）、短時間曝露限界、最高濃度の3カテゴリ。\n管理濃度\n：厚労省が設定する指標で、作業環境の管理区分を判定する際の基準として用いる。設定にあたっては、許容濃度やTLV等を参照して値が決められる。\n抑制濃度\n：発散源付近の濃度がこの値以下であれば、局排が有効に機能していると判断するための目安。局排の点検・改善の要否を判断する指標で、物質ごとに告示されている。","d":"A"},{"id":165,"cat":"作業環境測定","q":"許容濃度と管理濃度の違いは何ですか？","a":"許容濃度は\n個人\nの曝露濃度管理を目的にした指標で、\n管理濃度は\n作業環境\nの化学物質濃度管理を目標とした指標。","d":"A"},{"id":167,"cat":"作業環境測定","q":"許容濃度 の定義は？　4つの観点から","a":"許容濃度は、下記の時間、下記の労働強度の下で、下記の濃度でばく露したとしても、下記の影響しか現れないと判断される最大の濃度であると定義されている。\n時間：１日８時間、週間 40 時間程度\n労働強度：肉体的に激しくない労働強度\nばく露濃度：呼吸保護具を装着していない状態で、労働者が作業中に吸入するであろう空気中の当該物質の濃度\n健康影響のリスク：ほとんどすべての労働者に健康上の悪い影響が見られない","d":"A"},{"id":169,"cat":"作業環境測定","q":"管理濃度のない、低い物質は？","a":"少量でも毒性が強い物質を含むカテゴリー。\n管理濃度なし\nジクロルベンジジン、オーラミン、αナフチルアミン、マゼンタ など\n低管理濃度特定化学物質\nベリリウム、インジウム、MOCA、カドミウム、コバルト、重クロム酸、オルト－フタロジニトリル、水銀、ヒ素 など","d":"B"},{"id":171,"cat":"作業環境測定","q":"濃度基準値とは？","a":"濃度基準値：厚生労働省が設定する基準値。リスクアセスメント対象物のうち67物質に定められており、令和7年10月1日から112物質が追加されて計179物質となる。屋内作業場では、労働者の曝露を濃度基準値以下に抑える義務がある。\n物質ごとに、8時間濃度基準値と、短時間濃度基準値（15分間時間加重平均値）または天井値（いかなる短時間）、あるいはその両方が設定される。CREATE-SIMPLE等でリスク判定を行い、8時間濃度基準値の1/2を超えると見込まれる場合は、確認測定を実施する。","d":"A"},{"id":173,"cat":"作業環境測定","q":"確認測定とは","a":"実施の目安：リスク判定の結果、濃度基準値の1/2を超えると見込まれる場合に実施する。\n測定方法：最も高い曝露が想定される労働者の呼吸域に、当該物質を捕集するためのサンプラーを装着し、個人曝露測定を行う。作業が短時間の場合は、結果を8時間の加重平均値に換算して比較する。\n結果に基づく対応：呼吸域の濃度が濃度基準値を超える場合は、リスク低減措置を講じたうえで再度、確認測定を行う。\nそれでも超過が解消しない場合は、暫定的に十分な防護係数を有する保護具を着用させつつ、工学的対策・管理的対策を進め、少なくとも6か月に1回の頻度で確認測定を継続する。","d":"A"},{"id":175,"cat":"作業環境測定","q":"生物学的モニタリングとは？","a":"生物学的モニタリング：血液・尿・毛髪などの生体試料を検査し、特定物質への曝露量を推定する方法。得られた値を生物学的許容値やBEIと照らして評価する。\n生物学的許容値：日本産業衛生学会が示す、生物学的モニタリングに関する勧告値。概ね、この値以下であれば多くの労働者で健康影響が生じないと考えられる。\n例：血清鉛 40㎍/100ml、尿中トルエン 0.06㎍/l。\nBEI（Biological Exposure Index）：アメリカ合衆国産業衛生専門家会議（ACGIH）による勧告値。この値以下であれば、環境中の濃度がおおむねTLV-TWA以下であるとみなせる目安。\n例：血清鉛 30㎍/100ml、尿中トルエン 0.03㎍/l。","d":"A"},{"id":177,"cat":"作業環境測定","q":"生物学的モニタリングの注意点","a":"体格などによる個人差\n水分摂取状況\n採尿タイミングの影響（半減期の短いもの、特に有機溶剤で重要）\n趣味の塗装による有機溶剤曝露\n清涼飲料水・栄養ドリンクに含まれる安息香酸Na\n　→ トルエンの代謝物である尿中馬尿酸が上昇し得る\n飲酒によるエチルアルコール曝露（有機溶剤）","d":"A"},{"id":179,"cat":"作業環境測定","q":"許容濃度と生物学的モニタリング値の違いについて","a":"許容濃度は、環境中でどの程度曝露されているかをみる指標で、いわば体外曝露（曝露量）の目安。\n生物学的モニタリング値は、曝露後に体内での代謝・蓄積などを経た結果として、体内負荷（影響量）を推定する指標。","d":"A"},{"id":183,"cat":"作業環境測定","q":"個人ばく露測定 を行うもの","a":"https://www.mhlw.go.jp/content/11305000/001213437.pdf\nずい道建設工事などで「切羽に近接する場所」の粉じん濃度等の測定（切羽近接粉じん）\n溶接ヒューム\n第三管理区分\nRA関連","d":"B"},{"id":185,"cat":"作業環境測定","q":"作業環境測定で気中は低いが、生物学的モニタリングでは高かった　なぜか　","a":"① 作業者が化学物質Cに直接触れており、経皮ばく露が生じていた可能性がある。\n② 化学物質Cとは別の要因で、生物学的モニタリングの指標物質が上昇していた可能性がある。\n③ 作業者が職場外（模型作りなどの趣味）でも化学物質Cに接触し、業務外ばく露が加わっていた可能性がある。\n④ 遺伝的要素や体格（脂肪量）などの個人差により、特に指標物質が上がりやすい作業者が含まれていた可能性がある。","d":"A"},{"id":187,"cat":"作業環境測定","q":"作業主任と は","a":"一定の危険有害な作業について選任が義務づけられている、作業の管理監督を行う者（安衛法第14条）。\n選任が必要な作業は、石綿作業、有機溶剤作業、酸素欠乏危険作業など31種類で（安衛法施行令第6条）、これらの作業については業種や事業場の規模を問わず選任が必要である。\n主な業務は、危険作業の指揮、有害設備の管理など。\n所轄労働基準監督署長への選任報告義務はないが、選任義務があるにもかかわらず選任しなかった場合や規定の業務を行わせなかった場合には罰則が科せられる。","d":"C"},{"id":189,"cat":"作業環境測定","q":"作業主任","a":"者の職種\n31種類（安衛法施行令第6条）　\n例えば・・・\n特化物\n有機溶剤\n鉛\n石綿\n酸欠\n高圧室内\nX線撮影","d":"C"},{"id":190,"cat":"作業環境測定","q":"特別教育 とは","a":"労働安全衛生法第５９条第３項では、事業者は、厚生労働省令で定める危険又は有害な業務に労働者をつかせるときは、その業務に関する安全又は衛生のための特別の教育を行わなければならないこととされています。\n特別教育を必要とする業務は、アーク溶接や小型車両系建設機械の運転など４９の業務で、労働安全衛生規則第３６条に規定されています。","d":"C"},{"id":193,"cat":"換気装置・保護具","q":"3つの換気方法は？","a":"換気方法\nメリット\nデメリット\n局所排気\n周囲を汚染する危険が少ない\n排気の処理が可能\n設備コスト、運用コストが大きい\n設備が大掛かりで場所をとる\n作業性を損なう可能性がある\nプッシュプル換気\n周囲を汚染する危険が少ない\n排気の処理が可能\n作業性を損ないにくい\n設備コスト、運用コストが高い\n設備が大掛かりで場所をとる\n全体換気\n設備コスト、運用コストが小さい\n設備が簡単で場所を取らない\n作業性を損なわない\n周囲を汚染する危険がある\n排気の処理ができない","d":"A"},{"id":195,"cat":"換気装置・保護具","q":"全体排気装置と局所排気装置の違い","a":"全体換気装置：作業場全体の空気を入れ替えて、有害物質を希釈・排出する方式。\n局所排気装置：有害物質が発生するポイントに設置し、発生源近くで吸引して拡散を抑える方式。\n比較・選定の際は、主に \nコスト／排気処理／作業性\n の3つの観点で検討する。","d":"A"},{"id":196,"cat":"換気装置・保護具","q":"局所換気装置の構造は？","a":"フードで吸引した空気をダクトで屋外へ導き、集塵装置でろ過したうえで、排気ダクトを通して排気口から外部へ排出する。","d":"A"},{"id":198,"cat":"換気装置・保護具","q":"局所 排 気装置の種類と特徴は？","a":"フードの種類には、囲い式フードと外付け式フードがある。\n囲い式フード\n：フード内で発生した有害物質が、開口部から外側へ漏れにくい点が特徴。\n外付け式フード\n：発生源の近くに設置して吸引するタイプで、距離が離れて一定範囲を超えると吸引力が急激に落ちるのが特徴。\nまた、特化物の集塵装置は対象物に応じて選定する。\nヒューム（粒径5μm未満）：濾過除塵 または 電気除塵\nそれ以外：サイクロン、スクラバでも可","d":"A"},{"id":200,"cat":"換気装置・保護具","q":"制御風速とは？","a":"労働安全衛生法に定められた吸引風速の最低値\n囲い式：開口面\n外付け式：飛散限界。\n有機溶剤(m/s)\n粉塵(m/s)\n囲い式\n0.4\n0.7\n外付け式(側方)\n0.5\n1\n外付け式(下方)\n0.5\n1\n外付け式(上方)\n1\n1.2","d":"A"},{"id":202,"cat":"換気装置・保護具","q":"抑制濃度とは？","a":"抑制濃度は、局所排気装置の性能を判定するために、有害物（特化物、石綿、鉛）ごとに定められた濃度。作業者とフードの間に設定された測定位置で濃度を測り、換気装置には抑制濃度以下に抑えられる排風量が求められる。\n測定は、フード開口面から0.5～1m離れた場所で、1日1回以上、作業が定常的に行われている時間帯に、10分以上連続して行う。\n数値としては、管理濃度（≒日本産業衛生学会の許容濃度 or ACGIHのTLV）と同じになることが多い。","d":"A"},{"id":204,"cat":"換気装置・保護具","q":"プッシュプル型換気装置の特徴は？","a":"室内全体に、プッシュフード → プルフードへ向かう一方向の捕捉気流をつくり、有害物質をプルフード側で回収する方式。部屋全体を密閉する密閉式と、完全密閉ではない開放式がある。\nメリット：作業の妨げになりにくい。局所排気装置より低風速で運用でき、移動を伴う作業にも対応しやすい。\nデメリット：導入・運用コストが高い。","d":"A"},{"id":206,"cat":"換気装置・保護具","q":"除じん装置","a":"局所排気装置、プッシュプル型換気装置には粉じんの粒径に応じて除じん装置を設けなければならない。\n粉じんの種類\n除じん装置\n粒径(㎛)\nヒュ－ム\nろ過\n>5\n電気\n>0.1\nヒュ－ム以外\n遠心力(サイクロン)\n>2.5\n洗浄(スクラバ)\n>1\nろ過\n>1\n電気\n>0.1","d":"B"},{"id":208,"cat":"換気装置・保護具","q":"制御風速以下での局排の使用は法令違反か","a":"局排を制御風速未満で運転している状態が続く場合、法令違反となる。\n安衛法で設置が義務づけられている局排については、各特別則で制御風速が定められており、装置はその基準である制御風速以上で稼働させることが求めら\nれ\nる。","d":"C"},{"id":210,"cat":"換気装置・保護具","q":"個人用防護具とは？ どんなのがありますか？","a":"個人の曝露濃度を許容濃度以下に抑えるための防護具（PPE）は、目的に応じて次のように整理できる。\n呼吸用防護具\n不浸透性の防護具（保護衣、保護手袋、履物、保護眼鏡）","d":"A"},{"id":212,"cat":"換気装置・保護具","q":"マスクの種類は？","a":"作業場の酸素濃度に応じて吸気式と\nろ\n過式のマスクがある\n防塵/防毒マスクはいずれも\nろ\n過式。\n酸素濃度18%未満","d":"A"},{"id":214,"cat":"換気装置・保護具","q":"呼吸用保護具の選定のポイント 4つ","a":"•\t呼吸用保護具の種類の選択\n呼吸用保護具は、基本として適切な吸収缶のものを用いる。加えて、次の点に留意する。\n① 酸素欠乏環境では、給気式のマスクを使用する\n② 粉じんが存在する環境では、防じん機能を有するものを使用する\n③ 引火性の蒸気・可燃性ガス・可燃性粉じんがある場所では、電動ファン付き呼吸用保護具を使う場合、防爆式を選ぶ\n\t•\t防護性能の考え方\n要求防護係数を満たすだけでなく、それを上回る指定防護係数を有する呼吸用保護具を選定する。\n\t•\t法令対応\n法令で保護具の種類が規定されている場合は、規定どおりのものを使用する。\n\t•\t目の保護が必要な場合\n眼の防護が必要な作業では、全面形面体またはルーズフィット形呼吸用インタフェースを使用する。","d":"A"},{"id":216,"cat":"換気装置・保護具","q":"有効な呼吸用保護具の選択について","a":"要求防護係数を満たすだけでなく、それを上回る指定防護係数を有する呼吸用保護具を選定する必要がある。\n要求防護係数＝ 測定対象物の濃度 ÷ 厚生労働大臣が定める濃度の基準","d":"A"},{"id":218,"cat":"換気装置・保護具","q":"防護係数とは？","a":"•\t防護係数＝ 面体の外側の濃度 ／ 面体の内側の濃度\n→ マスクが有害物質濃度を 1／防護係数 に低減できる、という意味で、値が大きいほど性能が高い。\n\t•\t要求防護係数＝ 面体の外側の濃度 ／ 基準濃度（管理濃度や濃度基準値など）\n→ 外側の濃度が基準濃度の X倍 であれば、要求防護係数は X。\n\t•\t選定の考え方：防護係数が要求防護係数を上回れば、面体内（吸気中）の濃度は基準濃度以下に抑えられる。","d":"A"},{"id":220,"cat":"換気装置・保護具","q":"呼吸用保護具の選び方","a":"•\tSDSを確認し、毒性や物質の性質（液／固体など）、緊急時の対処法を把握する。\n•\t作業環境を点検し、有害物質の濃度、局排の有無、酸素濃度などを確認する。\n•\t作業内容（作業手順・発散状況・作業時間など）を整理する。\n•\t法令で保護具の種類や要件が定められている場合は、その規定に準拠する。\n•\t選定の基本は、マスク内の濃度が基準濃度以下となるようにすること（＝要求防護係数を満たす／上回る保護具を選ぶ）。","d":"A"},{"id":222,"cat":"換気装置・保護具","q":"呼吸用保護具の選び方","a":"•\t防塵マスク\n•\t形態：取替式（Replaceable） ↔︎ 使い捨て（Disposable）\n•\t取替式は、面体と濾過材が分離している。\n•\t濾過材の粉塵捕集効率：固体粒子（S）／液体粒子（L）それぞれ 3段階（1–3、3が最高）。\n•\t選定の考え方：有害性、作業の種類、オイルミストの有無などを踏まえて選ぶ。\n•\t防毒マスク\n•\t物質に応じた吸収缶の種類を確認し、それに適合するものを選定する。","d":"A"},{"id":223,"cat":"換気装置・保護具","q":"呼吸用保護具を使用する際の注意点を教えてください","a":"•\t酸素濃度が18％以下の場所では、濾過式の保護具は使用しない。\n•\tフィットチェッカーで、漏れ込みがないか確認する。\n•\tタオルやひげなど、密着を妨げるものは避ける。\n•\t破損がないことを点検してから使用する。","d":"A"},{"id":225,"cat":"換気装置・保護具","q":"防じんマスクの規格は？","a":"•\t使い捨て：D（Disposable）／取り換え式：R（Replaceable）\n•\t対固体粒子：S（Solid）／対液体粒子：L（Liquid）\n•\t捕集効率で 1（80％以上）／2（95％）／3（99.9％） に区分される\n•\t表記例として DS3、RL1 などが用いられる","d":"A"},{"id":227,"cat":"換気装置・保護具","q":"電動ファン付き呼吸用保護具の規格は？","a":"•\tPAPR：Powered Air Purifying Respirator\n•\t機能の区分：防じん機能＝P-PAPR、防毒機能＝G-PAPR\n•\t形態：使い捨て＝D、取り換え式＝R\n•\t粒子の区分：対固体＝S、対液体＝L\n•\t捕集効率：1（95％）／2（99％）／3（99.97％）\n•\t漏れ率による級：S（0.1）／A（1.0）／B（5.0）\n•\t特徴：通常の防毒マスクより防護性能と快適性が高く、酸素濃度18％以上かつ常温・常圧・常湿の環境で使用できる。","d":"A"},{"id":229,"cat":"換気装置・保護具","q":"防じんマスクの選択・使用の注意点は？","a":"＜選択＞\n•\t酸素濃度が18％未満：使用不可\n•\t有害物質の種類を把握：防じんのみで対応するか／吸収缶が必要かを判断する\n•\t基準濃度（濃度基準値、管理濃度、許容濃度など）と、作業環境測定（C測定・D測定）で得た環境中濃度を比較して要求防護係数を算出する\n→ 要求防護係数を上回る防護係数のマスクを選定する\n＜使用＞\n•\t着用前に、変形・亀裂の有無、ろ過材の目詰まり、異臭などを点検する\n•\t面体内部への漏れ込みがないかを確認し、ひげなど密着性を下げる要因がないかもチェックする","d":"A"},{"id":231,"cat":"換気装置・保護具","q":"防毒マスクの吸収缶の種類は？","a":"防じん機能を有する場合は白線を入れる","d":"B"},{"id":233,"cat":"換気装置・保護具","q":"吸収缶の使用期限は？","a":"破過時間\n：吸収缶が除毒能力を失い、ガスが通過し始めるまでの時間。\n吸収缶や説明書に示されている破過曲線図を用いて見積もる。一般に、縦軸がガス濃度、横軸が破過時間。\n作業環境測定で得たガス濃度を当てはめて、該当する破過時間を読み取り、交換時期の目安とする。","d":"A"},{"id":235,"cat":"換気装置・保護具","q":"防毒マスクの保管、交換、廃棄について","a":"•\t直射日光を避け、湿気の少ない清潔な場所で保管する\n\t•\t積み重ねや折り曲げによる破損が起きないよう注意する\n\t•\t保管袋に穴がないか確認する\n交換・破棄\n\t•\t使用限度を守る\n\t•\t作業環境中の化学物質濃度から、使用可能時間を見積もれる（＝破過曲線）\n\t•\t温度・湿度で変動するため、安全側に見込んだ使用時間を設定する\n\t•\t変性や粘着性が認められる場合は交換する\n\t•\t使用期限切れのものは廃棄する","d":"A"},{"id":237,"cat":"換気装置・保護具","q":"電動ファン付き呼吸用保護具PARPのメリットを教えてください","a":"マスク内が陽圧に保たれているためマスク外の空気の漏れこみを防ぐことができる。","d":"A"},{"id":239,"cat":"換気装置・保護具","q":"フィットテストとは？","a":"•\t第3管理区分作業場、濃度基準値が設定されたリスクアセスメント対象物作業場、屋内金属アーク溶接作業場では、フィットテストを年1回実施する。\n\t•\tフィットファクタ＝ 呼吸保護具の外側濃度 ／ 内側濃度\n\t•\t測定したフィットファクタが、要求フィットファクタ（全面形 500、半面形 100）を上回らない場合は、装着状態が不適切（装着状態不良）。\n\t•\t計測時は、腰を曲げる、発声、頭を左右に回す、頭を上下に動かすなどの動作を行いながら測定する。","d":"A"},{"id":241,"cat":"換気装置・保護具","q":"フィットテスト","a":"とは？\n\t•\tフィットテストは、顔面に合った呼吸用保護具を選ぶために、選定時に事前に実施する。\n\t•\t定性的：サッカリンなどの試験粒子を用い、試験機器で漏れの有無（漏れ率）を判定する方法。\n\t•\t定量的：マスクフィッティングテスター等を用いて行う。大気中の粉塵を利用して測定し、漏れ率が数値として示される。","d":"A"},{"id":242,"cat":"換気装置・保護具","q":"フィットチェック","a":"作業前に顔面への密着性を確認し、呼吸用保護具の性能を十分に発揮させるために行う。\n\t•\t取替式：防塵マスクを装着し、専用の測定器を用いて 陰圧法 または 陽圧法で確認する。\n\t•\t使い捨て式：両手でマスク全体を覆い、息を強く吐いて漏れがないかを確かめる。","d":"A"},{"id":244,"cat":"換気装置・保護具","q":"フィットチェックとフィットテストの違い","a":"フィットチェック\n\t•\t着用のたびに実施し、顔面との密着性を確認する。\n\t•\t陽圧法／陰圧法で、空気の漏れ込みがないかをチェックする。\nフィットテスト\n\t•\t年1回、マスクの内外で気中有害物質（粒子等）の濃度を測定し、漏れ込みの程度を評価する。","d":"A"},{"id":246,"cat":"換気装置・保護具","q":"リ－クチェックとは？","a":"作業前に呼吸用保護具の密着性を確かめる方法として、陰圧法と陽圧法を用いる。\n\t•\t陰圧法：吸気口を掌でふさぎ、吸おうとしても空気が入らず息が吸えないことを確認する。\n\t•\t陽圧法：マスク全体を両手で覆い、息を吐いて空気の漏れがないことを確認する。","d":"A"},{"id":248,"cat":"換気装置・保護具","q":"型式検定とは","a":"型式検定は、労働安全衛生法で指定された防じんマスクなどの検定対象品目に対し、機械等検定規則に則って検定し、合格証を交付する制度です。\n合格した型式は、型式として製造されるすべての製品に、国家検定に合格したことを証する型式検定合格標章を表示して販売・譲渡することが可能となります。","d":"B"},{"id":250,"cat":"換気装置・保護具","q":"化学防護手袋とは？","a":"•\t令和6年4月に「皮膚障害等防止用保護具の選定マニュアル」が整備され、皮膚等障害化学物質等を製造・取り扱う作業では、化学防護手袋などの不浸透性の防護具の使用が義務となった。\n\t•\t皮膚等障害化学物質：\n\t•\t皮膚刺激性有害物質（化学熱傷や接触性皮膚炎）\n\t•\t皮膚吸収性有害物質（臓器障害や発がん性）\n（特別規則以外で上記2つの合計 1150物質）\n\t•\t運用面では、保護具着用管理責任者を選任し、\n保護具の適正な選択／適正使用／保守管理を一元的に管理する。\n\t•\t皮膚への有害性の扱い（判断の目安）\n\t•\t皮膚への有害性が明らか → 義務\n\t•\tないことが明らかでない → 努力義務\n\t•\t有害性がないことが明らか → 不要","d":"A"},{"id":252,"cat":"換気装置・保護具","q":"皮膚刺激性、吸収性に該当するかの確認方法は","a":"皮膚刺激性有害物質\n国が公表するGHS分類の結果及び譲渡提供者より提供されたSDS等に記載された有害性情報のうち「皮膚腐食性・刺激性」、「眼に対する重篤な損傷性・眼刺激性」及び「呼吸器感作性又は皮膚感作性」のいずれかで区分１に分類されている化学物質\n皮膚吸収性有害物質(臓器障害や発がん性)\n厚生労働省で選定した物質が令和５年７月４日付け基発0704第１号「皮膚等障害化学物質等に該当する化学物質について」の別添一覧で公表","d":"A"},{"id":254,"cat":"換気装置・保護具","q":"化学防護手袋の選択方法は？","a":"STEP. 1 作業の確認\nSTEP. 2 化学防護手袋のスクリーニング①\nSTEP. 3 化学防護手袋のスクリーニング②\nSTEP. 4 製品の性能確認\nSTEP. 5 保護具メーカへの問い合わせ","d":"A"},{"id":256,"cat":"換気装置・保護具","q":"化学防護手袋の選択方法は？","a":"STEP. 1 作業の確認\nSDSの情報をもとに、取扱物質に皮膚障害性があるかを確認する。あわせて、皮膚への接触の程度や作業時間も整理する。\nSTEP. 2 化学防護手袋のスクリーニング①\nSTEP. 1で把握した取扱物質と、作業時間・作業内容に応じて、使用できる耐透過性クラスを絞り込む。作業時間は60分／240分を区切りとして区分する。","d":"A"},{"id":257,"cat":"換気装置・保護具","q":"化学防護手袋の選択方法は？","a":"STEP. 3 化学防護手袋のスクリーニング②\n取扱物質をCAS番号で検索し、適合する手袋の材料を選ぶ。混合物の場合は、原則として含まれる全ての物質に耐透過性があるものを選定する。必要に応じて、複数の手袋を重ねて使用する方法も検討する。\nSTEP. 4 製品の性能確認\n候補製品について、耐透過性などの性能データを確認し、作業条件に合致するか最終チェックする。\nSTEP. 5　保護具メーカーへの問い合わせ\nより高度な情報が必要な場合は、保護具メーカーに照会して確認する。","d":"A"},{"id":258,"cat":"換気装置・保護具","q":"化学防護手袋使用の注意点は？","a":"使用前\n・着用前の穴あき\nの\n確認\n・サイズ・アレルギ－の確認\n使用中\n・使用時間、方法を順守\n・袖口からの侵入をテ－プで防ぐなど液だれに注意\n使用後\n・化学物質の付着面が内側になるように脱ぐ\n保管中\n・予備を備える\n・乾燥状態で保管する\n廃棄時\n・二次曝露がないように廃棄ル－ルを定める\n・産業廃棄物として廃棄する","d":"A"},{"id":260,"cat":"換気装置・保護具","q":"呼吸用保護具を嫌がる労働者がいたらどうしますか？","a":"•\tまず、着用できない／したくない理由を把握する。\n\t•\tそのうえで、正しい装着方法と、未着用による健康被害リスクを説明する。\n\t•\t同等性能で負担の少ない別の保護具がないか検討する。\n\t•\t呼吸器疾患がある場合や、マスク装着で強い呼吸苦が出る場合は個別対応とし、安全配慮義務の観点から配置換えなども選択肢になり得る。\n\t•\t併せて、労働者側にも自己保健義務があることを確認する。","d":"B"},{"id":262,"cat":"換気装置・保護具","q":"化学物質による労災発生数と原因の内訳","a":"我が国では、化学物質が原因となる健康障害（休業4日以上。がん等の遅発性疾病は除く）は、年間およそ400件程度で推移している。 \nこのうち、最も多いのは経皮ばく露による皮膚障害で、吸入・経口ばく露による障害件数のおよそ4倍に達する。\n近年は、オルト-トルイジンやMOCA（4,4’-メチレンビス（2-クロロアニリン））のように、皮膚刺激性が目立たない物質でも、皮膚から吸収されて発がん（膀胱がん）に至った可能性が疑われる事案が報告されている。","d":"A"},{"id":265,"cat":"特定化学物質","q":"特定化学物質とは？","a":"特定化学物質とは、労働者にがんを含む健康障害を生じさせるおそれがあるとして、法令で規制の対象とされている物質を指す。\nこのうち第1類・第2類の中でも、発がん性など重篤な有害性を有する、またはそのおそれが高いものは「特別管理物質」とされ、より厳格な管理が義務付けられている。\nなお、第1類・第2類はいずれも、慢性遅発性障害を起こし得る物質として整理される。","d":"A"},{"id":267,"cat":"特定化学物質","q":"特定化学物質の分類は？","a":"禁止物質：製造禁止物質。黄りんマッチ、石綿、ベンジジンなど。\n第1類物質：特に有害性が高い物質で、製造設備の密閉化や作業規定の作成などの措置を講じたうえで、厚生労働大臣の製造許可が必要となる。ジクロルベンジジン、オルトートリジン、α－ナフチルアミン、ベリリウムなど。\n第2類物質：第1類以外で有害性が高い物質。製造または取扱い設備の密閉化、もしくは局所排気装置の設置などの措置が求められる。インジウム、オーラミン、オルトートルイジン、カドミウム、クロム、ベンゼンなど。下位分類として、特定第2類物質、オーラミン等、管理第2類物質、特定有機溶剤がある。\n第3類物質：大量漏出時に急性中毒を起こし得る物質で、大量漏えい事故を防ぐための措置が必要となる。アンモニア、一酸化炭素、二酸化炭素、硫酸など。","d":"A"},{"id":269,"cat":"特定化学物質","q":"特別管理物質とは","a":"特定化学物質の第1類物質と第2類物質のうち、がん原性物質、またはがん原性が疑われる物質を指す。取扱いに関する注意事項の掲示が求められ、健康診断記録は30年間保存する義務がある。\n第1類：ジクロルベンジジン、オルト－トリジン、ベリリウム\n第2類：インジウム、オ－ラミン、オルト－トルイジン、カドミウム、クロム、ベンゼンなど。\n特別有機溶剤：四塩化炭素、ジクロロエタン、スチレン、トリクロロエチレン、クロロホルムなど。","d":"A"},{"id":271,"cat":"特定化学物質","q":"特別有機溶剤とは？","a":"有機溶剤のうち、発がん性が指摘されることから、特定化学物質の管理第2類物質として扱われるものが12種類あり、いずれも特別管理物質に該当する。\n例：四塩化炭素、ジクロロエタン、スチレン、トリクロロエチレン、クロロホルムなど。","d":"A"},{"id":273,"cat":"特定化学物質","q":"特化則とは？","a":"事業者が化学物質による健康障害を防ぐために、講じるべき対策を体系的に示した規則。内容としては、たとえば次の事項を定めている。\n・特化物の分類\n・設備（密閉設備、局所排気装置、プッシュプル型換気装置、休憩室、洗浄設備、掲示）\n・用後処理（除じん、排ガス、排液）\n・漏えい防止\n・管理（作業環境測定、特定化学物質作業主任者の選任、定期自主点検）\nなど。","d":"A"},{"id":275,"cat":"特定化学物質","q":"特定化学物質作業主任者とは？","a":"特化物作業を行う事業者は、特定化学物質及び四アルキル鉛等作業主任者技能講習を修了した者の中から、特定化学物質作業主任者を選任する。\n作業主任者の役割は、例えば次のような事項を担う。\n・作業方法を定め、作業を指揮する\n・換気装置、除塵装置、排ガス処理装置などを1か月ごとに点検する\n・保護具の使用状況を確認し、必要な指導を行う\n・タンク内作業に必要な措置が講じられているかを確認する\nなど。","d":"B"},{"id":277,"cat":"特定化学物質","q":"SDSとは？","a":"SDS（Safety Data Sheet）：安全データシート\n化学物質を譲渡する際に、当該物質の物理化学的性質、危険有害性、取扱い上の注意など、定められた16項目の情報を相手方へ提供するための文書。\n記載内容の例としては、物理化学的性質、危険性・有害性、ばく露時の応急措置、取扱方法、保管方法、廃棄方法などがある。\nJIS Z 7253：ラベル及びSDSの作成方法に関する日本産業規格","d":"A"},{"id":280,"cat":"特定化学物質","q":"ラベルとは ？","a":"化学品に関する情報要素のまとまりであって、かつ、化学品の容器に直接印刷貼り付けまたは添付されるもの","d":"A"},{"id":282,"cat":"特定化学物質","q":"ラベルに記載する情報は？","a":"• 危険有害性を表す絵表示\n• 注意喚起語\n• 危険有害性情報\n• 注意書き\n• 化学品の名称\n• 供給者を特定する情報\n• その他国内法令によって表示が求められる事項","d":"A"},{"id":284,"cat":"特定化学物質","q":"GHSとは？","a":"化学品の分類および表示に関する世界調和システム」（The Globally Harmonized System of Classification and Labelling of Chemicals：GHS）\nは、化学物質の危険有害性を、国際的に統一した基準で分類するための仕組み。\n国連が作成\n分類結果は、ピクトグラム（絵表示）などを用いて分かりやすく示し、ラベルやSDSへ反映させることで、災害防止や人の健康・環境の保護に活用することを目的とする。","d":"A"},{"id":286,"cat":"特定化学物質","q":"GHSにおける有害性を例をたとえて教えてください","a":"危険有害性は、①物理化学的危険性、②健康有害性、③環境有害性の3区分で整理される。例としては以下のとおり。\n① 物理化学的危険性（全17項目）\n・爆発物：ニトログリセリンは不安定で、衝撃や摩擦で爆発しやすい\n・引火性液体：ガソリンなど。火花で容易に燃える\n② 健康有害性（全10項目）\n・急性毒性：シアン化水素は少量でも致死的な中毒を起こし得る\n・発がん性：アスベストは肺がんのリスクを高める\n③ 環境有害性（全3項目）\n・水生環境有害性：銅化合物は水質汚染の要因となり得る","d":"A"},{"id":288,"cat":"特定化学物質","q":"GHSにおける有害性を例をたとえて教えてください","a":"健康有害性(全10項目)\n　急性毒性\n皮膚腐食性／刺激性\n　目に対する重篤な損傷性／目刺激性\n　呼吸器感作性または皮膚感作性\n　生殖細胞変異原性\n　発がん性\n　生殖毒性\n　特定標的臓器毒性（単回ばく露）\n特定標的臓器毒性（反復ばく露）\n　誤えん有害性","d":"A"},{"id":290,"cat":"特定化学物質","q":"【炎】","a":"可燃性/引火性ガス\n引火性液体\n可燃性固体\n自己反応性化学品\n【円上の炎】\n支燃性/酸性ガス\n酸化性液体\n酸化性固体\n【爆弾の爆発】\n爆発物\n自己反応性化学品\n有機過酸化物\n【腐食性】\n金属腐食性\n皮膚腐食性\n眼に対する重大な損傷性\n【ガスボンベ】\n高圧ガス\n【どくろ】\n急性毒性\n(区分1～3)\n【感嘆符】\n急性毒性(区分4)\n皮膚腐食性(区分2)\n眼刺激性(区分2A)\n皮膚感作性\n特定標的臓器毒性\n【環境】\n水性環境有害性\n【健康有害性】\n呼吸器感作性\n生殖細胞変異原性\n発がん性\n生殖毒性\n特定標的臓器毒性\nGHSのピクトグラムの例は？","d":"A"},{"id":292,"cat":"特定化学物質","q":"ピクトグラムと危険有害性の区分？","a":"危険有害性の区分によって用いるピクトグラムが変わる。急性毒性については区分1～5まであり、1の方が毒性が強く、1－3はどくろ、4は感嘆符。","d":"A"},{"id":294,"cat":"特定化学物質","q":"急性毒性とは？","a":"急性毒性とは化学品への単回または短時間のばく露後に生じる健康への重篤な毒性のこと","d":"A"},{"id":296,"cat":"特定化学物質","q":"急性毒性区分の表し方について教えてください","a":"毒性試験で得られた\n急性毒性推定値\n(ATE: Acute Toxicity Estimates)と曝露経路により急性毒性の危険有害性区分が分類される。","d":"A"},{"id":298,"cat":"特定化学物質","q":"LD50、LC50とは？","a":"LD50（Lethal Dose 50）は、ある動物群に単回投与した場合に、その集団の50％が死亡すると推定される投与量を指す。\nLC50（Lethal Concentration 50）は、1回の曝露（投与）で、ある動物群の50％が死亡すると推定される濃度を指す。\nいずれも、GHSの危険有害性区分などの判定に用いられる指標。","d":"A"},{"id":300,"cat":"特定化学物質","q":"SDSとGHSの違いは？","a":"GHSは全体的な枠組みを提供\nSDSはその枠組みに沿って具体的な情報を伝達する手段","d":"A"},{"id":302,"cat":"特定化学物質","q":"NITE-CHRIP/NITE-Gmiccsとは？","a":"オンラインで無料利用できるデータベースで、化学物質の有害性情報や法規制などを検索できる。GHS分類に基づき、SDSやラベル作成の作業を支援する機能もある。\nNITE-CHRIP（NITE Chemical Risk Information Platform：ナイトクリップ）は単一の化学物質に対応している。\nNITE-Gmiccs（GHS Mixture Classification and Labelling/SDS Creation System：ナイトジーミックス）は混合物に対応している。","d":"A"},{"id":304,"cat":"特定化学物質","q":"化学物質の作業リスクアセスメントは？","a":"・CREATE-SIMPLE\n①物質名 ②性状 ③含有率 ④揮発性・飛散性 ⑤取扱量 ⑥作業状況 ⑦換気状況 ⑧曝露時間・頻度 ⑨防護具 ⑩着火源対策などを入力し、\n(1)吸入リスク (2)経皮吸収リスク (3)火災・爆発リスク\nを、Ⅰ（十分に良好）Ⅱ（良好）Ⅲ（要リスク低減措置）Ⅳ（至急リスク低減措置）の4段階で判定\n入力条件（パラメータ）を変えて試算することで、リスク低減措置の検討材料（ヒント）を得やすい。\nなお、ガス状物質や、粉じんではない固体は対象外。\n・コントロール・バンディング\n①有害性＝GHS区分 ②揮発性・飛散性＝形状・温度 ③取扱量＝1回または1日当たりの使用量を入力\nその結果として、作業リスクレベルと対策シートが出力される。","d":"A"},{"id":306,"cat":"特定化学物質","q":"コントロールバンディングとはなんですか","a":"「化学物質の健康有害性についての簡易なリスクアセスメント手法」\n①GHS区分、②使用量、③液体／個体の別を入力することで、曝露濃度の測定を行わなくても、有害性と曝露情報の組み合わせからリスクを見積もり、必要となる管理対策の区分を示す仕組み。\nILOが作成した、開発途上国の中小企業を主な対象とする、有害物質から労働者を守るための簡便で実用的なリスクアセスメント手法を参考にして作られた。","d":"A"},{"id":308,"cat":"特定化学物質","q":"CREATE-SIMPLEとはなんですか","a":"全業種を対象とした、簡易的に使える化学物質リスクアセスメントツール。\n評価の考え方は、「曝露限界値」と、化学物質の取扱い条件などから推定した「曝露濃度」を比べる方法となっている。\n使用量は、大量（kL、t）から極少量（数ml、数g）まで幅広く想定している。\n新機能として、経皮吸収についても有害性のリスクを見積もることができる。\n対象物質、使用方法、使用時間などの条件を入力することで、危険性と有害性の両面から算出が可能。","d":"A"},{"id":310,"cat":"特定化学物質","q":"CREATE-SIMPLEのリスク見積もり方法","a":"まず、ばく露限界値等を確認し、利用できる場合はそれを用いる。該当する値がないときは、GHS分類結果から算定して「ばく露限界」を設定する。\n次に、揮発性・飛散性、取扱量、含有量、作業内容、換気条件、作業時間・頻度、呼吸用保護具の種類と有無といった条件を入力し、定められたルールに沿って「推定ばく露濃度」を求める。\n最後に、推定ばく露濃度をばく露限界で割り、その比の大きさに基づいてリスクレベルを判定する。","d":"A"},{"id":313,"cat":"特定化学物質","q":"CREATE-SIMPLE(CS)とコントロール・バンディング","a":"(CB)\nとは何が異なりますか。3点\n・CSは、有害性の指標として曝露限界値（＝許容濃度）を用いている。\n・CSでは、取扱量がml単位で細かく区分されており、少量のケースにも対応しやすい。\n・CSでは、CBで扱っていない作業条件（含有率、換気、作業時間、保護具など）も入力要素として反映し、評価に組み込んでいる。","d":"A"},{"id":314,"cat":"特定化学物質","q":"化学物質による健康障害の防止対策は？","a":"作業環境管理\n・製造、使用の中止、有害性の低い代替物質への転換\n・設備の密閉化、自動化、遠隔操作、隔離\n・局所排気装置、プッシュプル型換気装置による汚染物質の拡散防止\n・全体換気による希釈排出\n・作業環境測定による管理状態のチェック\n作業管理\n・呼吸用保護具の着用徹底と、適正使用の推進\n・作業手順書の作成と周知\n・作業主任者を選任して、作業方法を決定し、労働者を指導\n健康管理\n・特殊健康診断の実施","d":"A"},{"id":316,"cat":"特定化学物質","q":"低 曝露 となるために何をしますか？","a":"代替物質の使用\n発散源の密閉\n局排または全体換気の設置、点検\n作業の方法の改善\n有効な呼吸用保護具の使用。","d":"A"},{"id":318,"cat":"特定化学物質","q":"リスクアセスメント(RA)対象物 で行うこと","a":"・リスクアセスメント実施\n・ラベル表示\n・SDS交付\n・濃度基準値以下に管理 or 曝露を最小限に管理\n・リスクアセスメント対象物健診\n・適切な保護具使用","d":"A"},{"id":320,"cat":"特定化学物質","q":"RA対象物健診は？","a":"第3項健診：RA対象物を製造・取扱する労働者について、RAの結果を踏まえ、関係労働者の意見を聴取したうえで、必要があると認めるときに実施する。\n第4項健診：濃度基準値が設定されているRA対象物を製造・取扱する労働者が、濃度基準値を超えて曝露したおそれがある場合に実施する。\n健診では、医師が必要と判断した項目を行い、結果に応じて必要な措置を講じる。","d":"A"},{"id":322,"cat":"特定化学物質","q":"特化物の特殊健診は？","a":"・業務の経歴調査\n・作業条件の簡易な調査\n・他覚・自覚症状の既往と現症の確認\n・その他、物質ごとに定められた項目の確認\n具体例\n尿潜血\n　オルト－トルイジン、MOCA\n胸部Xp\n　ベリリウム、インジウム\n肝機能\n　クロロホルム、トリクロロエチレン\n赤血球・白血球数\n　ベンゼン","d":"A"},{"id":324,"cat":"特定化学物質","q":"量-影響関係,量-反応関係について教えてください","a":"量-影響関係：有害物質の曝露量と生体影響の指標の関係。\n量-反応関係：曝露量と生体影響の発生率の関係。\n　　　　　　 無影響量や致死量などを把握するために用いる　\n量-影響は個人、量-反応は集団。","d":"A"},{"id":326,"cat":"特定化学物質","q":"自律的な化学物質管理の背景とは？","a":"職域で使用される化学物質は数万種類に及び、すべてを法令で網羅的に規制するのは現実的に難しい。\nまた、休業4日以上の化学物質による労災は年間約500件で、その約8割は規制対象外物質が原因とされる（皮膚障害では9割以上が規制外）。\n背景として、これまで使用していた化学物質が規制対象になると、措置義務を避ける目的で、危険性・有害性の確認や評価を十分に行わないまま規制対象外物質へ切り替え、結果として対策が不十分なまま労災が起きる、いわゆる「規制とのイタチごっこ」が繰り返されてきたことが挙げられる。","d":"A"},{"id":328,"cat":"特定化学物質","q":"「自律的な化学物質管理」に向けての制度改正を教えてください","a":"令和4年から法令の改正が行われています。\n・GHS分類で危険性・有害性が確認された全ての物質\n　・譲渡/提供時：有害性情報伝達(ラベル表示・SDS交付)\n　・製造/使用時：SDS情報に基づくRAの実施\n　・曝露濃度を濃度基準値設定物質は基準値以下に\n　　　　　　　設定のない物質はなるべく低曝露に\n・GHS未分類物質に関して自律的な管理が努力義務\n・すべての物質について薬傷、皮膚吸収による健康障害を\n　防ぐための保護眼鏡、保護手袋等の使用義務\n・化学物質管理者、保護具着用管理責任者の選任義務\n・職長教育の対象業種拡大\n・雇入時の危険有害業務に関する教育を全業種に拡大。","d":"A"},{"id":330,"cat":"特定化学物質","q":"自律的な化学物質管理で変わるものは？","a":"化学物質管理の枠組みが見直され、リスクアセスメント（RA）対象物質は、2026年4月までに約2,300物質へ段階的に拡大される。\nRA対象物質を取り扱う場合に求められる主な対応\n・リスクアセスメントの実施\n・ラベル表示\n・SDS（安全データシート）の交付\n・濃度基準値以下での管理\n・ばく露をできるだけ低く抑える管理\n・リスクアセスメント対象物健康診断の実施\n・適切な保護具の使用\n記録の保存\n・RAの結果、ばく露低減措置の内容、労働者の意見：3年間保存\n・RA健診の結果：5年間保存\nそのほかの主な見直し事項\n・皮膚等障害化学物質を扱う場合、皮膚障害などを防ぐための保護具使用が義務化\n・遅発性疾病の把握のため、同種のがんに複数人が罹患した場合は、医師の意見を聴く仕組みを整える\n実施体制の整備\n・RA対象物を取り扱う事業場：化学物質管理者（専門講習修了者）の選任が必要\n・保護具を使用する作業がある事業場：保護具着用管理責任者の選任が必要\n・ばく露低減措置、健康診断結果、事後措置について、衛生委員会で調査審議する\n教育の拡充\n・雇入れ時の化学物質取扱い教育を、全業種へ拡大\n・職長教育の対象業種を拡大（食料品製造業、印刷・加工業など）","d":"A"},{"id":332,"cat":"特定化学物質","q":"自律的な化学物質管理で変わるものは？","a":"情報伝達の強化\n・SDSの「人体に及ぼす作用」は、少なくとも5年ごとに内容を確認する。\n・SDSには「想定される用途」と「使用上の注意」を記載する。\n・SDSには、成分の重量％表示を記載する。\n・小分けして保管する容器についても、ラベル表示を行う。\n負担軽減につながる見直し\n・SDS通知の方法を簡略化でき、メールや二次元コード等による通知が可能。\n・労働局長が管理状況を良好と認めた場合、特別則の適用物質についても、自律的な管理へ移行できる場合がある。\n・直近3回連続で第1管理区分、かつ直近3回で労働者に新たな異常所見がなく、さらに直近健診以降に作業内容の変更がない場合は、特殊健診の頻度を年1回へ緩和できる。","d":"A"},{"id":333,"cat":"特定化学物質","q":"化学物質管理者の職務","a":"・ラベル/SDS等の確認\n・化学物質に対するRAの実施管理\n・RA結果に基づく曝露防止措置の選択、実施の管理\n・化学物質の自律的な管理に関する各種記録の作成・保存\n・化学物質の自律的な管理に関する労働者への周知・教育\n・ラベル/SDSの作成(製造事業場)\n・RA対象物による労働災害発生時の対応。","d":"A"},{"id":335,"cat":"特定化学物質","q":"化学物質管理 専門家 の職務","a":"令和6年4月1日施行の労働安全衛生規則第34条の2の10では、化学物質による労働災害が発生した事業場等のうち、所轄労働基準監督署長から化学物質管理の状況について改善指示を受けた事業場は、化学物質管理専門家の助言を受ける必要があるとされています。\n助言の対象となる確認事項は、次のとおり。\n① リスクアセスメントの実施状況\n② リスクアセスメントの結果に基づく必要な措置の実施状況\n③ 作業環境測定または個人ばく露測定の実施状況\n④ 特別則に規定するばく露防止措置の実施状況\n⑤ 事業場内における化学物質の管理、容器への表示、労働者への周知の状況\n⑥ 化学物質等に係る教育の実施状況","d":"B"},{"id":337,"cat":"特定化学物質","q":"特定化学物質 の掲示内容4つ　","a":"製造・取扱う作業場に労働者が見やすい場所に下記を掲示\n・特定化学物質の名称\n・人体に及ぼす作用\n・取り扱い上の注意\n・使用すべき保護具","d":"B"},{"id":339,"cat":"特定化学物質","q":"新規の化学物質を用いたい場合はどのような手続きを取るか教えてください","a":"新規化学物質を製造・輸入しようとする事業者は、事前に当該化学物質の有害性調査を行い、その結果を厚生労働大臣へ届け出る必要がある（試験研究目的または100kg/年以下を除く）。\n有害性調査では、微生物を用いる変異原性試験、またはがん原性試験を実施する。\n試験は安衛法GLPに従って行うことが求められる。\nまた、厚生労働大臣は、有害性調査の結果を踏まえ、必要に応じて設備の密閉化や保護具の備え付けなど、適切な措置を講じるよう勧告できる。","d":"B"},{"id":341,"cat":"特定化学物質","q":"社長から化学物質の自律的管理がわからない、端的に教えてと言われたら ","a":"ラベルでアクション","d":"B"},{"id":344,"cat":"有機溶剤","q":"有機溶剤とは？","a":"他の物質を溶かす目的で用いられる有機化合物の総称。混合物であっても、有機溶剤の含有率が5％以上であれば「有機溶剤等」に該当する。有機溶剤中毒予防規則では、これらを3種類に区分している。\n有機溶剤は、塗装、洗浄、印刷など、さまざまな職場で溶剤として広く使用されている。常温では液体のものが多いが、一般に揮発性が高く、蒸気を吸入することで経気道的に体内へ取り込まれやすい。また脂溶性であるため、経皮吸収が生じる場合もある。","d":"A"},{"id":346,"cat":"有機溶剤","q":"有機溶剤の分類を説明してください","a":"第1種：有害性が特に高い有機溶剤。二硫化炭素など。\n第2種：第1種ほどではないが、単一組成で有害性が高い有機溶剤。アセトン、トルエン、キシレン、スチレン、メタノール、ノルマルヘキサン、ジクロロメタンなど。\n第3種：混合有機溶剤。ガソリン、コールタールナフサなど。\n全54種類。","d":"A"},{"id":348,"cat":"有機溶剤","q":"有機溶剤の特性は？","a":"空気より重く、床面など低い場所にたまりやすい。\n揮発性と脂溶性が高く、吸入（経気道）だけでなく皮膚からも吸収される。\n体内では肝臓で代謝され、尿や胆汁を通じて排出される。\n揮発性が高い分、呼気として体外へ出る経路もある。\nまた脂溶性のため、神経組織や肝臓、腎臓などに蓄積しやすい。","d":"A"},{"id":350,"cat":"有機溶剤","q":"有機溶剤の健康障害は？","a":"共通してみられやすい健康障害として、神経症状、皮膚症状、粘膜刺激作用が挙げられる。\n一方、物質ごとに特徴的な健康障害もある。\n・二硫化炭素：微小血管瘤、精神障害、多発神経炎\n・ノルマルヘキサン：多発血管炎\n・ベンゼン：白血病\n・メタノール：視神経炎","d":"A"},{"id":352,"cat":"有機溶剤","q":"有機溶剤の義務は？","a":"【第1種、第2種】\n・発散源対策（密閉 or 局所排気 or プッシュプル型換気）\n・局所排気装置の点検（1か月に1度）と記録保存（3年間）\n・作業環境測定（6か月に1度）と記録保存（3年間）\n・作業主任者の選任\n・特殊健康診断（5年間）\n・作業中の掲示、計画の届出\n【第3種】\n・全体換気で対応可能\n・作業環境測定は実施義務なし","d":"A"},{"id":354,"cat":"有機溶剤","q":"有機溶剤の健康障害防止策は？","a":"作業環境管理\n使用中止や有害性の低いものへの変更\n作業方法の改良による発散の防止\n発散源の密閉化、自動化\n局排、PP型換気装置による拡散防止\n全体換気で希釈排出\n作業環境測定で区分分け\n作業管理\n呼吸用保護具の着用徹底と適正使用\n作業手順書の作成\n作業主任者選任\n健康管理\n特殊健診の実施","d":"A"},{"id":356,"cat":"有機溶剤","q":"有機溶剤特殊健診とは？","a":"有機溶剤中毒予防規則に基づいて実施される健康診断。対象は、屋内で第1種・第2種有機溶剤作業に従事する者、ならびにタンク内で第3種有機溶剤作業に従事する者。\n実施時期は、雇入れ時、配置替え時に加え、業務に従事している間は6か月以内に1回の頻度で行う。\n主な確認項目は、業務経歴、有機溶剤による健康障害の自覚症状、他覚症状の既往と現症、さらに使用溶剤に応じた生物学的モニタリング項目。\n具体例：\nトルエン：尿中馬尿酸\nキシレン：尿中メチル馬尿酸","d":"A"},{"id":358,"cat":"有機溶剤","q":"生物学的モニタリングとは？ ","a":"生物学的モニタリングとは血液、尿、毛髪などの生体試料を使用して、摂取量や吸収量といった、有害物質の曝露の程度を推定する方法です。\n有機溶剤の生物学的モニタリングでは尿で行うのが一般的で、以下のような項目があります。\nトルエン\n馬尿酸\nキシレン\nメチル馬尿酸\nスチレン\nマンデル酸\nノルマルヘキサン\nヘキサンジオン","d":"A"},{"id":360,"cat":"有機溶剤","q":"有機則で送気マスクに限定される作業2つ","a":"有機溶剤を入れたことのあるタンク内業務\n密閉、局排、PPなしのタンク内短時間業務。","d":"A"},{"id":363,"cat":"有機溶剤","q":"有機溶剤で管理区分1にもかかわらず有所見者が出た場合はコンサルタントとしてどう対応しますか","a":"・有所見者への聴取\n　どの項目で有所見となったのかを確認し、業務以外の要因がないかも整理する（飲酒、飲料、趣味、その他の生活要因など）。\n・作業環境測定の条件確認\n　作業環境測定が、定常作業の状態で実施されていたかをチェックする。\n・現場での実態確認\n　保護具（マスク、手袋）が適切に着用できているか、また、有機溶剤に曝露しやすい位置や手順になっていないか（作業姿勢・作業方法）を現場で確認する。","d":"B"},{"id":365,"cat":"重金属","q":"鉛作業にはどのようなものがあるか？","a":"鉛の製造と取扱\n鉛蓄電池の製造、処理、解体\n鉛塗料の剥離、船のさび止めかき落とし\nはんだ付け\n陶磁器製造","d":"A"},{"id":367,"cat":"重金属","q":"鉛の健康障害は？","a":"成人：代表的な3主徴（貧血、腹部疝痛、末梢神経障害）\n生殖毒性：不妊、早産、低出生体重児、流産、死産\n貧血：赤血球δアミノレブリン酸脱水素酵素阻害 → ヘム合成異常\n　　　→ 蒼白、倦怠感、易疲労感\n腎障害\n消化器症状：腹部疝痛、便秘、食欲不振\n末梢神経障害：筋肉痛、関節痛、手指の振戦、伸筋麻痺（下垂手）、知覚異常\n中枢神経障害：焦燥感、注意散漫、易怒性\n小児：神経発達障害","d":"A"},{"id":370,"cat":"重金属","q":"鉛中毒で貧血が起きるメカニズムを教えてください","a":"鉛によりデルタアミノレブリン酸脱水酵素(ALAD)の活性低下が生じ、ヘムの合成阻害が生じる。","d":"A"},{"id":372,"cat":"重金属","q":"鉛の健康障害防止策は？","a":"作業環境管理\n作業の密閉化、自動化\n局所排気装置、PP型換気装置\n全体換気\n局排、PPの定期自主検査(年1回)\n作業環境測定(年1回)\n作業環境の湿潤化\n作業管理\n呼吸用保護具の適正使用\n鉛作業主任者の選任、作業方法の指導\n作業場\n、\n休憩室の\n水洗\n健康管理\n特殊健康診断","d":"A"},{"id":374,"cat":"重金属","q":"鉛の特殊健診は？\t","a":"時期：雇入れ時、配置替え時に加え、業務従事中は6か月ごとに1回実施する。\n項目：業務経歴調査、作業条件の簡易な調査、自覚症状・他覚症状の調査を行い、検査として血中鉛、尿中デルタアミノレブリン酸を実施する。\nまた、医師が必要と認めた場合は、貧血検査、赤血球中のプロトポルフィリン量、神経学的検査を追加する。\n血中鉛：≤20／20–40／>40 μg/dL。\n尿中δ-アミノレブリン酸（δ-ALA）：≤5／5–10／>10 mg/L。\n赤血球中プロトポルフィリン（全血）：≤40／40–100／>100 μg/dL。","d":"A"},{"id":376,"cat":"重金属","q":"鉛の健康診断、血中濃度、分布","a":"鉛の血中濃度は、分布1〜3という考え方で区分して扱われる。\n分布1：この範囲で維持されていれば、健康影響は少ないと考えられる。\n分布2：この範囲であれば、多くの場合は作業者に明らかな健康障害はみられないと考えられるが、職場環境の改善が望ましい。\n分布3：分布1・2の設定は、量－影響関係、量－反応関係などを根拠に算出されている。\n目安として、分布1は血中鉛20 μg/dL以下、分布2は40 μg/dL以下。","d":"A"},{"id":378,"cat":"重金属","q":"血中鉛濃度 に応じた症状","a":"血中鉛濃度に応じて、みられやすい変化を整理すると次のとおり。\n・10 μg/dL：ALADの活性阻害が起こり始める\n・35 μg/dL：尿中ALAが増加し始める\n・50〜80 μg/dL以上：倦怠感、胃腸障害、末梢神経症状がみられ得る\n・80 μg/dL以上：貧血が出現しやすい","d":"A"},{"id":380,"cat":"重金属","q":"カドミウムの健康障害は？","a":"顔料、電池、合金、電子工業などで使用される重金属。\n腎毒性によりミネラルが失われやすくなり、骨障害につながる。\n曝露は、カドミウムの溶接・溶断などで発生するヒュームを吸入する形が多い。\n急性中毒：肺水腫、間質性肺炎、肺線維症\n慢性中毒：肺気腫、腎臓近位尿細管障害、骨軟化症、溶血性・鉄欠乏性貧血、歯牙の黄色環\n（職域ではないが）微量の慢性曝露によるイタイイタイ病（腎近位尿細管障害＋骨軟化症＋腎性貧血）が知られる。\nIARC Group1\n管理濃度：0.05mg/m3（低濃度管理）。","d":"B"},{"id":382,"cat":"重金属","q":"カドミウムの特殊健診は？","a":"業務経歴調査、作業条件の簡易な検査を行う。\nあわせて、せき、たん、鼻粘膜の異常、食欲不振、悪心嘔吐、腹痛などについて、他覚症状・自覚症状の既往と現症を確認する。\n検査項目として、血中カドミウム、尿中β2－ミクログロブリンを実施する。","d":"B"},{"id":384,"cat":"重金属","q":"マンガン中毒の健康障害は？","a":"マンガンは、マンガンの採掘・精錬、アーク溶接、乾電池の製造などで曝露が起こり得る。吸収経路は粉じんやヒュームの吸入が中心。体内では大脳基底核の黒質や線条体に沈着しやすい。\n健康影響としては、精神・神経症状（神経衰弱のような状態から始まり、進行するとパーキンソン症状がみられることがある）が知られる。肺炎についても、ヒュームの吸入を契機に発症することがある。\n法令上は特化物第2類に該当し、発散抑制措置、特化物作業主任者の選任、作業環境測定、特化物健診が求められる。特化物健診ではパーキンソン症状の有無や握力の測定などを確認する。","d":"A"},{"id":386,"cat":"重金属","q":"ベリリウムの健康障害は？","a":"レアメタルの一種で、軽量で強度が高い、熱伝導性が高いなどの物理化学的特性を持ち、医療、航空宇宙、精密機器、通信など幅広い分野で利用される。\nIARC分類ではGroup1。\n健康影響として、急性ベリリウム症（鼻咽頭炎、眼結膜炎、皮膚炎、肺炎）、慢性ベリリウム症（ベリリウム肺、間質性肺炎）、肺がんなどがある。\nベリリウム肺はサルコイドーシスと病理学的に区別が難しいため、曝露歴の確認に加えて、ベリリウム免疫感作試験などで鑑別を行う。\n・健康管理手帳の交付対象：両肺野にベリリウムによるびまん性の結節影\n・管理濃度：0.001mg/m3","d":"A"},{"id":388,"cat":"重金属","q":"インジウムの健康障害は？","a":"レアメタルの一種で、薄型ディスプレイの電極、半導体、電池材料などに利用される。\n2001年には、インジウム・スズ酸化物の研磨作業に従事していた27歳男性が、間質性肺炎で死亡した事例が報告された。動物実験でも吸入曝露により肺腫瘍の発生が確認され、発がん性が示唆されている。\nIARC分類でGroup2A。\n2013年に特化物第2類物質および特別管理物質。\n診断\n・血中インジウム濃度の上昇\n・KL-6やSP-Dなどの間質性肺炎マーカーの上昇\n・気管支鏡／肺生検などによる評価\n曝露源としては、酸化インジウムスズ（ITO）などを含む粉塵やミストが挙げられる。","d":"A"},{"id":390,"cat":"重金属","q":"インジウムの健康障害防止対策は？","a":"作業環境管理\n発散源の密閉化、自動化、遠隔化\n局所排気装置、PP型換気装置\n全体換気\n湿潤化\n作業室の出入り口に粘着マットの設置\n個人サンプリングによる作業環境測定\n(低管理濃度特定化学物質ではない？次ページへ)\n作業管理\n作業方法の見直し(曝露時間も)\n作業手順書の作成\n呼吸用保護具(\nPAPR\nや送気マスク)の使用徹底と適正使用\n健康管理\n特殊健康診断","d":"A"},{"id":392,"cat":"重金属","q":"インジウムの健康障害防止対策は？","a":"インジウムの濃度管理については、少量でも毒性が強い点を踏まえた運用が求められる。\n管理濃度は設定されておらず、実現可能な低濃度を前提にした目標濃度を用いる。目標濃度は吸入性粉塵として0.01mg/m3。許容濃度は3×10-4mg/m3。\n測定は、個人サンプリングにより吸入性粉塵を評価する。","d":"A"},{"id":394,"cat":"重金属","q":"間質性肺炎を起こす金属は？","a":"カドミウム、ベリリウム、インジウム、コバルト、ニッケル、アルミニウム","d":"A"},{"id":396,"cat":"重金属","q":"ニッケル","a":"電池、触媒、合金\n金属アレルギー(接触性皮膚炎、喘息)、間質性肺炎、肺がんなど。","d":"B"},{"id":398,"cat":"重金属","q":"クロム酸","a":"メッキ、金属加工、塗装などで取り扱われることが多い。\n急性中毒：大量に経口摂取や経皮吸収した場合、腎障害や消化器症状などが生じ得る。\n慢性中毒：鼻腔潰瘍、鼻中隔穿孔、クロム潰瘍（爪床など）がみられることがある。\n管理濃度はクロムとして0.05mg/m3（低濃度管理）。\n4年以上従事した場合は健康管理手帳の対象となり、Xpも確認する。","d":"B"},{"id":401,"cat":"粉じん","q":"粉じんや特定粉じん発生源とは何ですか？","a":"粉塵：物の破砕や選別などの機械的処理、または堆積物の舞い上がりによって発生し、空気中に飛散する固体の微細粒子を指す。\n特定粉塵：粉塵のうち、健康障害を生じるおそれがあるもの。\n特定粉塵発生源：\nじん肺予防の観点から、有効な発生源対策が可能であり、かつ実施が求められる発生源\n。","d":"A"},{"id":403,"cat":"粉じん","q":"特定粉塵発生源の具体例を教えてください","a":"坑内の鉱物を、固定式の動力設備を用いて運搬したり掘削したりする作業。\nまた、屋内で研磨剤を吹き付けて岩石・鉱物を研磨する、掘削する、といった作業も含まれる。","d":"A"},{"id":405,"cat":"粉じん","q":"粉じん、ヒュ－ム、ミスト","a":"いずれも空気中に浮遊し得る微粒子。\n粉じん：研磨、粉砕などで生じる固体の微粒子。1–150㎛。\nヒューム：金属が気化し、その後に凝固してできる微粒子。0.1–1㎛。\nミスト：液体が微細な粒子になったもの。10㎛以下。例：金属粒子、オイルミスト、インジウム。\n侵入範囲：10µm超は鼻咽頭で捕集（上気道刺激、鼻炎）／PM10は気管支まで到達（咳、喘息悪化）／PM2.5（2.5µm以下）は肺胞に到達（肺炎、COPD増悪）","d":"A"},{"id":407,"cat":"粉じん","q":"粉塵の測定方法を教えてください","a":"・フィルター捕集法\n・デジタル粉塵計\n・粒径分布測定\nフィルター捕集法\n　作業環境測定における粉塵測定は、肺胞まで到達し得る吸入性粉塵を対象とする。分級装置で吸入性粉塵を分けたうえでフィルターに捕集し、質量として測定する。\nデジタル粉塵計\n　粉塵による光の散乱を利用して、粉塵量を推定する測定方法。\n粒径分布測定\n　新規物質や未規制物質の粉塵を評価する場面などで用いられ、粒子の大きさの分布を確認する。","d":"A"},{"id":409,"cat":"粉じん","q":"粉塵の管理濃度は？","a":"管理濃度（E）は、次の式で表される。\nE（管理濃度）＝3.0／（1.19Q＋1） （mg/m3）\nQ：遊離ケイ酸含有率（％）\nこの見直しは、粉じんの中でも特に有害性が高い結晶性シリカ（遊離ケイ酸）について、発がん性リスクを抑える目的で管理濃度が段階的に改正されてきた流れに沿うもの。\nなお、許容濃度は別枠で、粉じんの種類ごとに定められている。","d":"A"},{"id":411,"cat":"粉じん","q":"粉じんによる健康被害は？","a":"じん肺：肺の線維増殖性変化により、肺胞の拡張性が低下し、ガス交換の効率も落ちる。\nじん肺合併症：肺結核、結核性胸膜炎、気管支炎、気管支拡張症、気胸、肺がん。\nその他：皮膚炎、結膜炎、気管支喘息、鼻炎。","d":"A"},{"id":413,"cat":"粉じん","q":"粉じんによる健康障害防止対策は？","a":"作業環境管理\n粉塵作業の中止、作業の転換\n密閉化、自動化、隔離\n局排、PPによる拡散防止\n全体換気で希釈排出\n作業環境測定で管理状態確認\n作業管理\n保護具着用の徹底と適正使用\n保護具着用管理責任者の選任\n健康管理\nじん肺健診","d":"A"},{"id":415,"cat":"粉じん","q":"じん肺とはなんですか？","a":"粉塵を長期間吸い込むことで、肺に不可逆的な線維増殖性変化が生じる状態。結果として肺胞の拡張性（柔軟性）が低下し、ガス交換の効率も落ちていく。\n発症までに時間がかかることが多く、粉塵曝露を開始してから10〜20年経過して発症するケースが多い。","d":"A"},{"id":417,"cat":"粉じん","q":"じん肺の合併症はなんですか","a":"じん肺管理区分が管理2-3に加えて\n肺結核\n結核性胸膜炎\n続発性気胸\n続発性気管支炎\n続発性気管支拡張症\n原発性肺がん。\n石綿肺による中皮腫は業務上疾病としては認められている。","d":"A"},{"id":419,"cat":"粉じん","q":"じん肺健診のXp、肺機能検査の判定 は","a":"レントゲン所見\nXp型\n両肺野にじん肺による粒状影、不整形陰影\n少数\n多数\n極めて多数\n大陰影\nなし\n第一型\n第二型\n第三型\nあり\n第四型\nじん肺管理区分\nレントゲン所見\nXp所見なし\nXp1型\nXp2型\nXp3 or Xp4ab\nXp4c\n肺機能障害\n(-)〜(+)\n管理1\n管理2\n管理3イ\n管理3ロ\n管理4\n(++)\n管理4\nXp4型(ab): 大陰影が肺野1/3未満\nXp4型(c): 大陰影が肺野1/3以上\n肺機能障害(++)：スパイロメトリー、フローボリューム曲線、血ガスから総合的に判断。","d":"A"},{"id":421,"cat":"粉じん","q":"じん肺管理区分の決定までの流れを教えてください","a":"じん肺健診対象者：常時粉塵作業に従事するもの\nじん肺健診で\nレントゲン所見が認められるものは\n都道府県労働局長にレントゲンを提出\n地方じん肺審査医の意見を参考に\n管理区分を決定する。","d":"A"},{"id":423,"cat":"粉じん","q":"じん肺管理区分の措置は","a":"管理区分\n措置内容\n管理1\n措置なし\n管理2\n曝露低減\n管理3イ\n労働局長勧奨→転換手当30日分\n作業転換努力義務、転換のための教育\n管理3ロ\n管理3イと同様、もしくは\n労働局長(地方じん肺審査医意見)指示→転換手当60日分\n作業転換義務\n管理4もしくは合併症\n療養\n作業転換推奨\n：\n作業時間の短縮、設備・工程・作業方法の改善措置","d":"A"},{"id":426,"cat":"粉じん","q":"じん肺健康診断とは？","a":"じん肺法に基づいて行われる健康診断。対象は、じん肺法施行規則別表で定められる24の粉じん作業に従事する、または過去に従事した労働者。\n受診者は30万人で、有所見者は916人、有所見率は0.3％。\n実施のタイミングは、就業時、定期、定期外（一般健診でじん肺所見が疑われた場合、療養後の復職時、随時など）、離職時。\n検査は胸部Xpと肺機能検査が基本で、必要に応じて結核の精密検査を行う。\nなお、管理3～4の有所見者の約9割は、退職者に対する随時健診から把握されている。","d":"A"},{"id":428,"cat":"粉じん","q":"じん肺健康診断とは？","a":"就業時健康診断、定期健康診断、定期外健康診断、離職時健康診断の4種類がある。\n就業時健康診断\n　新たに、常時じん肺作業に従事する者が対象となる。\n　ただし、過去にじん肺作業の従事歴があり、直近の管理区分が一定期間内に決定している場合は免除される。具体的には、管理1〜3イは1年以内、管理3ロは6か月以内に決定していれば免除。\n定期健康診断、離職時健康診断\n　離職時健康診断は、1年以上従事した者について、本人から求めがあった場合に実施する。\n粉塵作業の状況\n管理区分\n定期健康診断\n離職時健診(直近の健診からの経過期間)\n常時従事\n1\n3年以内ごと\n1年6ヶ月以上\n2-3\n1年以内ごと\n6ヶ月以上\n過去に従事\n2\n3年以内ごと\n6ヶ月以上\n3\n1年以内ごと","d":"A"},{"id":429,"cat":"粉じん","q":"じん肺健康診断とは？","a":"定期外健康診断\n・合併症により1年を超えて離職した後、休業または療養を要しないと診断された時\n・現在は粉塵作業以外に従事しているが、管理区分2に該当する労働者\n　（本来は3年おきだが、肺がんに関する検査という名目で検査を行う）\n・管理区分1でも、通常健診でじん肺所見ありと診断された時","d":"A"},{"id":430,"cat":"粉じん","q":"じん肺健康診断と石綿健康診断の違い","a":"対象物、健診の実施時期、健診内容、結果の保存期間は、それぞれの制度や有害因子によって異なる。\n石綿については、以前は特殊健康診断の枠組みで扱われていたため、6か月以内ごとの実施が前提となっていた。現在は、健康管理手帳が交付された場合に限り、6か月ごとに健診を受けられる整理となる。\n健診内容も同一ではなく、たとえばじん肺では胸部所見の確認に加え、肺機能検査を含む。","d":"A"},{"id":432,"cat":"粉じん","q":"第10次粉じん障害防止総合対策","a":"令和5年度から令和9年度までを対象とする5か年計画。じん肺有所見者は減少しているものの、新規有所見者は依然として発生しており、粉じん作業従事者も60万人と増加傾向にある。\n主な取組の方向性\n・呼吸保護具の適正選択・適正使用の徹底\n　「粉じん保護具着用管理責任者」を設けることや、電動ファン付き呼吸用保護具の使用を推奨する。\n・ずい道等建設工事における対策の強化\n　ずい道等建設工事粉じん対策ガイドラインに基づき、作業主任者の配置、粉じん発生源への措置（遠隔作業など）、換気の強化（吸入捕集方式、局所集じん機）を進める。粉じん目標レベルは2mg/㎥へ引き下げ、掘削作業などでは電動ファン付き呼吸用保護具の着用を義務とする。\n・じん肺健診の着実な実施\n　制度に沿って健診を確実に行い、早期把握につなげる。\n・離職後の健康管理の推進\n　健康管理手帳制度を周知し、離職後も必要なフォローが受けられるようにする。\n継続して重点となる作業例\n・アーク溶接、岩石等の裁断、金属研磨など","d":"A"},{"id":434,"cat":"粉じん","q":"じん肺の有所見者の多い作業は？","a":"1　溶接\n2　陶磁器\n3　鋳物\n4　トンネル","d":"B"},{"id":436,"cat":"粉じん","q":"溶接ヒュ－ムとは？","a":"金属アーク溶接等作業では、加熱により気化した金属が空気中で冷えて凝固し、空気中に浮遊する金属の微粒子として発生する。\n作業者の呼吸域では、粒径が0.1〜1 μm程度のものが多いとする報告もあり、吸い込まれると肺胞まで到達しやすい。\nなお、溶接ヒュームや塩基性酸化マンガンは特定化学物質の管理第2類に該当する。","d":"A"},{"id":438,"cat":"粉じん","q":"溶接ヒューム自体の有害性について 発がん性分類は？","a":"発がん性\n・IARCグループ1\nIARC Group1：肺がん（ただし、原因物質は特定されず、また、じん肺を機序とする原発性肺がんとの区別もついていない）\nその他（溶接ヒュームに含まれる成分の例）\n・酸化マンガン：神経機能障害、パーキンソン症候群\n・三酸化二マンガン：神経機能障害、呼吸機能障害","d":"A"},{"id":440,"cat":"粉じん","q":"溶接ヒュームの神経機能障害3種類","a":"マンガン及びその化合物による神経機能障害は、代表的に次のように整理され、それぞれの主な症状は以下のとおり。\n錐体外路症候\n（症状）寡動、筋緊張亢進、仮面様顔貌、振戦、歩行障害、後方突進、側方突進（前方突進はあまりみられない。）、言語障害、書字拙劣、小書症等のパーキンソン症候群様症状、痙性斜頸\n 錐体路症候\n（症状）腱反射亢進、バビンスキー反射陽性、歩行障害、言語障害\n 小脳症候\n（症状）変換運動障害、運動失調","d":"B"},{"id":442,"cat":"粉じん","q":"溶接ヒュ－ムの健康障害防止措置は？","a":"作業環境管理\n溶接方法や母材の変更で溶接ヒュームの低減\n全体換気装置の風量を上げる\n集塵装置を用いる\n個人サンプリング法で環境測定\n毎日の床掃除、不浸透性の床の設置\n洗浄設備の設置\n作業環境\n作業主任者の選任、作業方法の指導\n個人用保護具の適切な使用、フィットテストの確実な施行\n立ち入り禁止措置\n喫煙飲食の禁止\n健康管理\nじん肺健診の実施\n特化物健診の実施","d":"A"},{"id":444,"cat":"粉じん","q":"溶接ヒュ－ムの 特定化学物質健康診断の項目5つ","a":"業務の経歴の調査\n作業条件の簡易な調査\n溶接ヒュームによる症状の既往歴の確認\n　せき、たん、仮面様顔貌、膏こう顔、流涎えん、発汗異常、手指の振顫せん、書字拙劣、歩行障害、不随意性運動障害、発語異常等のパーキンソン症候群様症状について、既往歴の有無を確認する。\n溶接ヒュームによる症状の有無の確認\n　せき、たん、仮面様顔貌、膏こう顔、流涎えん、発汗異常、手指の振顫せん、書字拙劣、歩行障害、不随意性運動障害、発語異常等のパーキンソン症候群様症状が現在みられるかを確認する。\n握力の測定","d":"B"},{"id":446,"cat":"粉じん","q":"屋内の金属アーク溶接等従事者の特化物健診以外の健診2つ","a":"じん肺健康診\n断\n紫外線・赤外線健康診断","d":"B"},{"id":448,"cat":"粉じん","q":"溶接ヒュ－ムの濃度測定は？","a":"同レベルの作業ごとに、2名以上を対象として\n個人ばく露測定\nを行う。実施者は、第1種作業環境測定士や作業環境測定機関など。測定は、労働者の呼吸域で全時間測定とする。\nMnとして許容濃度0.05mg/㎥を超える場合は、まず作業環境側の改善を検討する。\n・換気装置の風量を増やす\n・溶接方法や材料を変更する\n・集じん装置で集じんする\nそれでも許容濃度を超える場合は、要求防護係数（曝露が0.05mg/㎥以下となる防護係数）以上の呼吸用保護具を選定し、適切に使用させる。","d":"A"},{"id":450,"cat":"粉じん","q":"溶接ヒュ－ム保護具のフィットテストは？","a":"金属アーク溶接作業等に従事する者は全員が対象となり、フィットテストは1年に1回以上実施する。実施方法はJIS T8150に定める手順に従う。\n実施時は、頭髪、ひげ、装飾具などが密着を妨げない状態で行う。\nフィットファクタは、保護具の外側の物質濃度／内側の物質濃度で表す。\n要求フィットファクタは、全面形面体で500、半面形面体で100。\nフィットテストの記録（氏名、日時、装着の良否など）は、作業終了から3年間保存する。","d":"A"},{"id":452,"cat":"粉じん","q":"溶接ヒュ－ムまとめ","a":"個人ばく露測定を実施し、結果は3年間保存する。\n測定した濃度に応じて、換気装置の風量増加、溶接方法や材料の見直し、集塵装置の導入など、必要な対策を検討して実施する。\n呼吸用保護具は要求防護係数を満たすものを選定し、適正に使用する。あわせてフィットテストを1年1回以上行い、記録を3年間保存する。\n特定化学物質作業主任者を選任し、装置の毎月点検や保護具の使用状況の確認などを行う。\n特定化学物質健康診断を実施し、必要に応じてじん肺健診もあわせて行う。\nさらに、安全衛生教育の実施、立入禁止の設定、休憩室や洗浄設備の整備、喫飲食の禁止など、作業管理面の措置も講じる。","d":"A"},{"id":454,"cat":"粉じん","q":"溶接作業のヒュ－ム以外の有害性","a":"アーク光：紫外線や赤外線により、電光性眼炎、白内障、皮膚障害が起こり得る。\nスパーク：火傷や火災の原因となる。\n感電：熱傷、心停止などにつながる。\n暑熱：熱中症のリスクが高まる。\n一酸化炭素：一酸化炭素中毒を起こし得る。\nオゾン：発生することがあり、吸入による健康影響に注意が必要。\n騒音：難聴などのリスクとなる。","d":"A"},{"id":456,"cat":"粉じん","q":"紫外線、赤外線の目、皮膚への影響2つ","a":"紫外線による眼障害として、急性の眼炎や、慢性的な白内障などが挙げられる。\n赤外線による眼障害としては、白内障や黄斑変性などが知られる。\nまた、紫外線へのばく露による皮膚障害には、菱形皮膚や皮膚がんなどがある。\n赤外線へのばく露による皮膚障害としては、熱火傷がみられる。","d":"B"},{"id":458,"cat":"粉じん","q":"溶接ヒュームの作業環境測定はどの項目で必要か","a":"特化物としては必要。\n一方で、粉塵としては特定粉塵作業に該当しないため不要。\nじん肺健診は必要。\n常時粉塵作業に従事している場合は対象となる。","d":"A"},{"id":460,"cat":"粉じん","q":"溶接ヒュームが特定化学物質の管理第２類物質となり追加される規制は?","a":"特化物としての規制として\n・屋内作業場でのアーク溶接時には全体換気装置が必要\n・有効な呼吸用保護具の着用義務\n・水洗い等で毎日1回以上掃除\n・特定化学物質作業主任者選任\n・特化物健診の実施\n屋内作業場において、新たにアーク溶接作業を採用したとき\n・溶接ヒュームの濃度測定\n・呼吸用保護具のフィットテスト\n濃度測定は個人暴露測定とする。","d":"A"},{"id":462,"cat":"粉じん","q":"溶接ヒュームの濃度測定とフィットテストはどのように行いますか","a":"濃度測定は、第1種作業環境測定士や作業環境測定機関が実施する。\nデザイン：金属アーク溶接作業に従事する全ての時間を対象に測定する。\nサンプリング：試料採取機器を呼吸域に装着し、マスクの内側に採取口を置く。分流装置を用いた濾過捕集方式で行う。\n分析：吸光光度分析、電子吸光分析などを用いる。\nフィットテスト：マスクが顔面に適切に密着しているかを確認する検査。溶接ヒュームでは定量的フィットテストを行い、呼吸用保護具の内外で濃度を測定してフィットファクタを算出し、要求防護係数を上回っているかを確認する。","d":"A"},{"id":465,"cat":"アスベスト","q":"アスベストとは？","a":"アスベスト（石綿）\n繊維状けい酸塩鉱物で、不燃性、耐熱性、絶縁性、耐蝕性、耐久性などの性質に優れる。加工しやすく安価なため、断熱材、耐火被覆材、建材、船材などに広く用いられてきた。\n2006年9月以降は、輸入・製造・使用が禁止となっている。一方で、それ以前に着工した建造物や船舶には含まれている可能性があり、石綿作業は2030年頃にピークを迎えるとされる。\n発がん性は、青＞茶＞白の順とされる（クロシドライト＞アモサイト＞クリソタイル）。","d":"A"},{"id":467,"cat":"アスベスト","q":"アスベストのレベルとは？","a":"飛散性に応じてレベル1〜3に区分され、レベル1ほど飛散しやすく、結果として有害性も高い扱いとなる。\nレベル1：石綿含有吹き付け材。耐火建築物などのはり、柱などで、耐火被覆の目的で吹き付けられたもの。\nレベル2：石綿含有保温材、耐火被覆材、断熱材。配管の保温材、柱の耐火被覆材、屋根の断熱材として張り付けられたもの。\nレベル3：その他の石綿含有建材。天井や壁などに使うため、板状に成形されたものなど。","d":"A"},{"id":469,"cat":"アスベスト","q":"アスベストによる疾病は？","a":"石綿曝露に関連する代表的な疾病は、石綿肺、肺癌、中皮腫、良性石綿胸水、びまん性胸膜肥厚の5つ。\nこれらが石綿曝露によるものと認定されれば、労災給付や特別遺族給付金の対象となる。","d":"A"},{"id":471,"cat":"アスベスト","q":"建築物の解体、修繕で必要な手続きは？","a":"建築物・工作物・船舶の解体、リフォーム、修繕などの場面では、石綿への対応が必要となる。\n事前調査：すべての工事で実施が必要。特定建築物石綿含有建材調査者などの有資格者が、図面確認や目視等により石綿の有無を調査し、記録を3年間保存する。\n事前調査結果等の届出：床面積が80㎡以上、請負金100万円以上など、一定規模の工事では届出が必要となる。所轄の労働基準監督署へ提出する。\n計画届：レベル1～2の作業では、作業方法、粉じん発散防止・抑制対策、曝露防止対策などをまとめ、作業開始の14日前までに労働基準監督署長へ提出する。","d":"A"},{"id":473,"cat":"アスベスト","q":"建築物の解体、修繕で必要な手続きは？","a":"・計画届\n　レベル1、2を扱う石綿取扱作業では計画届を作成し、作業開始の14日前までに労基署へ提出する必要がある。\n計画届に記載する主な事項\n① 作業方法および作業の順序\n② 石綿粉塵の発散を防止・抑制する方法\n③ 労働者の石綿曝露を防止する方法","d":"A"},{"id":474,"cat":"アスベスト","q":"建築物の解体、修繕で必要な手続きは？","a":"建築物の解体工事を行う場合は、石綿に関する事前調査を全ての工事で実施する必要がある。調査は、目視や設計図書等を用いて行う。\nその方法でも石綿等の使用の有無が判断できない場合は、分析調査を実施する（石綿含有として扱う場合は分析調査は不要）。\n調査結果は記録として残し、3年間保存する。あわせて、作業場の見やすい場所に掲示しなければならない。\nまた、事前調査結果は一定規模以上の工事で労基署への提出が必要となる。\n・解体面積が80m2以上の建築物解体工事\n・請負金額が100万円以上の改修工事・解体工事","d":"A"},{"id":475,"cat":"アスベスト","q":"アスベストの健康障害防止対策は？","a":"作業環境管理\n事前調査、作業計画の策定、届出\n作業場の隔離密閉、セキュリティゾーンの設置\n隔離解除前に陰圧の確認(Lv. 1, 2)\n集塵排気装置の設置(HEPAフィルター)\n前室は陰圧に保つ(Lv. 1, 2)\n作業環境を\n湿潤\nに保つ\n作業管理\n個人用防護具(防塵マスク、送気マスク、保護衣)\n石綿除去作業では電動ファン付きマスク\n立入禁止区域の設定\n作業手順書を整備して労働者に周知\n健康管理\n石綿健診\nじん肺健診","d":"A"},{"id":477,"cat":"アスベスト","q":"石綿取扱作業における設備を説明してください","a":"レベル1およびレベル2の建材除去等作業では、負圧隔離などの対策（セキュリティゾーンの設置）が求められる。\nセキュリティゾーンは、前室、洗身室、更衣室で構成される。\n作業室は集塵・排気装置により負圧化し、負圧が確保されているかを確認する。確認のタイミングは、作業開始前と中断後の再開時とし、マノメーターやスモークテスト、風量測定などを用いて評価する。","d":"A"},{"id":479,"cat":"アスベスト","q":"石綿の調査は誰が行いますか。","a":"石綿含有建材調査者。\n2020 年 7 月の石綿障害予防規則等の改正により、建築物等の解体又は改修における石綿等使用有無の事前調査を実施する者（建築物石綿含有建材調査者）は、建築物石綿含有建材調査者講習を受講し、修了考査に合格しなければならないこととされました。\n2026年から、特定工作物の事前調査をできるのは、工作物石綿事前調査者のみ。","d":"A"},{"id":481,"cat":"アスベスト","q":"石綿健康診断とは？","a":"【時期】\n雇用時、配置替え時に加え、業務従事中は6か月以内に1回実施する。\n【内容】\n業務の経歴の調査を行う。\nたん、息切れ、胸痛などについて、他覚症状・自覚症状の既往と現症を確認する。\n胸部X線直接撮影による検査を実施する。\n【記録】\n石綿健康診断個人票は、作業記録とあわせて、業務終了後40年間保存する。","d":"A"},{"id":483,"cat":"アスベスト","q":"アスベストの労災認定基準は？","a":"疾患ごとに判断。\nじん肺管理区分使用。以下を満たさなくても労働局、労基署の判断で認定。\n石綿肺\n　管理4、または、管理2－4の合併症\n中皮腫\n　最初の石綿曝露作業から10年以上で、①胸部Xpで有所見②作業1年以上のいずれか。\n肺がん\n　最初の石綿曝露作業から10年以上で、①胸部Xpで有所見②胸膜プラ－ク＋作業10年以上③広範囲のプラ－ク＋作業1年以上④石綿小体・石綿繊維＋作業1年以上⑤びまん性胸膜肥厚に続発⑥特定3作業(紡織製品製造、セメント製品製造、吹付)＋作業5年以上のいずれか\n良性石綿胸水\n　石綿以外の原因を除外\nびまん性胸膜肥厚\n　①作業3年以上②F(＋＋)③肥厚の広がり(片側1/2以上or両側1/4以上)のすべて\nを満たす","d":"A"},{"id":485,"cat":"アスベスト","q":"アスベストの健康管理手帳の交付要件は？","a":"①（直接業務 or 周辺業務）に該当し、かつXp所見（不整形陰影、胸膜肥厚）が認められること。\n② 次の作業に1年以上従事し、従事開始から10年以上が経過していること。\n・製造作業\n・レベル2の張り付け、補修、除去\n・レベル1の吹き付け、解体、破砕等\n③ ②以外の直接業務に10年以上従事していること（レベル3など）。\n用語整理\n直接業務：製造、取扱、吹き付け、解体等\n周辺業務：立ち入り禁止措置内で、石綿を取り扱わない作業","d":"A"},{"id":487,"cat":"アスベスト","q":"石綿取扱作業従事者への労働者教育は？","a":"労働者を石綿作業に新たに従事させる場合は、特別教育を実施する必要がある。教育内容には、少なくとも次の項目を含める。\n・石綿の有害性\n・石綿の使用状況\n・石綿の粉塵発散を抑制するための措置\n・保護具の使用方法","d":"A"},{"id":489,"cat":"アスベスト","q":"個人事業主への健康障害予防は？","a":"国の規制権限の不行使が違法と判断された「建築アスベスト訴訟」の最高裁判決を踏まえ、石綿障害予防規則、有機溶剤中毒予防規則、特定化学物質障害予防規則など、合計11の省令が改正された。\n改正のポイントは、会社が雇用する労働者に限らず、同じ作業場所で働く請負人（いわゆる一人親方、下請業者）、資材搬入業者、警備員などに対しても、同等の保護措置を講じる義務が明確化された点にある。\n具体的には、指揮命令系統にない者も想定し、作業方法、保護具使用の必要性、取扱物質の有害性について、掲示等により周知する義務（周知まで）が求められる。\nさらに、特定行為の禁止、退避、立入禁止といった事項については、作業場所の管理責任に基づき、守らせる義務（遵守まで）が課される。","d":"A"},{"id":491,"cat":"アスベスト","q":"石綿の作業記録の保存場所は","a":"事業者が事業を廃止していない限り、作業の記録の保存は事業者に義務付けられており、行政には作業記録はありません。事業者が事業を廃止した場合は、石綿則第 49 条の石綿関係記録等の報告により労働基準監督署長に作業記録が提出されますので、労働基準監督署にも記録が残ることになります。","d":"B"},{"id":493,"cat":"アスベスト","q":"石綿則の最近の改正まとめ","a":"令和2年（2020年）7月の石綿則改正では、解体・改修工事の現場で、作業開始前の石綿含有の有無の事前調査など、石綿則で求められる措置が十分に実施されていない事例がみられたことを背景に、手続きと管理の徹底が図られた。\n主なポイント\n・事前調査の実施と、調査結果の3年間の記録保存\n・床面積が80㎡以上、請負金100万円以上など一定規模の工事では、労働基準監督署へ事前調査結果等を届け出る\n・レベル1〜2の作業では、作業計画を14日前までに届け出る\n・作業の実施状況を写真等で記録し、3年間保存する\n・集じん・排気装置を変更した場合は点検を行い、排気口で粉じん測定を実施する\n・負圧が中断した場合は、マノメーターや風量計で点検する\n・隔離解除前に、有資格者が取り残し（残存）がないことを確認する\n・湿潤化の考え方は、「湿潤化」または「除じん性能を有する電動工具」の使用へ整理された","d":"A"},{"id":496,"cat":"アスベスト","q":"最近の石綿に関するトピックスについて述べてください","a":"・一人親方の石綿被災も労災として扱う\n・石綿が原因で死亡した遺族への給付金の請求期限が10年延長\n・石綿事前調査が電子報告できるようになった\n・事前調査を有資格者が行うことを義務化\n・2030年に解体のピークと。","d":"A"},{"id":497,"cat":"アスベスト","q":"石綿救済制度とは","a":"令和4年6月17日に、改正石綿健康被害救済法が公布・施行された。今回の改正では、特別遺族給付金について、請求できる期限が延長され、あわせて支給対象も広がった。\nこの制度は、石綿による健康被害のうち、仕事が原因で発症した場合は原則として労災補償の対象となる一方、労災補償の枠外となる被害者を速やかに救済する目的で設けられた。石綿健康被害救済法は平成18年3月27日から施行されている。\n同法により、労災補償の対象とならない周辺住民などには救済給付が支給される。また、労災補償を受けないまま亡くなった労働者の遺族に対しては、一定の要件のもとで特別遺族給付金が支給される。","d":"B"},{"id":500,"cat":"電離放射線","q":"電離放射線と非電離放射線の違いは？","a":"電離放射線\nα線、β線、X線、γ線、中性子線など。エネルギーが大きく電離作用をもつため、細胞内の原子結合を切断しやすい。その結果、DNA損傷を起こし、発がん性や生殖毒性などのリスクにつながる。\n非電離放射線\n紫外線、可視光線、赤外線、電波など。電離作用は基本的に持たず、周波数が低いほど回折しやすい性質がある。","d":"A"},{"id":502,"cat":"電離放射線","q":"省令で電離放射線に該当するもの8つ","a":"α線, β線, γ線, X線, 陽子線、重陽子線、電子線、中性子線。","d":"B"},{"id":504,"cat":"電離放射線","q":"放射線関連の用語と単位\t","a":"放射能\n：\nベクレル\n　放射線を出す能力\n吸収線量\n：\nグレイ\n　物質が吸収するエネルギ－量\n等価線量\n：\nシ－ベルト\n　組織・臓器ごとに与える影響\n　吸収線量×放射線荷重係数(種類による強さ)\n実効線量\n：\nシ－ベルト\n　全身に与える影響\n　等価線量×組織荷重係数(組織の感受性)の総和","d":"A"},{"id":506,"cat":"電離放射線","q":"電離放射線の身体への影響は？","a":"確定的影響と確率的影響。\n確定的影響は、一定の閾値を超える放射線量に曝露したときに生じる影響で、被ばく量が増えるほど重症化しやすい。急性の例として骨髄抑制、皮膚炎、脱毛、不妊、吐き気などがあり、慢性的な例として白内障、緑内障などが挙げられる。\n確率的影響は、明確な閾値がないと考えられ、被ばく量に応じて一定の確率で発生する影響を指す。代表例は、がんや白血病。","d":"A"},{"id":508,"cat":"電離放射線","q":"被ばくの種類","a":"外部被ばく：体外にある放射性物質（線源）から受ける被ばく。蛍光ガラス線量計や熱ルミネッセンス線量計などで測定する。対策としては、線源の除去、隔離、遮蔽、作業時間の短縮、防護服の着用などを行う。\n内部被ばく：放射性物質で汚染された粉じん等を吸入したり、経口摂取したりして体内に取り込むことで生じる被ばく。測定は、体外計測法（ホールボディカウンター）やバイオアッセイ法（尿中放射性物質など）で行う。対策としては、隔離、局所排気装置の使用、防護具の着用、作業場での飲食・喫煙の禁止などが挙げられる。","d":"B"},{"id":510,"cat":"電離放射線","q":"被ばく規制は？","a":"50mSV/年、かつ、100ｍSV/5年\n水晶体\n50mSV/年、かつ、100mSV/5年\n皮膚\n500mSV/年\n女性\n　5mSV/3か月\n妊婦\n　内部被ばくで1mSV/年\n　腹部表面で2mSV/年　\n（\n20mSV/\n年以上で白内障検査の省略不可）","d":"A"},{"id":512,"cat":"電離放射線","q":"線量測定方法","a":"外部被ばく線量と内部被ばく線量では、評価の方法が異なる。\n外部被ばく線量：蛍光ガラス線量計、熱ルミネッセンス線量計などで測定する。\n蛍光ガラス線量計は、いわゆるガラスバッジとして装着するタイプ。\n内部被ばく線量：体外計測法またはバイオアッセイ法で評価する。\nバイオアッセイ法は、尿などの排泄物をはじめとする人体試料を分析し、体内に取り込まれた放射能の程度を見積もる方法。","d":"B"},{"id":514,"cat":"電離放射線","q":"放射線の線量測定の体の部位","a":"妊娠可能な女性はお腹、それ以外は胸部\nもしくはそのほかの最も多く被曝しうる場所。","d":"B"},{"id":516,"cat":"電離放射線","q":"放射線の健康障害防止策は？","a":"作業環境管理\n放射線源の\n遮蔽、\n隔離、封じ込め\n管理区域の設定\n局所換気装置の設定\n作業環境測定\n放射線取扱作業室から物質や物品を持ち出す時の線量測定\n作業管理\n作業時間の短縮\n防護具の適切な選択、装着\n線量計の適切な着用\n作業手順書の整備及び周知\n健康管理\n電離放射線特殊健診","d":"A"},{"id":518,"cat":"電離放射線","q":"放射線防護の3原則を教えてください","a":"放射線防護の基本は「時間・遮蔽・距離」。\n・時間：被ばく時間を短くする\n・距離：線源から離れる\n・遮蔽：間に遮へい物を入れて線量を下げる","d":"A"},{"id":520,"cat":"電離放射線","q":"電離放射線特殊健診とは？","a":"実施時期：雇入れ時、配置替え時、業務従事中は6か月以内ごとに1回実施する。\n確認・検査項目\n・被ばく歴の有無（内容と期間）\n・放射線障害や自覚症状の有無\n・血液検査（白血球数と白血球百分率、赤血球数と血色素量）\n・白内障検査\n・皮膚検査","d":"A"},{"id":522,"cat":"電離放射線","q":"改正電離放射線障害防止則の要点は？","a":"令和3年4月1日から施行。\n・水晶体等価線量の限度は、1年あたり50mSv、5年あたり100mSvへ引き下げられた。\n・2年連続で水晶体等価線量が20mSvを超える見込みがある場合は、白内障検査を省略できない。\n・防護眼鏡の使用が推奨される。\n・水晶体の等価線量について、3か月ごと・1年ごと・5年ごとの累積値を算定し、記録として保存する。","d":"A"},{"id":524,"cat":"電離放射線","q":"赤外線、紫外線、より有害なのは？ 代表的な作用。","a":"紫外線の方が波長が短く有害\n白内障の原因となる","d":"A"},{"id":526,"cat":"電離放射線","q":"発がん性物質","a":"発がん性物質の分類法を教えてください","d":"A"},{"id":528,"cat":"電離放射線","q":"発がん性物質の分類法を教えてください","a":"国際がん研究機関（IARC）は、発がん性を4つのグループに分類している。\nこの分類は、発がん性の「強さ」や「発がん部位」で区分するものではなく、ヒトに対する発がん性について、証拠の確からしさ（エビデンスの強さ）に基づいて整理する考え方。","d":"A"},{"id":529,"cat":"電離放射線","q":"発がん性物質の日本の分類は？","a":"産業衛生学会が定める発がん性分類。\n第1群：ヒトに対して発がん性があると判断できるもの。\nアスベスト、溶接ヒュ－ム、ベンゼン、ベリリウム、1,2－ジクロロプロパン、オルト－トルイジン、カドミウム、電離放射線など。\n第2群A：ヒトに対しておそらく発がん性があり、証拠が比較的十分なもの。\nインジウム、ジクロロメタン、スチレンなど。\n第2群B：ヒトに対しておそらく発がん性があると考えられるが、証拠が比較的十分でないもの。\n鉛、クロロホルム、四塩化炭素など。","d":"A"},{"id":532,"cat":"電離放射線","q":"職場における発がん性物質やその事例について教えてください","a":"1,2-ジクロロプロパン。\n印刷会社で、胆管がんの発症者が17人、うち9人が死亡したケース。\n作業環境管理：洗浄液として1,2-ジクロロプロパンを使用。発色を良くする目的で気密性の高い環境が求められ、密閉性の高い地下で作業していたが、局排などの換気装置は設置されていなかった。\n作業管理：安全管理者の選任なし、職長教育なし。\n健康管理：定期健康診断の結果報告も行われていなかった。","d":"A"},{"id":534,"cat":"電離放射線","q":"職場における発がん性物質やその事例について教えてください","a":"オルトトルイジンの事例\n染料工場で、5名が膀胱がんを発症した事例が報告されている。\n染料の原料を乾燥させて袋詰めする作業に従事していた労働者の尿から、他の従業員より高濃度のオルトトルイジンが検出された。\n作業環境管理の状況\n・染料合成の溶媒としてオルトトルイジンを使用していた\n・作業環境測定では、気中濃度は許容濃度以下だった\n作業管理の状況\n・作業衣の汚染がしばしばみられた\n・保護手袋も汚染されたものを繰り返し使用していた\nこれらから、主な曝露経路は吸入ではなく経皮曝露であった可能性が高い。再現作業でも尿中濃度が高値となり、この推定を裏付ける所見となった。","d":"A"},{"id":535,"cat":"電離放射線","q":"職場における発がん性物質やその事例について教えてください","a":"MOCA事件（2021年）\n静岡県の化学工場で、ウレタンの軟化剤であるMOCAを取り扱っていた労働者が膀胱がんを発症し、労災として認定された事例。\nMOCAは、1976年に特化物第2類・特別管理物質に位置付けられ、1993年には許容濃度が設定され、2010年にはIARC Group1に分類されるなど、以前から危険性が指摘されていた。\n一方で潜伏期間が非常に長く、2021年に初めて4名が労災認定となった。曝露開始から発症まで20〜45年程度を要している。\n膀胱がんとの関連が指摘される物質としては、ベンジジン、オーラミン、βナフチルアミン、αナフチルアミンなども挙げられる。","d":"A"},{"id":536,"cat":"電離放射線","q":"変異原性、がん原性とは？","a":"変異原性：生物の遺伝情報（DNAなど）に不可逆的な変化を起こし得る性質。体細胞に変化が生じれば発がんにつながり得て、生殖細胞に変化が生じれば遺伝性の影響につながり得る。例として、放射線、紫外線、環境汚染物質など。\nがん原性：がんの発生を誘発・促進する性質。DNAへ直接変化を与える場合だけでなく、慢性的な炎症や物理的刺激など、複数の経路で作用し得る。例として、塩酸などの化学物質、アスベスト、コーヒー、タバコなど。","d":"B"},{"id":538,"cat":"電離放射線","q":"GLPとは？","a":"GLP（Good Laboratory Practice）は、試験施設で行う試験の信頼性を担保するための基準。\n化学物質分野のGLPでは、その施設の安全性試験が信用できるかどうかを、運営管理、試験設備、試験計画、記録管理、内部監査体制などがGLPに適合しているかという観点で確認し、査察が行われる。\n申請先は試験区分により分かれる。人の健康影響に関する試験は厚生労働省、分解性・蓄積性に関する試験は経済産業省、生態毒性に関する試験は環境省に申請する。","d":"B"},{"id":541,"cat":"熱中症","q":"熱中症とは？","a":"暑熱環境での発汗などにより、水分や電解質が失われたり、体温調節がうまく働かなくなったりすることで生じる一連の症状をまとめた呼び方。\n令和6年の職場における熱中症による死傷者は1,257名、死亡者は31名とされている。背景として、WBGTを把握しないまま作業していた例や、熱中症に関する労働衛生教育が実施されていなかった例が多い。","d":"A"},{"id":545,"cat":"熱中症","q":"WBGTとは？","a":"WBGTは Wet Bulb Globe Temperature（湿球黒球温度）の略で、単位は℃。\n暑熱環境による熱ストレスを評価するための「暑さ指数」。\n人が感じる暑さは、気温・湿度・気流・輻射熱の影響で決まる。WBGTは、これらの要素をまとめて反映させた指標。","d":"A"},{"id":547,"cat":"熱中症","q":"WBGTの測定方法は？","a":"湿球温度は湿度や気流の影響を反映し、黒球温度は輻射熱の影響を表す。乾球温度は一般的な気温を示す。\nWBGT（暑さ指数）の算出式\n・屋外（日射あり）：WBGT＝0.7×湿球＋0.2×黒球＋0.1×乾球\n・屋外（日射なし）／室内：WBGT＝0.7×湿球＋0.3×黒球\n身体作業強度に応じた基準が設定されており、基準を超える場合は作業中止を含めた対策を講じる。\n測定高さの目安：1.2〜1.5m","d":"A"},{"id":549,"cat":"熱中症","q":"WBGTの測定方法は？","a":"黒球温度：輻射熱を反映する。\n黒く薄く塗装された銅板の球の中に温度計を入れて測定し、直射日光にさらした状態での平衡温度を読む。弱風時の日なたで感じる暑さ（体感温度）と相関しやすい。\n湿球温度：湿度の影響を反映する。\n温度計の球部を水で湿らせたガーゼで覆って測定し、蒸発による冷却と周囲からの熱のつり合いで決まる温度となる。汗が蒸発するときに感じる涼しさ（蒸発しやすさ）を表す。\n乾球温度：気温を反映する。\n通常の温度計で測定する。","d":"A"},{"id":550,"cat":"熱中症","q":"室内のWBGTについて教えてください","a":"黒球温度=乾球温度となるので気温、湿度のみで表現可能。\n簡易表をもとに算出可能。","d":"A"},{"id":552,"cat":"熱中症","q":"熱中症の管理でWBGT以外に考慮すべきもの","a":"暑熱順化の有無\n身体作業強度\n(気流があるか)","d":"A"},{"id":554,"cat":"熱中症","q":"WBGT基準値とは","a":"WBGTの基準値は、「ほとんどの健康な労働者が曝露されても、有害な影響を受けにくい目安の数値」として用いられる。\n基準値の考え方\n・身体作業強度（代謝率レベル）\n・暑熱順化の有無\n・加えて、必要に応じて着衣補正値を反映する\n暑熱順化者とは\n評価期間の少なくとも1週間前から、同様の全労働期間にわたり、高温作業条件に曝露されていた人を指す。\nまた、暑熱への曝露が中断すると、4日後頃から順化の低下が目立ち始め、3〜4週間でほぼ失われる。","d":"A"},{"id":556,"cat":"熱中症","q":"WBGT基準値とは","a":"を超える場合の対応","d":"A"},{"id":558,"cat":"熱中症","q":"WBGT基準値を超える場合の対応","a":"・冷房設備などを活用し、当該作業場所のWBGTが基準値より低くなるよう環境を調整すること。\n・身体作業強度（代謝率レベル）がより低い作業へ切り替えること（表1-1参照）。\n・WBGT値が基準値を下回る別の作業場所へ作業を移すこと。","d":"A"},{"id":559,"cat":"熱中症","q":"WBGT はいつから測りだすの？","a":"「WBGT値がWBGT基準値を超えることが予想される場合から」\n厚労省の「職場における熱中症予防基本対策要綱」では、事前の見込みとして、作業環境のWBGT値が表1-1のWBGT基準値（以下「WBGT基準値」）を上回ると予想されるときは、作業中にWBGT値を測定するよう努める、と整理されている。","d":"B"},{"id":561,"cat":"熱中症","q":"熱中症予防対策は？","a":"作業環境測定\nWBGTの測定、把握、評価\n屋根や通風設備、熱の遮蔽物を設置\n水分や塩分を摂取できるようにする\n寒冷で臥床できる休憩場所\nおしぼり、水風呂、シャワーの設置\n作業管理\n作業時間の短縮、WBGT値に合わせた休憩時間\n7日以上かけて熱順化\n水分塩分摂取励行\n作業服を通気性の良いものにする、空調服導入\n健康管理\n始業前に体調や飲酒状況の確認、朝食の有無\n作業前後に体温や体重測定で健康管理","d":"A"},{"id":564,"cat":"熱中症","q":"熱中症の現場での対応","a":"キーワードは「FIRE」\nF (Fluid)：水分補給\nI (Icing)：冷却\nR (Rest)：暑熱環境の回避と安静\nE (Emergency)：緊急事態の認識、119番通報。","d":"A"},{"id":566,"cat":"熱中症","q":"熱中症についての労働衛生教育は何をしますか","a":"（１）熱中症の症状 （２）熱中症の予防方法 （３）緊急時の救急処置 （４）熱中症の事例","d":"A"},{"id":568,"cat":"熱中症","q":"熱中症になりやすい人を就業前に見つけ、対策を行いたいです。どうすればいいですか","a":"日常の健康管理：\n睡眠不足、体調不良、前日の飲酒、朝食の未摂取\n疾病：糖尿病、高血圧、心疾患、腎不全、精神疾患\n作業前：\n前夜の睡眠時間\n前日の疲労回復 状況\n朝食の摂取の有無\n体温、体重の測定\n熱中症発症の可能性のある労働者がいる場合は、事業者は負荷の小さい作業 に替えるなどの対応を取っています。","d":"A"},{"id":570,"cat":"熱中症","q":"R7.6の改正での義務化の内容","a":"暑熱な場所\n」とは\nWBGT（湿球黒球温度）28度又は気温31度以上の作業場\nで、「暑熱な場所において連続して行われる作業等熱中症を生ずるおそれのある作業」とは、\n継続して1時間以上又は1日当たり4時間を超えて行われる\n① 早期発見・報告体制の整備\n②救急処置の手順作成\n（作業離脱、身体冷却、緊急連絡網、緊急搬送先の連絡先、#7119含む）\n③上記の関係者への周知\nhttps://www.mhlw.go.jp/content/001490909.pdf","d":"A"},{"id":572,"cat":"熱中症","q":"積極的に熱中症が生じた疑いのある作業者を早期に発見する観点から推奨される方法は","a":"・責任者等による作業場所の巡視\n・２人以上の作業者が作業中に互いの健康状態を確認するバディ制の採用\n・ウェアラブルデバイスを用いた作業者の熱中症のリスク管理（他の方法と組み合わせて使う）\n・責任者・労働者双方向での定期連絡やこれらの措置の組合せ\nhttps://www.mhlw.go.jp/content/001490909.pdf","d":"A"},{"id":574,"cat":"熱中症","q":"労働者への周知の方法は","a":"「周知」は、報告先等が作業者に確実に伝わることが必要\n事業場の見やすい箇所への掲示\nメール、文書の配布\n朝礼における伝達等口頭\nhttps://www.mhlw.go.jp/content/001490909.pdf","d":"B"},{"id":576,"cat":"熱中症","q":"身体の冷却の方法とは","a":"作業着を脱がせて水をかける\nアイスバス\n十分に涼しい休憩所に避難\nミストファン\nアイススラリー（流動性の氷状飲料）の摂取\nこの間、容態が急変する場合があることから、熱中症を生じたおそ\nれがある作業者を一人きりにすることなく、他の作業者等が見守ることが重要","d":"B"},{"id":578,"cat":"熱中症","q":"暑熱環境の製造業で４月からは何するの？","a":"厚労省が実施する「STOP！熱中症 クールワークキャンペーン」では、4月を準備期間として位置づけています。\n準備期間に行う主な取組は、次の3点です。\n(1) 暑さ指数（WBGT）を把握するための準備\n(2) 作業計画の策定など、運用面の事前整備\n(3) 緊急時対応について、手順や連絡体制をあらかじめ確認すること","d":"B"},{"id":580,"cat":"熱中症","q":"WBGTの実測ができない場合の代替方法","a":"日射や発熱体がなく、温度と湿度がほぼ一様で、気流も弱い室内作業環境を想定する。\nこのような環境で熱ストレス評価を行う際には、日本生気象学会が作成した「日常生活における熱中症予防指針」に掲載されている「図3：室内を対象とした気温と相対湿度からWBGTを簡易的に推定する図（室内用のWBGT簡易推定図）」などが参考になる。","d":"B"},{"id":583,"cat":"振動","q":"振動にばく露しうる作業を教えてください","a":"ジグゾー、サンダー、インパクトレンチ、チェーンソー、ショットハンマー、コンクリートブレーカーなどの振動工具を使用する職場では、振動障害が生じるおそれがある。\n林業や鉱業に限らず、近年は建設業や製造業でも幅広くみられるようになっている。\n用語の補足\n・ジグゾー：糸鋸\n・サンダー：回転丸鋸\n・インパクトレンチ：ナットを閉めるもの","d":"A"},{"id":585,"cat":"振動","q":"その工具が振動のリスクがあるかどうかどのように判断しますか","a":"振動値で表され、周波数補正振動加速度実効値の3軸合成値が工具に表記されています。","d":"A"},{"id":587,"cat":"振動","q":"振動の健康障害は？","a":"振動障害は、末梢循環障害、末梢神経障害、運動器障害の3つに大別できる。\n四肢の健康障害としては、手足のしびれ、冷え、こわばり、レイノー現象などがみられる。\nまた、全身の健康障害として、腰痛、脊柱異常、胃腸障害などが起こることもある。","d":"A"},{"id":589,"cat":"振動","q":"振動による健康障害防止対策を教えてください","a":"作業環境管理\n振動作業の低減\n作業の自動化、低振動工具の導入、工具の整備\n日振動曝露量A(8)での作業環境測定\n作業管理\n防振手袋\n作業時間の短縮\n作業方法の適正化(ハンドル部分以外は持たない、強く握らない)\n工具をスプリングやバランサーで支える\n健康管理\n特殊健診\n、禁煙","d":"A"},{"id":591,"cat":"振動","q":"振動障害予防の方針はどのように決定しますか","a":"日振動ばく露量A(8)が5.0を超えないように、振動ばく露時間を抑えるとともに、低振動の振動工具を選定する。\nA(8)が2.
